<style>
  :root {
    color-scheme: light;
    --bg: #f4f6f9; --surface: #ffffff; --line: #e3e7ed; --line2: #cfd6df;
    --t1: #14181f; --t2: #4a5361; --t3: #7a8494;
    --navy: #1f3864; --navy2: #2b4c86; --brand-soft: #e8eef8;
    --series-1: #2a78d6;
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
    --sans: "IBM Plex Sans KR", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--t1); font-family: var(--sans); font-size: 14px; line-height: 1.55; }
  a { color: inherit; }
  .gnb { background: var(--navy); color: #fff; }
  .gnb .in { max-width: 1280px; margin: 0 auto; padding: 0 28px; height: 60px; display: flex; align-items: center; gap: 36px; }
  .logo { font-weight: 700; font-size: 17px; letter-spacing: -.02em; }
  .logo small { font-weight: 400; opacity: .7; margin-left: 8px; font-size: 13px; }
  .gnb nav { display: flex; gap: 26px; font-size: 14.5px; }
  .gnb nav a { text-decoration: none; opacity: .75; padding: 19px 0; }
  .gnb nav a.on { opacity: 1; font-weight: 600; box-shadow: inset 0 -3px 0 #fff; }
  .gnb .user { margin-left: auto; font-size: 13px; opacity: .8; }

  .hero { background: linear-gradient(180deg, var(--navy) 0%, var(--navy2) 100%); color: #fff; padding: 34px 0 70px; }
  .hero .in { max-width: 1280px; margin: 0 auto; padding: 0 28px; }
  .hero h1 { margin: 0 0 6px; font-size: 30px; font-weight: 600; letter-spacing: -.03em; }
  .hero p { margin: 0 0 22px; opacity: .8; font-size: 15px; }
  .sbox { display: flex; background: #fff; border-radius: 8px; overflow: hidden; max-width: 760px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  .sbox input { flex: 1; border: 0; padding: 16px 20px; font: inherit; font-size: 16px; outline: none; }
  .sbox button { border: 0; background: var(--series-1); color: #fff; font: inherit; font-weight: 600; padding: 0 28px; cursor: pointer; }
  .qtags { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; font-size: 13px; }
  .qtags span { opacity: .7; }
  .qtags button { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; }

  .wrap { max-width: 1280px; margin: -44px auto 0; padding: 0 28px 60px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px 20px; cursor: pointer; display: flex; align-items: center; gap: 14px; }
  .stat:hover { border-color: var(--series-1); }
  .stat .ic { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; font-size: 18px; background: var(--brand-soft); }
  .stat .v { font-size: 26px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat .l { font-size: 13px; color: var(--t2); }

  .notice { background: #fff8e6; border: 1px solid #f3dfa6; color: #6b5310; border-radius: 6px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }

  .layout { display: grid; grid-template-columns: 250px 1fr; gap: 20px; align-items: start; }
  .side { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 18px 18px; position: sticky; top: 16px; }
  .side h3 { font-size: 14px; margin: 16px 0 8px; font-weight: 600; }
  .side label { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--t2); padding: 4px 0; cursor: pointer; }
  .side label i { font-style: normal; margin-left: auto; color: var(--t3); font-size: 12px; font-variant-numeric: tabular-nums; }
  .side input { accent-color: var(--series-1); }
  .side .reset { margin-top: 14px; width: 100%; padding: 8px; border: 1px solid var(--line2); background: #fff; border-radius: 6px; font: inherit; font-size: 13px; cursor: pointer; }
  .side hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0 0; }

  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .bar .cnt { font-size: 15px; } .bar .cnt b { color: var(--series-1); }
  .bar select { padding: 7px 10px; border: 1px solid var(--line2); border-radius: 6px; font: inherit; font-size: 13px; background: #fff; }

  .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; transition: box-shadow .15s, border-color .15s; }

  .dday.upcoming { background: var(--brand-soft); color: var(--navy2); } .dday.always { background: var(--brand-soft); color: var(--navy2); }
  .dday.ended { background: #eef0f3; color: var(--t3); }
  .kind { font-size: 12px; color: var(--t2); border: 1px solid var(--line2); padding: 2px 8px; border-radius: 4px; }
  .org { font-size: 12px; color: var(--t3); margin-left: auto; }
  .card h4 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.4; letter-spacing: -.015em; }
  .card h4 a { text-decoration: none; } .card h4 a:hover { color: var(--series-1); }
  .biz { font-size: 13px; color: var(--t2); }
  .sum { font-size: 13px; color: var(--t3); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: #f0f3f7; color: var(--t2); }
  .tag.t { background: #fff; border: 1px solid var(--line2); }
  .period { font-size: 12.5px; color: var(--t2); font-variant-numeric: tabular-nums; }
  .ptrack { height: 6px; background: #eef1f5; border-radius: 0 3px 3px 0; margin-top: 6px; position: relative; }
  .pfill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--series-1); border-radius: 0 3px 3px 0; }
  .ptrack.urgent .pfill { background: var(--critical); }
  .cfoot { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; margin-top: auto; font-size: 12.5px; color: var(--t3); }
  .go { text-decoration: none; font-weight: 600; color: var(--series-1); font-size: 13px; }
  .empty { background: var(--surface); border: 1px dashed var(--line2); border-radius: 10px; padding: 40px; text-align: center; color: var(--t3); grid-column: 1/-1; }
  .more { display: block; margin: 18px auto 0; padding: 10px 28px; border: 1px solid var(--line2); background: #fff; border-radius: 6px; font: inherit; cursor: pointer; }
  .viz-tip { position: fixed; left: 0; top: 0; pointer-events: none; opacity: 0; z-index: 99; background: #14181f; color: #fff; padding: 7px 10px; border-radius: 4px; font-size: 12.5px; max-width: 300px; }
  .draft { position: fixed; right: 16px; bottom: 16px; font-size: 12px; color: #fff; background: var(--navy); padding: 6px 12px; border-radius: 999px; font-weight: 600; }
  @media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } .side { position: static; } .cards, .stats { grid-template-columns: 1fr 1fr; } }
</style>
</head>

<script>
// ── 공통 유틸 (build_ui_drafts.py 가 각 페이지에 인라인) ──
const D = window.NIPA_DATA;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => Number(n || 0).toLocaleString("ko-KR");
const NOW = new Date();
const DAY = 86400000;
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const kdate = (s) => (s ? s.slice(0, 10).replace(/-/g, ".") : "");
const ktime = (s) => (s && s.length > 10 ? s.slice(11, 16) : "");
const toDate = (s, endOfDay) => {
  if (!s) return null;
  if (s.length === 10) return new Date(s + (endOfDay ? "T23:59:59" : "T00:00:00"));
  return new Date(s);
};
const bytes = (b) => (b >= 1024 ** 3 ? (b / 1024 ** 3).toFixed(2) + " GB" : b >= 1024 ** 2 ? (b / 1024 ** 2).toFixed(1) + " MB" : (b / 1024).toFixed(0) + " KB");
const pct = (a, b) => (b ? ((a / b) * 100).toFixed(1) : "0.0");
const ago = (iso) => {
  if (!iso) return "기록 없음";
  const h = (NOW - new Date(iso)) / 3600000;
  if (h < 1) return Math.max(1, Math.round(h * 60)) + "분 전";
  if (h < 24) return Math.round(h) + "시간 전";
  return Math.floor(h / 24) + "일 전";
};

// 접수 상태 — 페이지를 연 시각 기준. 제목에 [접수마감]이 있으면 기간과 무관하게 마감 처리
const STATUS = {
  urgent: { label: "마감 임박", icon: "⏰" },
  open: { label: "접수 중", icon: "●" },
  upcoming: { label: "접수 예정", icon: "◷" },
  always: { label: "상시 모집", icon: "∞" },
  ended: { label: "접수 마감", icon: "■" },
};
const ITEMS = D.items.map((it) => {
  const start = toDate(it.start), end = toDate(it.end, true);
  let st, dleft = null;
  if (/\[?접수\s*마감\]?/.test(it.title.slice(0, 8))) st = "ended";
  // 기간 표기가 없고 게시된 지 1년이 넘은 공고는 상시 모집이 아니라 지난 공고로 본다
  else if (!start && !end) st = it.posted && NOW - toDate(it.posted) > 365 * DAY ? "ended" : "always";
  else if (start && NOW < start) st = "upcoming";
  else if (end && NOW > end) st = "ended";
  else if (!end) st = "always";

    st = dleft <= 7 ? "urgent" : "open";
  }
  const span = start && end ? Math.round((end - start) / DAY) : null;

});
const isOpen = (x) => x.st === "open" || x.st === "urgent";
const ddayText = (x) => (x.dleft === 0 ? "오늘 마감" : x.dleft != null ? `D-${x.dleft}` : STATUS[x.st].label);

// 간단 툴팁: data-tip 속성을 가진 요소에 마우스를 올리면 표시
(function tooltip() {
  const tip = document.createElement("div");
  tip.className = "viz-tip";
  document.body.appendChild(tip);
  document.addEventListener("mousemove", (e) => {
    const t = e.target.closest("[data-tip]");
    if (!t) { tip.style.opacity = 0; return; }
    tip.innerHTML = t.getAttribute("data-tip");
    tip.style.opacity = 1;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = e.clientX + 14, y = e.clientY + 14;
    if (x + w > innerWidth - 8) x = e.clientX - w - 14;
    if (y + h > innerHeight - 8) y = e.clientY - h - 14;
    tip.style.transform = `translate(${x}px, ${y}px)`;
  });
})();

// 가로 막대 목록 (단일 계열 = 한 색)
function hbars(rows, opt = {}) {
  const max = Math.max(1, ...rows.map((r) => r[1]));
  return `<div class="hbars">` + rows.map(([label, v, tipExtra]) => `
    <div class="hbar" data-tip="<b>${esc(label)}</b><br>${fmt(v)}${opt.unit || "건"}${tipExtra ? "<br>" + tipExtra : ""}">
      <span class="hbar-label">${esc(label)}</span>
      <span class="hbar-track"><span class="hbar-fill" style="width:${((v / max) * 100).toFixed(1)}%"></span></span>
      <span class="hbar-val">${fmt(v)}</span>
    </div>`).join("") + `</div>`;
}

// 세로 막대 (SVG, 단일 계열). rows: [{label, v, tip, hl}]
function vbars(rows, { h = 200, color = "var(--series-1)", hlColor = "var(--series-hl)", every = 1 } = {}) {
  const W = 800, top = 18, bottom = 26, left = 34, max = Math.max(4, ...rows.map((r) => r.v));
  const nice = Math.ceil(max / 4) * 4, ph = h - top - bottom, slot = (W - left) / rows.length, bw = Math.min(46, slot * 0.62);
  let s = `<svg viewBox="0 0 ${W} ${h}" class="vbars" preserveAspectRatio="none" role="img">`;
  for (let i = 0; i <= 4; i++) {
    const y = top + ph * (1 - i / 4);
    s += `<line x1="${left}" x2="${W}" y1="${y}" y2="${y}" class="grid"/><text x="${left - 6}" y="${y + 3}" class="axis" text-anchor="end">${(nice * i) / 4}</text>`;
  }
  rows.forEach((r, i) => {
    const bh = (r.v / nice) * ph, x = left + i * slot + (slot - bw) / 2, y = top + ph - bh;
    s += `<g data-tip="${esc(r.tip || r.label + " · " + r.v + "건")}"><rect x="${x - (slot - bw) / 2}" y="${top}" width="${slot}" height="${ph}" fill="transparent"/>`;
    if (r.v) s += `<path d="M${x},${top + ph} V${y + 4} q0,-4 4,-4 H${x + bw - 4} q4,0 4,4 V${top + ph} Z" fill="${r.hl ? hlColor : color}"/>`;
    if (r.v && r.label_v !== false) s += `<text x="${x + bw / 2}" y="${y - 5}" class="val" text-anchor="middle">${r.v}</text>`;
    if (i % every === 0 || r.hl) s += `<text x="${x + bw / 2}" y="${h - 8}" class="axis" text-anchor="middle">${esc(r.label)}</text>`;
    s += `</g>`;
  });
  return s + `</svg>`;
}

// 표 보기 (접근성 — 차트 아래 접이식)
const tableView = (head, rows) => `<details class="tv"><summary>표로 보기</summary><table><thead><tr>${head.map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></details>`;

(() => {
  const GROUPS = [
    ["st", "접수 상태", [["urgent", "마감 임박(7일 이내)"], ["open", "접수 중"], ["upcoming", "접수 예정"], ["always", "상시 모집"], ["ended", "접수 마감"]], (x) => [x.st]],
    ["kind", "공고 유형", ["사업 모집", "입주 모집", "행사·전시 참가", "결과 발표", "설명회·안내", "입찰·용역"].map((k) => [k, k]), (x) => [x.kind]],
    ["fields", "지원 분야", [...new Set(ITEMS.flatMap((x) => x.fields))].map((k) => [k, k]), (x) => x.fields],
    ["targets", "지원 대상", [...new Set(ITEMS.flatMap((x) => x.targets))].map((k) => [k, k]), (x) => x.targets],
  ];
  const DEFAULT = { st: new Set(["urgent", "open", "upcoming", "always"]), kind: new Set(["사업 모집", "입주 모집", "행사·전시 참가"]), fields: new Set(), targets: new Set() };
  let sel = { st: new Set(DEFAULT.st), kind: new Set(DEFAULT.kind), fields: new Set(), targets: new Set() };
  let q = "", sort = "end", lim = 12;

  const pass = (x, skip) => GROUPS.every(([k, , , get]) => k === skip || !sel[k].size || get(x).some((v) => sel[k].has(v))) &&
    (!q || (x.title + x.biz + x.summary + x.fields.join() + x.targets.join()).toLowerCase().includes(q));

  function side() {
    $("side").innerHTML = GROUPS.map(([k, title, opts, get]) => `<h3>${title}</h3>` + opts.map(([v, l]) => {
      const n = ITEMS.filter((x) => pass(x, k) && get(x).includes(v)).length;
      return `<label><input type="checkbox" data-g="${k}" value="${esc(v)}" ${sel[k].has(v) ? "checked" : ""}/>${esc(l)}<i>${n}</i></label>`;
    }).join("")).join("") + `<hr/><button class="reset" id="reset">조건 초기화</button>`;
    $("side").querySelectorAll("input").forEach((c) => c.onchange = () => { c.checked ? sel[c.dataset.g].add(c.value) : sel[c.dataset.g].delete(c.value); lim = 12; render(); });
    $("reset").onclick = () => { sel = { st: new Set(DEFAULT.st), kind: new Set(DEFAULT.kind), fields: new Set(), targets: new Set() }; q = ""; $("q").value = ""; render(); };
  }

  function card(x) {
    let bar = "";
    if (x.startDate && x.endDate) {
      const p = Math.min(100, Math.max(0, ((NOW - x.startDate) / (x.endDate - x.startDate)) * 100));
      bar = `<div><div class="period">신청 ${kdate(x.start)} ${ktime(x.start)} ~ ${kdate(x.end)} ${ktime(x.end)}</div>
        <div class="ptrack ${x.st}" data-tip="접수 기간 ${x.span}일 중 ${p.toFixed(0)}% 지남"><div class="pfill" style="width:${p}%"></div></div></div>`;
    } else bar = `<div class="period">신청 기간: 상시 모집(원문 확인)</div>`;
    const dd = x.st === "urgent" || x.st === "open" ? (x.dleft === 0 ? "오늘 마감" : `D-${x.dleft}`) : STATUS[x.st].label;
    return `<article class="card">
      <div class="ctop"><span class="dday ${x.st}">${STATUS[x.st].icon} ${dd}</span><span class="kind">${esc(x.kind)}</span>${x.changed ? `<span class="kind">변경 공고</span>` : ""}<span class="org">정보통신산업진흥원</span></div>
      <h4><a href="${esc(x.url)}" target="_blank">${esc(x.title)}</a></h4>
      <div class="biz">사업명 · ${esc(x.biz || "표시 없음")}</div>
      ${x.body_len >= 50 ? `<div class="sum">${esc(x.summary)}</div>` : `<div class="sum">본문 요약 없음 — 상세 내용은 첨부 파일(${x.files}개)에 있습니다.</div>`}
      <div class="tags">${x.fields.map((t) => `<span class="tag">#${esc(t)}</span>`).join("")}${x.targets.map((t) => `<span class="tag t">대상 · ${esc(t)}</span>`).join("")}</div>
      ${bar}
      <div class="cfoot"><span>게시 ${kdate(x.posted)} · 조회 ${fmt(x.views)} · 첨부 ${x.files}개</span><a class="go" href="${esc(x.url)}" target="_blank">원문 공고 보기 →</a></div>
    </article>`;
  }

  function render() {
    const rows = ITEMS.filter((x) => pass(x)).sort((a, b) =>
      sort === "new" ? (b.posted || "").localeCompare(a.posted || "") :
      sort === "views" ? b.views - a.views :
      ((a.endDate && a.endDate > NOW ? a.endDate : 9e15) - (b.endDate && b.endDate > NOW ? b.endDate : 9e15)) || (b.posted || "").localeCompare(a.posted || ""));
    $("cnt").innerHTML = `조건에 맞는 공고 <b>${fmt(rows.length)}건</b>`;
    $("cards").innerHTML = rows.slice(0, lim).map(card).join("") || `<div class="empty">조건에 맞는 공고가 없습니다. 왼쪽 조건을 줄이거나 '접수 마감'을 포함해 보세요.</div>`;
    $("more").style.display = rows.length > lim ? "" : "none";
    side();
  }

  const open = ITEMS.filter(isOpen);
  const soon = ITEMS.filter((x) => x.st === "urgent").length;
  const up = ITEMS.filter((x) => x.st === "upcoming").length, alw = ITEMS.filter((x) => x.st === "always").length;
  const quick = (st) => () => { sel.st = new Set(st); lim = 12; render(); scrollTo({ top: $("cnt").offsetTop - 20, behavior: "smooth" }); };
  $("stats").innerHTML = [["✅", open.length, "지금 신청할 수 있는 공모"], ["⏰", soon, "7일 안에 마감"], ["🗓", up, "곧 접수 시작"], ["∞", alw, "상시 모집"]]
    .map(([ic, v, l], i) => `<div class="stat" data-i="${i}"><div class="ic">${ic}</div><div><div class="v">${fmt(v)}건</div><div class="l">${l}</div></div></div>`).join("");
  const qs = [["urgent", "open"], ["urgent"], ["upcoming"], ["always"]];
  document.querySelectorAll(".stat").forEach((s) => s.onclick = quick(qs[s.dataset.i]));

  $("q").oninput = (e) => { q = e.target.value.trim().toLowerCase(); lim = 12; render(); };
  $("go").onclick = () => render();
  document.querySelectorAll(".qtags button").forEach((b) => b.onclick = () => { $("q").value = b.textContent; q = b.textContent.toLowerCase(); sel.st = new Set(); render(); });
  $("sort").onchange = (e) => { sort = e.target.value; render(); };
  $("more").onclick = () => { lim += 12; render(); };
  render();
})();
</script>
</body>
</html>
