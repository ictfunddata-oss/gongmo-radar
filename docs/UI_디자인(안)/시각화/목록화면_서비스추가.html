<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>[시안] 목록 화면 서비스 추가</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>/* 수요자 화면 — UI 시안 안2 스타일(docs/UI_디자인(안)/_template/안2_공모사업찾기.html) */
:root {
  color-scheme: light;
  --bg: #f4f6f9; --surface: #ffffff; --line: #e3e7ed; --line2: #cfd6df;
  --t1: #14181f; --t2: #4a5361; --t3: #7a8494;
  --navy: #1f3864; --navy2: #2b4c86; --brand-soft: #e8eef8;
  --series-1: #2a78d6;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --sans: "IBM Plex Sans KR", "Malgun Gothic", "Noto Sans KR", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--t1); font-family: var(--sans); font-size: 14px; line-height: 1.55; }
a { color: inherit; }
.gnb { background: var(--navy); color: #fff; }
.gnb .in { max-width: 1280px; margin: 0 auto; padding: 0 28px; height: 60px; display: flex; align-items: center; gap: 36px; }
.logo { font-weight: 700; font-size: 17px; letter-spacing: -.02em; }
.logo small { font-weight: 400; opacity: .7; margin-left: 8px; font-size: 13px; }
.gnb nav { display: flex; gap: 26px; font-size: 14.5px; }
.gnb nav a { text-decoration: none; opacity: .75; padding: 19px 0; }
.gnb nav a.on { opacity: 1; font-weight: 600; box-shadow: inset 0 -3px 0 #fff; }
.gnb .user { margin-left: auto; font-size: 13px; opacity: .8; }

.hero { background: linear-gradient(180deg, var(--navy) 0%, var(--navy2) 100%); color: #fff; padding: 34px 0 70px; }
.hero .in { max-width: 1280px; margin: 0 auto; padding: 0 28px; }
.hero h1 { margin: 0 0 6px; font-size: 30px; font-weight: 600; letter-spacing: -.03em; }
.hero p { margin: 0 0 22px; opacity: .8; font-size: 15px; }
.sbox { display: flex; background: #fff; border-radius: 8px; overflow: hidden; max-width: 760px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.sbox input { flex: 1; border: 0; padding: 16px 20px; font: inherit; font-size: 16px; outline: none; }
.sbox button { border: 0; background: var(--series-1); color: #fff; font: inherit; font-weight: 600; padding: 0 28px; cursor: pointer; }
.qtags { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; font-size: 13px; }
.qtags span { opacity: .7; }
.qtags button { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; }

.wrap { max-width: 1280px; margin: -44px auto 0; padding: 0 28px 60px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px 20px; cursor: pointer; display: flex; align-items: center; gap: 14px; }
.stat:hover { border-color: var(--series-1); }
.stat .ic { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; font-size: 18px; background: var(--brand-soft); }
.stat .v { font-size: 26px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .l { font-size: 13px; color: var(--t2); }

.notice { background: #fff8e6; border: 1px solid #f3dfa6; color: #6b5310; border-radius: 6px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }

.layout { display: grid; grid-template-columns: 250px 1fr; gap: 20px; align-items: start; }
.side { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 18px 18px; position: sticky; top: 16px; }
.side h3 { font-size: 14px; margin: 16px 0 8px; font-weight: 600; }
.side label { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--t2); padding: 4px 0; cursor: pointer; }
.side label i { font-style: normal; margin-left: auto; color: var(--t3); font-size: 12px; font-variant-numeric: tabular-nums; }
.side input { accent-color: var(--series-1); }
.side .reset { margin-top: 14px; width: 100%; padding: 8px; border: 1px solid var(--line2); background: #fff; border-radius: 6px; font: inherit; font-size: 13px; cursor: pointer; }
.side hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0 0; }

.bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.bar .cnt { font-size: 15px; } .bar .cnt b { color: var(--series-1); }
.bar select { padding: 7px 10px; border: 1px solid var(--line2); border-radius: 6px; font: inherit; font-size: 13px; background: #fff; }

.cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; transition: box-shadow .15s, border-color .15s; }
.card:hover { border-color: var(--line2); box-shadow: 0 6px 18px rgba(20,24,31,.07); }
.ctop { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dday { font-weight: 700; font-size: 12.5px; padding: 3px 9px; border-radius: 4px; font-variant-numeric: tabular-nums; }
.dday.urgent { background: #fdecec; color: #b42323; } .dday.open { background: #e7f6e7; color: #0a7a0a; }
.dday.upcoming { background: var(--brand-soft); color: var(--navy2); } .dday.always { background: var(--brand-soft); color: var(--navy2); }
.dday.ended { background: #eef0f3; color: var(--t3); }
.kind { font-size: 12px; color: var(--t2); border: 1px solid var(--line2); padding: 2px 8px; border-radius: 4px; }
.org { font-size: 12px; font-weight: 600; color: var(--t2); background: #eef0f3; padding: 2px 9px; border-radius: 4px; margin-left: auto; }
.org[data-c="0"] { background: #e8eef8; color: #1f3864; } .org[data-c="1"] { background: #e6f5f0; color: #0b6b52; }
.org[data-c="2"] { background: #fdf0e3; color: #9a5300; } .org[data-c="3"] { background: #f1e9fb; color: #5b2b9a; }
.org[data-c="4"] { background: #fde8f0; color: #a3225b; } .org[data-c="5"] { background: #e8f3fb; color: #0b5f8c; }
.card h4 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.4; letter-spacing: -.015em; }
.card h4 a { text-decoration: none; } .card h4 a:hover { color: var(--series-1); }
.biz { font-size: 13px; color: var(--t2); }
.sum { font-size: 13px; color: var(--t3); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: #f0f3f7; color: var(--t2); }
.tag.t { background: #fff; border: 1px solid var(--line2); }
.tag.g { background: #e8f1fd; color: #1d5fbf; }   /* 해외 */
.tag.r { background: #fff3e0; color: #9a5b00; }   /* 지원받는 쪽이 아닌 역할(공급기업·운영기관·개인) */
.period { font-size: 12.5px; color: var(--t2); font-variant-numeric: tabular-nums; }
.ptrack { height: 6px; background: #eef1f5; border-radius: 0 3px 3px 0; margin-top: 6px; position: relative; }
.pfill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--series-1); border-radius: 0 3px 3px 0; }
.ptrack.urgent .pfill { background: var(--critical); }
.cfoot { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; margin-top: auto; font-size: 12.5px; color: var(--t3); }
.go { text-decoration: none; font-weight: 600; color: var(--series-1); font-size: 13px; }
.empty { background: var(--surface); border: 1px dashed var(--line2); border-radius: 10px; padding: 40px; text-align: center; color: var(--t3); grid-column: 1/-1; }
.pager { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 4px; margin: 18px 0; }
.pager.top { margin: 0 0 14px; }
.pager button { min-width: 34px; height: 34px; padding: 0 8px; border: 1px solid var(--line2); background: #fff; color: var(--t2); border-radius: 6px; font: inherit; font-variant-numeric: tabular-nums; cursor: pointer; }
.pager button:hover:not(:disabled):not(.on) { border-color: var(--series-1); color: var(--series-1); }
.pager button.on { background: var(--navy); border-color: var(--navy); color: #fff; font-weight: 600; cursor: default; }
.pager button:disabled { opacity: .4; cursor: default; }
.pager .gap { color: var(--t3); padding: 0 4px; }


/* ── Flask 적용 시 추가 ── */
.gnb a { color: #fff; }
.card h4 a { color: inherit; }
.src { font-size: 11.5px; padding: 2px 7px; border-radius: 4px; background: #f0f3f7; color: var(--t3); }
.src.ai { background: #e8f0fb; color: #184f95; }
.notice.info { background: #eef4fc; border-color: #c9dbf3; color: #1d3f6e; }

/* 상세 화면 */
.dwrap { max-width: 1080px; margin: -44px auto 0; padding: 0 28px 60px; }
.crumb { color: rgba(255,255,255,.8); font-size: 13px; margin-bottom: 10px; display: inline-block; text-decoration: none; }
.dhead { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px 28px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 12px; }
.dhead h1 { margin: 0; font-size: 24px; letter-spacing: -.02em; line-height: 1.35; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-block; padding: 9px 16px; border-radius: 6px; font-weight: 600; font-size: 13.5px; text-decoration: none; border: 1px solid var(--line2); background: #fff; color: var(--t1); }
.btn.primary { background: var(--series-1); border-color: var(--series-1); color: #fff; }
.dgrid { display: grid; grid-template-columns: 1fr 320px; gap: 16px; align-items: start; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; margin-bottom: 16px; }
.box h2 { margin: 0 0 12px; font-size: 16px; }
.facts { width: 100%; border-collapse: collapse; }
.facts th, .facts td { text-align: left; padding: 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 13.5px; }
.facts th { width: 110px; color: var(--t2); font-weight: 500; }
.facts tr:last-child th, .facts tr:last-child td { border-bottom: 0; }
.muted { color: var(--t3); }
.files { list-style: none; margin: 0; padding: 0; }
.files li { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; display: flex; gap: 8px; justify-content: space-between; }
.files li:last-child { border-bottom: 0; }
.files a { color: var(--series-1); text-decoration: none; font-weight: 500; }
.bodytext { white-space: pre-wrap; font-size: 13.5px; color: var(--t2); line-height: 1.75; }
details.body summary { cursor: pointer; font-weight: 600; font-size: 15px; }
.summary { font-size: 14.5px; line-height: 1.75; margin: 0; }
@media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } .side { position: static; } .cards, .stats { grid-template-columns: 1fr 1fr; } .dgrid { grid-template-columns: 1fr; } }
@media (max-width: 640px) { .cards, .stats { grid-template-columns: 1fr; } .hero h1 { font-size: 23px; } .gnb .in, .hero .in, .wrap, .dwrap { padding-left: 16px; padding-right: 16px; } }

.draft-bar { background:#fff8e1; border-bottom:1px solid #f0dca0; font-size:13px; }
.draft-bar .in { max-width:1280px; margin:0 auto; padding:10px 28px; display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; }
.draft-bar b { color:#7a5a00; }
.sw { display:inline-flex; gap:6px; align-items:center; cursor:pointer; user-select:none; }
.sw input { accent-color:#1f3864; }
.dbtn { border:1px solid #d9c07a; background:#fff; border-radius:999px; padding:3px 11px; font:inherit; font-size:12.5px; cursor:pointer; color:#5a4400; }
.dbtn.on { background:#7a5a00; color:#fff; border-color:#7a5a00; }
.no { display:inline-flex; width:18px; height:18px; border-radius:50%; background:#d03b3b; color:#fff; font-size:11px; font-weight:700; align-items:center; justify-content:center; margin-right:5px; vertical-align:1px; }
.soon { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 16px; margin-bottom:14px; }
.soon h3 { margin:0 0 8px; font-size:14.5px; display:flex; align-items:center; }
.soon .row { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
.sc { flex:none; width:230px; border:1px solid var(--line); border-radius:8px; padding:8px 10px; text-decoration:none; background:#fff; }
.sc:hover { border-color:var(--series-1); }
.sc .d { font-weight:700; font-size:13px; } .sc .d.hot { color:#b42323; }
.sc .t { font-size:13px; line-height:1.35; margin-top:2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.sc .o { font-size:11.5px; color:var(--t3); margin-top:3px; }
.fbar { display:block; height:5px; border-radius:3px; background:var(--series-1); opacity:.55; margin:2px 0 0 24px; }
.side label { flex-wrap:wrap; row-gap:0; }
.new { font-size:10.5px; font-weight:800; color:#fff; background:#e5484d; border-radius:3px; padding:1px 6px; letter-spacing:.02em; }
.star { margin-left:auto; border:none; background:none; font-size:20px; line-height:1; cursor:pointer; color:#b8c0cc; padding:0 2px; }
.star.on { color:#f5a524; }
.card .ctop { position:relative; }
.fav-chip { border:1px solid var(--line2); background:#fff; border-radius:999px; padding:5px 12px; font:inherit; font-size:13px; cursor:pointer; }
.fav-chip.on { background:#fff3d6; border-color:#f5a524; color:#7a5a00; }
.gnb .fav { margin-left:auto; font-size:13px; opacity:.9; }
</style></head><body>
<header class="gnb"><div class="in"><span class="logo">ICT기금 공모사업<small>공모정보 통합 조회</small></span><nav><a class="on" href="#">공모사업 찾기</a></nav><span class="fav" id="favnav"></span></div></header>
<div class="draft-bar"><div class="in"><b>시안</b>
  <span>서비스 켜기/끄기:</span>
  <label class="sw"><input type="checkbox" data-sw="soon" checked><span class="no">1</span>마감 임박 띠</label>
  <label class="sw"><input type="checkbox" data-sw="nw" checked><span class="no">2</span>NEW 배지</label>
  <label class="sw"><input type="checkbox" data-sw="mini" checked><span class="no">3</span>분야 분포 막대</label>
  <label class="sw"><input type="checkbox" data-sw="fav" checked><span class="no">4</span>관심 공고 저장</label>
  <span style="margin-left:auto">시안 기준일 <b id="reftxt"></b>
   <button class="dbtn" data-ref="2026-10-16">오늘</button><button class="dbtn" data-ref="2026-06-22">2026-06-22</button><button class="dbtn" data-ref="2026-04-02">2026-04-02</button><button class="dbtn" data-ref="2026-03-18">2026-03-18</button></span>
  <span class="note" id="newtxt" style="margin:0 0 0 10px"></span></div></div>
<section class="hero"><div class="in">
  <h1>우리 기관에 맞는 ICT기금 공모사업을 찾아보세요</h1>
  <p>전담기관 홈페이지에 흩어진 공모 공고를 모아, 지원 분야와 대상별로 정리했습니다.</p>
  <div class="sbox"><input placeholder="예: 바우처, GPU, 해외진출, 입주" aria-label="공고 검색"><button>검색</button></div>
</div></section>
<main class="wrap">
  <section class="stats" id="stats"></section>
  <div class="soon" id="soon"><h3 id="soonh"></h3><div class="row" id="soonrow"></div></div>
  <div class="layout">
    <aside class="side" id="side"></aside>
    <section>
      <div class="bar"><div class="cnt" id="cnt"></div><button type="button" id="favchip" class="fav-chip"></button></div>
      <div class="cards" id="cards"></div>
      <button class="more" id="more" style="display:block;margin:18px auto 0;padding:10px 28px;border:1px solid var(--line2);background:#fff;border-radius:6px;font:inherit;cursor:pointer">더 보기(시안은 12건씩, 실제 화면은 쪽 번호)</button>
    </section>

공지능 활용 등을 위한 고성능 컴퓨팅 지원 사업」 사용자 모집 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2022-08-23", "end": "2022-12-31", "posted": "2022-08-23", "fields": ["AI컴퓨팅·반도체", "인공지능"], "targets": ["중소·벤처기업", "창업기업", "공공기관·지자체", "대학·병원·연구기관", "협회·단체"], "views": 20769, "files": 3, "summary": "초거대 인공지능 활용을 위해 기업·기관당 160TF 또는 320TF GPU 서버 1식을 지원하는 고성능 컴퓨팅 지원 사업의 사용자를 모집한다. 자부담금은 선납하고 API 서비스 사용률에 따라 환급하며 공공기관과 대학은 자부담 대상에서 제외한다. 신청은 8.23부터 예산 소진 시까지 이메일로 한다.", "biz": "고성능컴퓨팅지원", "revision": ""}, {"id": 174, "title": "2022년도 과학기술정보통신부 「초거대 인공지능 API 서비스 지원」 사용자 모집 공고(수정)", "org": "정보통신산업진흥원", "orgc": 0, "start": "2022-08-23", "end": "2022-12-31", "posted": "2022-08-23", "fields": ["인공지능"], "targets": ["중소·벤처기업", "창업기업", "대학·병원·연구기관", "공공기관·지자체", "협회·단체"], "views": 20346, "files": 3, "summary": "중소·벤처기업, 공공·연구기관, 대학 등에 초거대 인공지능 모델 연구를 위한 API 서비스 사용료를 월 200만원씩 12월 31일까지 지원하는 사용자 모집 공고의 수정본이다. 이용신청서의 기관분류에 중소·벤처기업, 일반 협·단체, 신규 창업자를 추가하고 안내서의 공급자 API 서비스에 KT와 마인즈랩을 추가했다. 신청기간은 2022.8.23 ~ 11.30이다.", "biz": "고성능컴퓨팅지원", "revision": "수정·연장"}, {"id": 175, "title": "2022년도 과학기술정보통신부 비대면 기업홍보 지원사업(비대면 IR) 하반기 통합공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2022-08-31", "end": "2022-12-31", "posted": "2022-08-31", "fields": ["기타"], "targets": ["기타"], "views": 15384, "files": 2, "summary": "2022년 과학기술정보통신부 비대면 기업홍보 지원사업(비대면 IR)의 하반기 통합공고다. 본문이 없고 세부 내용은 첨부 공고문에 있다.", "biz": "ICT창의기업육성", "revision": ""}, {"id": 176, "title": "2022년도 과학기술정보통신부 대기업·기금사 대상 비대면 기업홍보 지원사업 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2022-09-13", "end": "2022-12-31", "posted": "2022-09-13", "fields": ["기타"], "targets": ["기타"], "views": 15045, "files": 3, "summary": "대기업·기금사를 대상으로 하는 2022년 비대면 기업홍보 지원사업(비대면 IR)의 하반기 공고다. 첨부 참가신청서 제목은 ICT 중소·벤처기업의 투자유치·업무협력 지원이다. 본문이 없어 세부 내용은 첨부에 있다.", "biz": "ICT창의기업육성", "revision": ""}, {"id": 178, "title": "2022년도 베트남 OCOM 프로그램 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2022-09-26", "end": "2022-12-31", "posted": "2022-09-26", "fields": ["기타"], "targets": ["기타"], "views": 15270, "files": 3, "summary": "호치민IT지원센터 운영사업의 2022년도 베트남 OCOM 프로그램 공고다. 본문이 없고 지원신청서 양식만 첨부되어 있어 세부 내용은 알 수 없다.", "biz": "해외IT지원센터(호치민) 운영", "revision": ""}, {"id": 182, "title": "2023년도 과학기술정보통신부「고성능 컴퓨팅 지원 사업」 운영기관 모집 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2022-12-27", "end": "2022-12-31", "posted": "2022-12-27", "fields": ["AI컴퓨팅·반도체"], "targets": ["협회·단체", "중소·벤처기업"], "views": 12194, "files": 6, "summary": "2023년 고성능 컴퓨팅 자원 운영지원 사업을 위탁 운영할 기관을 모집한다. 신청기간은 2023.1.16 ~ 1.30이다.", "biz": "고성능컴퓨팅지원", "revision": ""}, {"id": 183, "title": "2023년도 과학기술정보통신부「고성능 컴퓨팅 지원 사업」 공급자 모집 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2022-12-27", "end": "2022-12-31", "posted": "2022-12-27", "fields": ["AI컴퓨팅·반도체", "인공지능"], "targets": ["기타"], "views": 15617, "files": 4, "summary": "중소기업 등이 AI 연구·개발과 추론 서비스에 쓸 민간 고성능 컴퓨팅 자원을 임차해 지원하고 AI 바우처 사업에 컴퓨팅 자원을 제공할 공급자를 모집한다. 고성능 컴퓨팅 자원 지원과 국산 AI 반도체 활용 두 사업으로 나뉘며 적격성 평가와 협약으로 선정한다. 신청기간은 각각 2023.1.16 ~ 1.31, 2023.2.13 ~ 2.28이다.", "biz": "고성능컴퓨팅지원", "revision": ""}, {"id": 184, "title": "2023년도 과학기술정보통신부「고성능 컴퓨팅 지원」 사용자 모집 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2022-12-28", "end": "2022-12-31", "posted": "2022-12-28", "fields": ["AI컴퓨팅·반도체", "인공지능"], "targets": ["중소·벤처기업", "창업기업", "공공기관·지자체", "대학·병원·연구기관", "협회·단체"], "views": 23703, "files": 3, "summary": "중소·벤처기업 등에 AI 개발에 필요한 연산자원과 개발환경을 지원하는 고성능 컴퓨팅 지원 사용자를 모집한다. 기업·기관당 20·80·320TF GPU 서버 1식을 지원하며 80TF 이상 신청자는 자부담금을 전액 납부한 뒤 자원을 할당받는다. 신청은 aihub.or.kr에서 한다.", "biz": "고성능컴퓨팅지원", "revision": ""}, {"id": 185, "title": "2023년 SW고성장클럽 사업 운영기관 모집공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2023-01-05", "end": "2023-01-27", "posted": "2023-01-05", "fields": ["SW·SaaS·오픈소스"], "targets": ["협회·단체"], "views": 12903, "files": 0, "summary": "SW고성장클럽 신규 운영기관 1개를 선발한다. 운영기관은 예비고성장 2년차 기업의 사업관리(협약체결·변경 등)와 SW고성장클럽 온라인 채널 관리를 맡는다. 신청기간은 2023.1.5 ~ 1.27이다.", "biz": "SW고성장클럽", "revision": ""}, {"id": 186, "title": "2023년 SW고성장클럽 사업 지원기업 모집공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2023-01-09", "end": "2023-02-10", "posted": "2023-01-09", "fields": ["SW·SaaS·오픈소스"], "targets": ["창업기업"], "views": 18261, "files": 0, "summary": "매출 또는 고용 증가율이 높은 예비·고성장 SW 기업의 성장과 글로벌 진출을 지원하는 SW고성장클럽 지원기업을 모집한다. 자율과제 이행자금과 멘토링, 성장인센티브, 네트워킹, 투자라운드를 지원한다. 신청기간은 2023.1.9 ~ 2.10이다.", "biz": "SW고성장클럽", "revision": ""}, {"id": 187, "title": "2023년 공공SW사업 간소화 과업심의위원회 전문위원 모집공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "", "end": "", "posted": "2023-01-18", "fields": ["SW·SaaS·오픈소스"], "targets": ["개인"], "views": 17122, "files": 3, "summary": "공공 SW 사업 발주 전 과업내용과 적정 사업기간을 검토·심의하는 간소화 과업심의 전문위원 14명 내외를 모집한다. 2인 1조로 위원회를 구성하며 서류심사와 면접심사로 선발한다. 접수는 2023.1.18 ~ 1.31 이메일로 한다.", "biz": "공공SW사업발주기술지원 및 SW사업정보관리", "revision": ""}, {"id": 188, "title": "2023년 정보소외지역SW교육지원강화(SW미래채움)사업공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2023-01-18", "end": "2023-02-17", "posted": "2023-01-18", "fields": ["SW·SaaS·오픈소스"], "targets": ["공공기관·지자체"], "views": 12419, "files": 0, "summary": "SW·AI 교육 인프라가 부족한 지역의 초·중등학생에게 SW 교육 기회를 제공하는 SW 미래채움 사업에 참여할 지자체와 지역소프트웨어산업진흥기관을 모집한다. 국비와 지방비를 1대1로 매칭한다. 신청기간은 2023.1.18 ~ 2.17이다.", "biz": "정보소외지역 SW교육지원 강화", "revision": ""}, {"id": 190, "title": "2023년도 ｢산업전문인력 AI역량강화｣ 지원사업 신규과제 모집 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2023-01-30", "end": "2023-02-28", "posted": "2023-01-30", "fields": ["인공지능"], "targets": ["기타"], "views": 16662, "files": 6, "summary": "2023년 산업전문인력 AI역량강화 지원사업의 신규과제를 모집하는 공고다. 본문이 없고 세부 내용은 첨부 공고문과 안내문에 있다.", "biz": "산업전문인력 AI역량강화", "revision": ""}, {"id": 191, "title": "2023년 SW융합클러스터 2.0 사업(특화산업강화) 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "", "end": "", "posted": "2023-01-30", "fields": ["SW·SaaS·오픈소스", "융합(의료·제조·안전 등)"], "targets": ["공공기관·지자체"], "views": 15411, "files": 4, "summary": "지역 특화산업과 SW 융합을 통한 신사업 모델 발굴, 제품 상용화, 인력양성을 지원하는 SW융합클러스터 2.0(특화산업 강화) 사업에 참여할 지자체를 공고한다. 1차년도 사업계획은 국비 13.5억원 내외 규모로 작성하며 지방비는 국비 대비 50% 이상 현금 매칭한다. 신청기간은 2023.1.31 ~ 3.6이다.", "biz": "SW융합클러스터2.0", "revision": ""}, {"id": 192, "title": "(수정) 2023년 지역 디지털 혁신거점 조성지원 사업 신규지역 선정 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "", "end": "", "posted": "2023-02-03", "fields": ["기타"], "targets": ["공공기관·지자체"], "views": 16243, "files": 1, "summary": "지역에 디지털 자원이 집적된 디지털 생태계를 조성하기 위해 디지털혁신거점 시범지역으로 참여할 지자체와 지역소프트웨어산업진흥기관을 공모한다. 선정 후 3년간 지원하며 지자체가 총사업비의 30% 이상을 현금으로 의무 매칭한다. 신청기간은 2023.2.3 ~ 3.31이다.", "biz": "디지털혁신거점 조성지원", "revision": "수정·연장"}, {"id": 193, "title": "2022년 Korea IT School 교육 위탁운영 기관 공모", "org": "정보통신산업진흥원", "orgc": 0, "start": "2023-02-20", "end": "2023-02-20", "posted": "2023-02-07", "fields": ["기타"], "targets": ["기타"], "views": 10304, "files": 4, "summary": "호치민IT지원센터가 베트남인 대학 졸업(예정)자 25~30명에게 SW 활용기초·프로그래밍 언어 교육과 팀별 프로젝트를 456시간 진행할 Korea IT School 교육 위탁운영 기관을 공모한다. 교육장은 센터가 무상 지원하고 위탁운영기관에는 교육 용역비만 지급한다. 신청은 이메일로 접수한다.", "biz": "해외IT지원센터(호치민) 운영", "revision": ""}, {"id": 194, "title": "2023년 디지털인프라(SW) 진단 및 개선 사업 수요기업(기관) 모집 공고(1차)", "org": "정보통신산업진흥원", "orgc": 0, "start": "", "end": "", "posted": "2023-02-13", "fields": ["SW·SaaS·오픈소스"], "targets": ["기타"], "views": 9536, "files": 4, "summary": "국민 안전과 밀접한 민간·공공 시스템(SW)을 대상으로 SW 안전 진단을 수행하고 개선방안을 지원하는 사업의 수요기업·기관을 모집한다. 정보통신산업진흥원과 한국정보통신기술협회가 진행한다. 세부 내용은 첨부 공고문과 신청서에 있다.", "biz": "디지털인프라(SW) 진단 및 개선", "revision": ""}, {"id": 195, "title": "2023년 생활밀착분야 비대면 선도서비스 활성화 사업 지원기업 모집공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2023-02-14", "end": "2023-03-15", "posted": "2023-02-14", "fields": ["기타"], "targets": ["기타"], "views": 17427, "files": 7, "summary": "비즈니스, 생활소비, 교육·평가, 헬스·웰빙 4대 중점 분야의 비대면 서비스·제품에 대한 실증과 사업화를 지원할 기업을 모집한다. 수요처 실증, 기술적 이슈, 상용화 문제를 겪는 비대면 서비스의 활성화가 목적이다. 자격과 지원 규모는 첨부 공고문과 안내문에 있다.", "biz": "생활밀착분야 비대면 선도서비스 활성화", "revision": ""}, {"id": 197, "title": "2023년 K-Global 액셀러레이터 육성 사업 모집 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2023-02-21", "end": "2023-03-24", "posted": "2023-02-21", "fields": ["기타"], "targets": ["기타"], "views": 15007, "files": 6, "summary": "국내 스타트업의 성장과 글로벌 진출을 지원하고 선진 창업 지원 기법을 국내로 이전하기 위해 ICT 혁신기술 스타트업을 선발·보육할 국내 액셀러레 -20", "posted": "2024-02-16", "fields": ["AI컴퓨팅·반도체", "인공지능"], "targets": ["중소·벤처기업", "창업기업", "대학·병원·연구기관"], "views": 18319, "files": 4, "summary": "인공지능 개발에 필요한 연산자원과 개발환경을 중소·벤처기업 등에 지원하는 고성능 컴퓨팅 지원 사업의 사용자를 모집한다. 기업·기관당 GPU 서버 1식을 제공하며 선정자는 자부담금을 전액 납부해야 자원이 할당된다. 수정 사항은 연령 기준 출생일 정정과 담당자 변경이다.", "biz": "고성능컴퓨팅지원", "revision": "수정·연장"}, {"id": 204, "title": "2024년도 과학기술정보통신부 「고성능 컴퓨팅 지원(국산 AI반도체 활용 사업–AI반도체트랙)」 사용자 모집 공고(수정)", "org": "정보통신산업진흥원", "orgc": 0, "start": "2024-02-16", "end": "2024-03-29", "posted": "2024-02-16", "fields": ["AI컴퓨팅·반도체", "인공지능"], "targets": ["중소·벤처기업", "창업기업", "대학·병원·연구기관"], "views": 12966, "files": 4, "summary": "AI 추론 서비스를 개발하려는 중소·벤처기업 등에 국산 AI 반도체 기반 개발용 서버(60·120·240 TOPS 3종)를 제공한다. 이용신청서를 이메일로 제출하며 선정 결과는 2024년 4월에 통보한다. 수정 사항은 문의처 담당자 변경이다.", "biz": "고성능컴퓨팅지원", "revision": "수정·연장"}, {"id": 205, "title": "2024년도 AI 미디어‧문화 향유 확산 사업 신규과제 모집 공고(수정)", "org": "정보통신산업진흥원", "orgc": 0, "start": "2024-03-29", "end": "2024-04-30", "posted": "2024-03-29", "fields": ["인공지능", "디지털콘텐츠"], "targets": ["기타"], "views": 22388, "files": 7, "summary": "인공지능을 활용해 미디어·문화 분야 민간 전문가 업무를 효율화하고 AI 일상화를 촉진하는 AI 미디어·문화 향유 확산 신규과제를 공모한다. 2024.04.15. 수정 사항은 사업수행계획서 양식의 신규 인력 기준과 기관별 사업비 세부현황 표다.", "biz": "AI 미디어·문화 향유 확산", "revision": "수정·연장"}, {"id": 206, "title": "2024년 지역 자율형 디지털 실증지원 사업(AI기반 어장공간정보, 농식품 메타버스) 통합 재공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2024-04-08", "end": "2024-04-30", "posted": "2024-04-08", "fields": ["데이터", "XR·메타버스", "융합(의료·제조·안전 등)"], "targets": ["공공기관·지자체"], "views": 10482, "files": 5, "summary": "AI기반 어장공간정보 빅데이터 플랫폼 구축과 농식품 메타버스 기술실증, 두 지역 자율형 디지털 실증지원 사업의 2024년도 신규 지역을 선정하는 통합 재공고다. 지역 수요 기반 디지털 플랫폼 구축으로 산업 인프라를 보완하고 신서비스 사업화와 실증을 지원한다. 지자체가 국비 대비 100%를 매칭한다.", "biz": "AI기반 어장공간정보 빅데이터 플랫폼 구축 및 활용", "revision": "재공고"}, {"id": 207, "title": "2025년도 SaaS 창업성장 지원사업(SaaS 전환지원센터 운영) 운영기관 모집 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2025-02-12", "end": "2025-03-17", "posted": "2025-02-13", "fields": ["SW·SaaS·오픈소스", "클라우드"], "targets": ["협회·단체"], "views": 10331, "files": 4, "summary": "국내 SW기업의 SaaS 개발·전환을 돕는 SaaS 전환지원센터를 운영할 기관을 자유공모로 모집한다. 센터는 SaaS 개발환경 지원, 전환 컨설팅, 전문정보 제공을 맡는다. 접수는 NIPA 사업관리시스템으로 받는다.", "biz": "SaaS 기반 창업성장 지원(SaaS 전환지원센터 운영)", "revision": ""}, {"id": 208, "title": "2025년 AI-반도체 해외실증 지원 사업 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2025-02-20", "end": "2025-03-20", "posted": "2025-02-13", "fields": ["AI컴퓨팅·반도체", "인공지능"], "targets": ["기타"], "views": 12449, "files": 5, "summary": "유망 국산 AI 반도체 및 AI 서비스의 글로벌 레퍼런스 확보와 해외진출 활성화를 위해 국내 기업의 해외 실증을 지원하는 사업을 공고한다. 신청 자격과 지원 규모는 첨부 공고문과 공모안내서에 있다.", "biz": "AI-반도체 해외실증지원 사업", "revision": ""}, {"id": 209, "title": "2025년도 ｢산업전문인력 AI역량강화｣ 지원사업 신규과제 모집 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2025-03-04", "end": "2025-03-18", "posted": "2025-02-17", "fields": ["인공지능"], "targets": ["협회·단체"], "views": 28470, "files": 6, "summary": "제조·서비스 등 기존 산업과 AI 융합을 선도할 리더·재직자·AI 융합전문가 교육과정을 개발·운영할 기관을 모집한다. 산업별 협·단체가 주관하고 AI 교육기관이 참여하는 컨소시엄 형태이며 국비 지원, 수행기관 현금 부담은 없다. 서류심사와 발표평가를 거쳐 8개 과제를 선정한다.", "biz": "산업전문인력 AI역량강화", "revision": ""}, {"id": 210, "title": "2025년도 K-Global 액셀러레이팅 사업 액셀러레이터 모집 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2025-03-04", "end": "2025-04-03", "posted": "2025-03-04", "fields": ["인공지능"], "targets": ["기타"], "views": 14344, "files": 5, "summary": "국내 스타트업의 성장과 글로벌 진출을 지원하기 위해 AI·AX디지털 기술 분야 ICT 혁신기술 스타트업을 선발·보육할 국내 액셀러레이터를 모집한다. 접수는 NIPA 사업관리시스템으로 받는다. 세부 내용은 첨부 공고문에 있다.", "biz": "ICT창의기업육성", "revision": ""}, {"id": 213, "title": "2025년 산업맞춤형 혁신바우처 지원사업 신규과제 모집공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2025-04-28", "end": "2025-05-23", "posted": "2025-04-28", "fields": ["인공지능"], "targets": ["기타"], "views": 26552, "files": 5, "summary": "AI 기반 디지털 전환 수요가 있는 국내 법인에 기업 진단·컨설팅, 디지털전환 교육, 검증 프로젝트를 공급기업과 함께 일괄 지원하는 바우처 사업의 수요·공급기업 컨소시엄 과제를 모집한다. 공급기업 1개사와 수요기업 다수로 컨소시엄을 구성하며 2025년 주관 운영기관은 울산정보산업진흥원이다.", "biz": "디지털 전환 역량강화", "revision": ""}, {"id": 216, "title": "2025년 AI반도체 최적화 설계지원 사업 통합 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2025-07-28", "end": "2025-08-11", "posted": "2025-07-21", "fields": ["AI컴퓨팅·반도체"], "targets": ["기타"], "views": 18379, "files": 3, "summary": "국산 AI 반도체 최적화 설계를 뒷받침하는 AI 모델 맞춤형 설계지원과 설계 IP 활용지원 두 사업의 통합 공고다. 지원 내용과 신청 자격은 첨부 공고문과 공모안내서에 있다.", "biz": "2025년 AI반도체 최적화 설계지원 사업 통합 공고", "revision": ""}, {"id": 217, "title": "2025년 AI모델 맞춤형 설계지원(파운데이션 모델 트랙) 사업 공모", "org": "정보통신산업진흥원", "orgc": 0, "start": "2025-08-11", "end": "2025-08-27", "posted": "2025-08-05", "fields": ["인공지능"], "targets": ["기타"], "views": 16786, "files": 2, "summary": "국산 AI 파운데이션 모델과 연계한 AI 모델 맞춤형 설계지원 사업(파운데이션 모델 트랙)을 공고한다. 지원 내용과 신청 자격은 첨부 공고문과 공모안내서에 있다.", "biz": "AI모델 맞춤형 설계지원(파운데이션 모델 트랙) 사업", "revision": ""}, {"id": 218, "title": "하노이IT지원센터 '25년도 베트남 현지 전문가 1:1 맞춤형 컨설팅(멘토링) 지원", "org": "정보통신산업진흥원", "orgc": 0, "start": "2025-08-14", "end": "2026-12-31", "posted": "2025-08-19", "fields": ["기타"], "targets": ["기타"], "views": 10141, "files": 1, "summary": "베트남 진출 한국 ICT 기업에 현지 전문가를 연결해 시장동향, 마케팅, 법인설립, 세무·회계, 노무, 법령 등 10개 분야 1:1 컨설팅을 제공한다. 기업당 최대 2회, 총 3시간 이내이며 하노이센터 방문 또는 화상으로 진행한다. 이메일로 상시 신청한다.", "biz": "해외IT지원센터(하노이) 운영", "revision": ""}, {"id": 220, "title": "2026년 월드프렌즈코리아 NIPA자문단 종합관리센터 운영기관 모집공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2025-10-13T09:00", "end": "2025-11-12T15:00", "posted": "2025-10-13", "fields": ["기타"], "targets": ["협회·단체"], "views": 11788, "files": 4, "summary": "외교부 해외봉사단 사업인 월드프렌즈코리아 NIPA 자문단의 종합관리센터를 운영할 기관을 자유공모로 모집한다. 자문단 파견 운영, 복무·안전관리, 성과관리를 맡는다. 컨소시엄 구성이 가능하다.", "biz": "2026년 WFK NIPA자문단 종합관리센터 운영사업", "revision": ""}, {"id": 224, "title": "2025년도(추경)「AI컴퓨팅 자원 활용 기반 강화(GPU 임차 지원)」사업 사용자 추가모집 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2025-11-04T00:00", "end": "2025-12-04T15:00", "posted": "2025-11-04", "fields": ["AI컴퓨팅·반도체", "인공지능"], "targets": ["중소·벤처기업", "창업기업", "중견·대기업", "대학·병원·연구기관", "공공기관·지자체"], "views": 31664, "files": 4, "summary": "인공지능 개발에 필요한 고성능 컴퓨팅 자원을 지원하는 GPU 임차 지원 사업의 사용자를 추가 모집한다. H100 카드 1·2·4장 또는 서버 1대(8장) 이상을 6개월간 지원하는 두 트랙이며 한 트랙만 신청할 수 있다. 접수는 NIPA 사업관리시스템 전산접수로만 받는다.", "biz": "AI컴퓨팅자원 활용기반 강화 (GPU 임차 지원)", "revision": "추가모집"}, {"id": 226, "title": "KoVAC 공동제작센터 위탁운영 협력사 모집", "org": "정보통신산업진흥원", "orgc": 0, "start": "2025-11-11T17:00", "end": "2025-12-10T15:00", "posted": "2025-11-12", "fields": ["XR·메타버스", "디지털콘텐츠"], "targets": ["기타"], "views": 17457, "files": 4, "summary": "누리꿈스퀘어 KoVAC 공동제작센터의 시설·장비 관리와 이용 지원을 맡을 위탁 운영 협력사를 협약으로 모집한다. 운영비용은 시설 운영 수익금으로 충당하고 수익(당기순이익)은 전액 진흥원에 납부하며 장비와 공간 임대료는 무상 제공한다. 사전검토와 제안서 발표평가로 선정한다.", "biz": "실감콘텐츠 인프라 조성", "revision": ""}, {"id": 228, "title": "Korea-ASEAN Digital Academy - Phase 2 수행기관 모집 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2025-11-21T12:00", "end": "2025-12-11T10:00", "posted": "2025-11-21", "fields": ["기타"], "targets": ["기타"], "views": 10283, "files": 4, "summary": "아세안 사무국과 정보통신산업진흥원이 ASEAN 지역의 디지털·AI 역량강화를 위해 시행하는 Korea-ASEAN Digital Academy의 Phase 2 수행기관을 모집한다. 말레이시아와 베트남 대상 아카데미를 운영한다. 세부 내용은 첨부 공모안내서에 있다.", "biz": "Korea-ASEAN Digital Academy - Phase 2", "revision": ""}, {"id": 229, "title": "하노이IT지원센터 2026년 한-베 협력 한국 IT스타트업 지원사업 공모", "org": "정보통신산업진흥원", "orgc": 0, "start": "2025-12-15T16:27", "end": "2025-12-31T16:27", "posted": "2025-12-15", "fields": ["기타"], "targets": ["창업기업"], "views": 9033, "files": 1, "summary": "하노이IT지원센터와 베트남 국가혁신센터(NIC)가 우수 IT 스타트업을 공동 발굴·육성하는 2026년 NIPA-NIC 협력 IT스타트업 지원 사업의 참가기업을 모집한다. 분기별 피칭데이를 열고 현지 활동 우수기업 1개사에는 희망 시 현지법인 설립을 지원한다. 신청은 2025. 12. 15.~12. 31. 정원 마감 시까지 이메일로 받는다.", "biz": "해외IT지원센터(하노이) 운영", "revision": ""}, {"id": 231, "title": "「첨단 GPU 활용 지원 사업」 사용자 모집(25-1차) 공모 안내 (산학연 지원)", "org": "정보통신산업진흥원", "orgc": 0, "start": "2025-12-22T13:48", "end": "2026-01-28T15:00", "posted": "2025-12-22", "fields": ["AI컴퓨팅·반도체", "인공지능"], "targets": ["기타"], "views": 27938, "files": 5, "summary": "대규모로 구축된 첨단 GPU 자원을 활용해 산·학·연의 혁신적인 AI 연구 및 서비스 개발을 지원하는 첨단 GPU 활용 지원 사업의 25-1차 사용자를 모집한다. 신청 자격과 지원 규모는 첨부 공모안내서에 있다.", "biz": "AI컴퓨팅자원 활용기반 강화사업 (첨단 GPU 활용 지원)", "revision": ""}, {"id": 232, "title": "「첨단 GPU 활용 지원 사업」 베타서비스 참여자 모집 공모 안내 (산학연 지원)", "org": "정보통신산업진흥원", "orgc": 0, "start": "2025-12-22T13:00", "end": "2025-12-26T15:00", "posted": "2025-12-22", "fields": ["AI컴퓨팅·반도체"], "targets": ["기타"], "views": 10249, "files": 1, "summary": "국가 AI 경쟁력 강화를 위해 구축 중인 첨단 GPU 자원의 안정적·효율적 배분과 운영을 목적으로 첨단 GPU 활용 지원 사업의 베타서비스 참여자를 모집한다(산학연 지원). 세부 내용은 첨부 공고문에 있다.", "biz": "AI컴퓨팅자원 활용기반 강화사업 (첨단 GPU 활용 지원)", "revision": ""}, {"id": 233, "title": "2026년도「고성능컴퓨팅지원」사업 운영기관 모집 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-01-02T17:00", "end": "2026-02-02T15:00", "posted": "2026-01-02", "fields": ["AI컴퓨팅·반도체", "인공지능"], "targets": ["협회·단체", "중소·벤처기업"], "views": 25499, "files": 4, "summary": "인공지능 학습용 고성능 컴퓨팅 자원과 추론용 국산 AI 반도체 활용을 지원하는 2026년 고성능컴퓨팅지원 사업의 운영기관을 모집한다. 지원 규모는 총 1,000개 내외 기업·기관이며 사업비는 공급사 167억원, 운영기관 7억원이다. 접수 마감은 2026. 2. 2. 15시이다.", "biz": "고성능컴퓨팅지원", "revision": ""}, {"id": 234, "title": "2026년 SW고성장클럽 사업 운영기관 모집공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-01-13T10:00", "end": "2026-02-13T12:00", "posted": "2026-01-12", "fields": ["SW·SaaS·오픈소스"], "targets": ["협회·단체"], "views": 9550, "files": 2, "summary": "매출·고용 증가율이 높은 국내 예비·고성장·수출고성장 SW 기업의 성장과 글로벌 진출을 지원하는 SW고성장클럽 사업의 운영기관 1개를 모집한다. 고성장 1, 2년차 지원기업 사업관리와 고성장PD, 투자라운드, 네트워킹 프로그램을 운영한다. 마감은 2026. 2. 13. 12시이다.", "biz": "SW고성장클럽", "revision": ""}, {"id": 237, "title": "2026년 산업맞춤형 혁신바우처 지원사업 공급기업 1차 모집공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-01-22T14:10", "end": "2026-02-20T15:00", "posted": "2026-01-22", "fields": ["인공지능"], "targets": ["대학·병원·연구기관", "협회·단체"], "views": 44098, "files": 1, "summary": "산업맞춤형 혁신바우처 지원사업에서 수요기업에 AX 역량진단, 맞춤형 교육, 컨설팅, PoC 검증을 제공할 공급기업·기관 1차 등록을 받는다. 과제 신청 전 공급기업 Pool(1, 2차)에 등록하지 않으면 과제에 참여할 수 없다. 등록 마감은 2026. 2. 20. 15시이다.", "biz": "디지털 전환 역량강화", "revision": ""}, {"id": 238, "title": "「K-테크 파이오니어즈」운영기관 모집공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-01-27T17:00", "end": "2026-02-26T15:00", "posted": "2026-01-27", "fields": ["기타"], "targets": ["기타"], "views": 7291, "files": 4, "summary": "해외에서 활동 중인 초격차 기술 보유 한국 인재·팀의 국내 유입, 창업, 기술 사업화를 위한 K-테크 파이오니어즈 사업의 운영기관을 모집한다. 신청 자격과 규모는 첨부 공모안내서에 있다.", "biz": "K-테크 파이오니어즈", "revision": ""}, {"id": 239, "title": "2026년도 AI·디지털 비즈니스 파트너십 특화 프로그램 참여기업 모집 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-02-05T09:00", "end": "2026-03-05T23:00", "posted": "2026-02-05", "fields": ["인공지능"], "targets": ["기타"], "views": 13619, "files": 3, "summary": "국내 AI·디지털 혁신기업의 미국 동부 진출을 위한 AI·디지털 비즈니스 파트너십 특화 프로그램(AIIA) 참여기업 20개사를 모집한다. 정부지원금 3,000만원과 뉴욕대 연계 프로그램, 뉴욕 글로벌 AI 프론티어랩 사무공간을 지원하고 1단계 평가 후 5개사에 3,000만원과 하반기 프로그램을 추가 지원한다. 한국소프트웨어산업협회에 이메일로 접수하며 마감은 2026. 3. 5.이다.", "biz": "AI·디지털 비즈니스 파트너십 구축", "revision": ""}, {"id": 240, "title": "2026년 ICT이노베이션스퀘어 운영 디지털 신기술 교육 운영기관 모집공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-02-05T15:00", "end": "2026-03-06T15:00", "posted": "2026-02-05", "fields": ["인공지능", "데이터"], "targets": ["협회·단체"], "views": 9792, "files": 6, "summary": "ICT 이노베이션스퀘어 운영 디지털 신기술 교육 사업을 운영할 기관 1개를 모집한다. AI·데이터·블록체인·네트워크 등 디지털 신기술 교육, 빅테크 기업 협력 교육, 디지털 소외계층 교육을 운영한다. 2차년도 계속 지원 여부는 1차년도 결과평가에 따라 확정한다.", "biz": "ICT이노베이션스퀘어 운영", "revision": ""}, {"id": 242, "title": "2026년 AI바우처 지원사업 공급기업 POOL 모집 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-02-10T13:00", "end": "2026-02-24T17:00", "posted": "2026-02-10", "fields": ["인공지능"], "targets": ["기타"], "views": 64210, "files": 8, "summary": "AI 바우처 지원사업에서 수요기업에 AI 솔루션을 공급할 공급기업 POOL을 모집한다. 기존 등록 기업도 AI 바우처 사업관리시스템에서 다시 신청해야 한다. 마감은 2026. 2. 24. 17시이며 정부과제 참여제한, 완전자본잠식, AI 솔루션 검증을 종합 검토해 등록한다.", "biz": "AI바우처 지원", "revision": ""}, {"id": 244, "title": "2026년도 중소기업 클라우드 서비스 보급·확산 사업 공급기업(컨설팅 포함) 모집 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-02-13T15:00", "end": "2026-03-20T11:00", "posted": "2026-02-13", "fields": ["클라우드"], "targets": ["기타"], "views": 24178, "files": 3, "summary": "국내 중소기업의 클라우드 기반 디지털 전환을 위해 클라우드 서비스를 제공할 공급기업(컨설팅 포함)을 모집한다. 2025년 등록 기업도 재평가 대상이라 재신청이 필요하다. 신청은 전자우편으로 하며 마감은 2026. 3. 20. 11시이다.", "biz": "중소기업 등 클라우드 서비스 보급·확산(바우처)", "revision": ""}, {"id": 245, "title": "2026년도 AI 응용제품 신속 상용화 지원사업 신규과제 모집 공고 (AI 기반 엔드프로덕트 상용화 지원 Type 2(AI 민생 프로젝트))", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-03-02T09:00", "end": "2026-03-16T14:00", "posted": "2026-02-13", "fields": ["인공지능", "융합(의료·제조·안전 등)"], "targets": ["기타"], "views": 27524, "files": 7, "summary": "단기간 내 성과 창출이 가능한 AI 융합 제품·서비스 발굴과 AX 지원을 위한 AI 응용제품 신속 상용화 지원사업(AI 기반 엔드프로덕트 상용화 지원 Type 2, AI 민생 프로젝트)의 신규 과제를 공모한다. 2개 분과 과제만 우선 공고하며 나머지는 추후 별도 공고한다.", "biz": "2026년도 AI 응용제품 신속 상용화 지원사업 신규과제 모집 공고 (AI 기반 엔드프로덕트 상용화 지원 Type 2(AI 민생 프로젝트))", "revision": ""}, {"id": 246, "title": "2026년 소프트웨어 인재키움 사업 수행지역 및 기관 선정 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-02-19T17:17", "end": "2026-03-20T15:00", "posted": "2026-02-19", "fields": ["SW·SaaS·오픈소스", "인공지능"], "targets": ["공공기관·지자체"], "views": 4713, "files": 6, "summary": "AI 등 디지털 신기술 분야 실무형 인재 양성과 AI 바이브코딩 활용 사업화 촉진을 위한 소프트웨어 인재키움 사업을 수행할 지역 및 기관을 선정한다. 수도권 외 광역지자체와 권역거점 지역산업진흥기관이 신청한다.", "biz": "소프트웨어 인재키움", "revision": ""}, {"id": 247, "title": "2026년 글로벌 SaaS 마켓플레이스 지원 사업수행기관 모집 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-02-23T10:00", "end": "2026-03-24T14:00", "posted": "2026-02-20", "fields": ["SW·SaaS·오픈소스"], "targets": ["기타"], "views": 7581, "files": 4, "summary": "국내 SaaS 제품의 해외진출 촉진과 수출 활성화를 위한 2026년 글로벌 SaaS 마켓플레이스 지원 사업을 운영할 사업수행기관을 모집한다. 신청 자격과 지원 규모는 첨부 공고문에 있다.", "biz": "글로벌 SaaS 마켓플레이스 지원", "revision": ""}, {"id": 248, "title": "2026년 지능형 IoT 적용 확산 사업 신규과제 모집 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-03-12T09:00", "end": "2026-03-27T15:00", "posted": "2026-02-23", "fields": ["네트워크·IoT", "인공지능"], "targets": ["기타"], "views": 11145, "files": 6, "summary": "지능형 IoT와 인공지능 등 디지털 기술을 융합해 현장 수용성이 높고 국민이 체감할 수 있는 지능형 IoT 서비스·모델을 발굴하는 사업의 신규 과제를 모집한다. 접수는 NIPA 사업관리시스템(NXT)으로 하며 세부 내용은 첨부 공모안내서에 있다.", "biz": "지능형 IoT 적용 확산", "revision": ""}, {"id": 249, "title": "2026년 디지털 혁신기업 글로벌 성장 Solution 바우처 지원 사업 공급기업 Pool 모집·등록 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-02-23T09:00", "end": "2026-03-13T15:00", "posted": "2026-02-23", "fields": ["인공지능", "SW·SaaS·오픈소스", "XR·메타버스"], "targets": ["기타"], "views": 16209, "files": 2, "summary": "디지털 혁신기업 글로벌 성장 Solution 바우처 지원 사업에서 수요기업에 솔루션을 공급할 공급기업 Pool의 신규 등록 신청을 받는다. NTIS 참여제한, 완전자본잠식, 솔루션 보유 여부를 검토하며 신청은 이메일로만 받는다. 마감은 2026. 3. 13. 15시이다.", "biz": "디지털 혁신기업 글로벌 성장 바우처 지원", "revision": ""}, {"id": 253, "title": "2026년 AX디바이스 개발 실증(미니트랙) 사업 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-02-24T09:00", "end": "2026-03-25T15:00", "posted": "2026-02-24", "fields": ["AI컴퓨팅·반도체"], "targets": ["기타"], "views": 10245, "files": 6, "summary": "AI 반도체의 시장 경쟁력 강화와 조기 상용화를 뒷받침하는 대규모 실증과 수요창출을 위한 AX 디바이스 개발 실증(미니트랙) 사업을 공고한다. 세부 내용은 첨부 공모안내서에 있다.", "biz": "AX디바이스 개발 실증(미니트랙)", "revision": ""}, {"id": 254, "title": "2026년 AI-반도체 해외실증 지원 사업 신규과제(엣지형) 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-02-24T09:00", "end": "2026-03-25T15:00", "posted": "2026-02-24", "fields": ["AI컴퓨팅·반도체", "인공지능"], "targets": ["기타"], "views": 7805, "files": 5, "summary": "유망 AI 반도체 및 AI 서비스의 글로벌 레퍼런스 확보와 해외진출 활성화를 위해 관련 기업의 해외실증(엣지형)을 지원하는 사업을 공고한다. 세부 내용은 첨부 공모안내서에 있다.", "biz": "AI반도체 해외실증 지원(신규)", "revision": ""}, {"id": 255, "title": "2026년 AI-반도체 해외실증 지원 사업 신규과제(서버형) 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-02-24T09:00", "end": "2026-03-25T15:00", "posted": "2026-02-24", "fields": ["AI컴퓨팅·반도체", "인공지능"], "targets": ["기타"], "views": 8658, "files": 5, "summary": "유망 AI 반도체 및 AI 서비스의 글로벌 레퍼런스 확보와 해외진출 활성화를 위해 관련 기업의 해외실증(서버형)을 지원하는 사업을 공고한다. 세부 내용은 첨부 공모안내서에 있다.", "biz": "AI반도체 해외실증 지원(신규)", "revision": ""}, {"id": 256, "title": "2026년 인공지능 신뢰성 혁신실증 사업 수행기관 모집공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-02-25T12:00", "end": "2026-04-06T15:00", "posted": "2026-02-25", "fields": ["인공지능"], "targets": ["기타"], "views": 9329, "files": 5, "summary": "지역 AX기업의 AI 신뢰성 확보를 지원해 신뢰할 수 있는 AI 생태계를 조성하는 인공지능 신뢰성 혁신 실증 사업의 수행기관을 모집한다. 세부 내용은 첨부 공모안내서에 있다.", "biz": "인공지능 신뢰성 혁신 실증사업", "revision": ""}, {"id": 258, "title": "2026년 SaaS 전환지원센터 SaaS 개발환경 지원 공급기업 모집 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-02-25T10:00", "end": "2026-03-06T18:00", "posted": "2026-02-25", "fields": ["클라우드", "SW·SaaS·오픈소스"], "targets": ["기타"], "views": 10184, "files": 2, "summary": "예비창업자·스타트업(창업 5년 이내)에게 SaaS 개발환경을 제공할 클라우드 서비스 공급기업을 모집한다. 공급기업은 보유 서비스 제공과 교육·컨설팅 지원을 맡는다. 신청서 기반 선정평가로 선정한다.", "biz": "SaaS 기반 창업성장 지원(SaaS 전환지원센터 운영)", "revision": ""}, {"id": 259, "title": "2026년 SaaS 전환지원센터 SaaS 개발환경 지원 수요기업 모집 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-02-25T10:00", "end": "2026-03-27T18:00", "posted": "2026-02-25", "fields": ["SW·SaaS·오픈소스", "클라우드"], "targets": ["창업기업"], "views": 12660, "files": 2, "summary": "예비창업자·스타트업이 별도 선정되는 공급기업(CSP) 중 1개 社를 골라 SaaS 개발·전환에 필요한 클라우드 서비스와 컨설팅을 지원받는 사업의 수요기업을 모집한다. 신청서 기반 선정평가로 선정한다.", "biz": "SaaS 기반 창업성장 지원(SaaS 전환지원센터 운영)", "revision": ""}, {"id": 260, "title": "2026년 해양문화도시기반의 에이지테크 실증거점 조성 사업 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-02-25T15:00", "end": "2026-04-06T15:00", "posted": "2026-02-25", "fields": ["인공지능"], "targets": ["공공기관·지자체"], "views": 7433, "files": 5, "summary": "초고령화 지역에 AX 기반 에이지테크 테스트베드를 조성하고 관련 기업의 실증·사업화·글로벌화를 지원하는 실증거점 구축 사업의 지역 SW 산업진흥기관을 자유공모로 선정한다. 연간 최대 27억원을 5년간 국비로 지원한다.", "biz": "해양문화도시 기반의 에이지테크 실증거점 조성", "revision": ""}, {"id": 262, "title": "2026년도 ｢산업전문인력 AI역량강화｣ 지원사업 신규과제 모집 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-02-26T10:48", "end": "2026-03-27T15:00", "posted": "2026-02-26", "fields": ["인공지능"], "targets": ["협회·단체"], "views": 18769, "files": 6, "summary": "산업계 리더, 재직자, AI 융합전문가 대상 산업별 AI 역량강화 교육과정을 개발·운영할 기관(컨소시엄)을 모집한다. 국비로 교육과정 개발·운영 예산을 지원하며 수행기관 현금 부담은 없다. 발표평가 70점 이상 중 고득점순으로 10개 과제를 선정한다.", "biz": "산업전문인력 AI역량강화", "revision": ""}, {"id": 263, "title": "2026년 지능형 홈 서비스 실증·확산 사업 수행기관 모집 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-02-26T16:00", "end": "2026-03-31T15:00", "posted": "2026-02-26", "fields": ["인공지능"], "targets": ["기타"], "views": 8177, "files": 6, "summary": "인공지능·디지털 기술로 국민 삶의 질을 높이는 지능형 홈 선도 서비스 모델을 발굴하기 위한 지능형 홈 서비스 실증·확산 사업의 수행기관을 모집한다. 세부 내용은 첨부 공모안내서에 있다.", "biz": "2026년 지능형 홈 서비스 실증·확산", "revision": ""}, {"id": 264, "title": "2026년 디지털인프라(SW) 진단 및 개선 사업 수요기업(기관) 모집 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-02-26T15:00", "end": "2026-05-22T23:59", "posted": "2026-02-26", "fields": ["SW·SaaS·오픈소스", "융합(의료·제조·안전 등)"], "targets": ["공공기관·지자체"], "views": 7446, "files": 3, "summary": "국민 안전과 밀접한 민간·공공 시스템(SW)에 대해 SW 안전 진단을 수행하고 개선방안을 지원하는 사업의 수요기업(기관)을 모집한다. 세부 내용은 첨부 공고문에 있다.", "biz": "디지털인프라(SW) 진단 및 개선", "revision": ""}, {"id": 265, "title": "2026년 산업맞춤형 혁신바우처 지원사업 신규과제 모집공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-02-27T09:00", "end": "2026-04-03T15:00", "posted": "2026-02-27", "fields": ["인공지능"], "targets": ["기타"], "views": 23707, "files": 6, "summary": "AI 전문인력 부족으로 AX 추진이 어려운 기업에 기업 맞춤 AX 교육·역량 진단·컨설팅·검증 프로젝트를 바우처로 지원하는 사업의 수요·공급기업 컨소시엄을 모집한다. 공급기업 2차 신청도 함께 안내한다.", "biz": "디지털 전환 역량강화", "revision": ""}, {"id": 266, "title": "2026년「AI 통합 바우처 지원사업(AI바우처 지원사업)」모집 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-02-27T17:14", "end": "2026-03-30T15:00", "posted": "2026-03-03", "fields": ["인공지능"], "targets": ["중소·벤처기업", "중견·대기업", "대학·병원·연구기관"], "views": 89778, "files": 5, "summary": "AI 솔루션이 필요한 수요기업에 바우처를 지급하고 공급기업에는 판매한 솔루션 대금을 지급하는 AI 바우처 지원사업의 수요·공급기업 컨소시엄을 모집한다. 일반·AI반도체·소상공인·글로벌 4개 분과로 운영하며 민간매칭이 필요하다.", "biz": "AI바우처 지원", "revision": ""}, {"id": 267, "title": "2026년도 AI 통합 바우처(클라우드 바우처) 지원 사업 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-04-03T00:00", "end": "2026-04-21T11:00", "posted": "2026-03-03", "fields": ["클라우드"], "targets": ["중소·벤처기업"], "views": 47578, "files": 4, "summary": "국내 중소기업의 클라우드 서비스 도입을 지원하는 클라우드 바우처 사업의 수요기업을 모집한다. 클라우드 컨설팅과 서비스 이용료를 지원하며 이용 금액의 최대 75%를 지원하고 수요기업이 20%를 부담한다.", "biz": "중소기업 등 클라우드 서비스 보급·확산(바우처)", "revision": ""}, {"id": 270, "title": "2026년 글로벌 ICT 미래 유니콘 육성 (ICT GROWTH) 사업 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-03-05T12:00", "end": "2026-04-02T16:00", "posted": "2026-03-05", "fields": ["기타"], "targets": ["기타"], "views": 8737, "files": 4, "summary": "고성장 기업이 자라나는 선순환 생태계 조성을 위한 글로벌 ICT 미래 유니콘 육성(ICT GROWTH) 사업의 참여기업 신청을 받는다. 본문에는 지원 내용과 자격이 없고 첨부 공고문에 있다.", "biz": "ICT창의기업육성", "revision": ""}, {"id": 271, "title": "2026년 SaaS 전환지원센터 SaaS 전환 컨설팅(1차) 수요기업 모집 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-03-10T10:00", "end": "2026-04-10T18:00", "posted": "2026-03-09", "fields": ["SW·SaaS·오픈소스"], "targets": ["기타"], "views": 8869, "files": 2, "summary": "온프레미스 비즈니스 모델·서비스를 보유한 SW 기업의 SaaS 전환을 위한 컨설팅 1차 수요기업을 모집한다. 기업 환경 분석, 서비스 아키텍처 설계, 클라우드 필수요건 점검을 지원한다. 2차 수요기업 공고는 6월말 예정이다.", "biz": "SaaS 기반 창업성장 지원(SaaS 전환지원센터 운영)", "revision": ""}, {"id": 272, "title": "2026년 SaaS 전환지원센터 SaaS 전환 컨설팅 공급기업 모집 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-03-10T10:00", "end": "2026-03-20T18:00", "posted": "2026-03-09", "fields": ["SW·SaaS·오픈소스"], "targets": ["기타"], "views": 8660, "files": 2, "summary": "온프레미스 비즈니스 모델을 가진 SW 기업에 SaaS 전환 컨설팅을 제공할 공급기업을 모집한다. 기업 환경 분석, 비즈니스 모델 수립, 서비스 아키텍처 설계 등을 맡는다. 서류·발표평가로 선정한다.", "biz": "SaaS 기반 창업성장 지원(SaaS 전환지원센터 운영)", "revision": ""}, {"id": 273, "title": "2026년도 디지털 혁신기업 글로벌 성장 바우처 지원사업「Solution 바우처 지원과제」모집공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-03-09T09:00", "end": "2026-03-27T16:00", "posted": "2026-03-09", "fields": ["기타"], "targets": ["창업기업", "중소·벤처기업"], "views": 16613, "files": 3, "summary": "IT·SW 전문인력이 부족한 디지털 혁신기업이 ICT 전문기업과 매칭해 해외 진출용 제품 고도화·신규개발을 바우처로 지원받는 S 바우처 사업의 신규과제를 모집한다. 수요기업이 공급기업 Pool에서 자율 매칭해 컨소시엄으로 신청하며 민간매칭(현금)이 필요하다.", "biz": "디지털 혁신기업 글로벌 성장 바우처 지원", "revision": ""}, {"id": 274, "title": "｢2026년도 AI바우처 지원사업｣ 운영기관 모집 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-03-09T15:54", "end": "2026-04-07T15:00", "posted": "2026-03-09", "fields": ["인공지능"], "targets": ["협회·단체"], "views": 24827, "files": 5, "summary": "AI 바우처 지원사업의 위탁 운영기관을 자유 공모로 모집한다. 운영기관은 수요·공급기업의 협약관리, 사업비 교부, 중간 점검, 결과평가 등 과제 관리 체계를 운영한다.", "biz": "AI바우처 지원", "revision": ""}, {"id": 275, "title": "의료AI 교육 확산 신규과제 공모", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-03-04T09:00", "end": "2026-04-07T16:00", "posted": "2026-03-09", "fields": ["인공지능", "융합(의료·제조·안전 등)"], "targets": ["기타"], "views": 7770, "files": 7, "summary": "의료 AI 교육 격차를 해소하고 실무형 인재를 양성하기 위해 기존 성과를 바탕으로 전국 의과대학에 교육을 확산하는 사업의 수행기관(컨소시엄)을 모집한다. 세부 내용은 첨부 공모안내서에 있다.", "biz": "의료AI 교육 확산", "revision": ""}, {"id": 276, "title": "2026년 AI바우처 지원사업 공급기업 POOL 2차 모집 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-03-09T18:22", "end": "2026-03-16T17:00", "posted": "2026-03-09", "fields": ["인공지능"], "targets": ["기타"], "views": 28341, "files": 9, "summary": "AI 바우처 지원사업 과제 신청에 필요한 공급기업 POOL의 2차 모집이다. 등록신청, 적격성 검토, AI 솔루션 전문가 검증을 거쳐 최종 등록하며 기존 등록기업도 시스템에서 다시 신청해야 한다.", "biz": "AI바우처 지원", "revision": ""}, {"id": 278, "title": "2026년「AI 통합 바우처 지원사업(AI바우처 지원사업)」모집 수정공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-03-10T09:00", "end": "2026-03-30T15:00", "posted": "2026-03-10", "fields": ["인공지능"], "targets": ["중소·벤처기업", "중견·대기업", "대학·병원·연구기관"], "views": 38834, "files": 6, "summary": "AI 솔루션이 필요한 수요기업에 바우처를 지급하고 공급기업에는 판매한 솔루션 대금을 지급하는 AI 바우처 지원사업의 수요·공급기업 컨소시엄을 모집한다. 일반·AI반도체·소상공인·글로벌 4개 분과로 운영하며 민간매칭이 필요하다. 수정사항은 1차 공급기업 POOL 현황(988개) 추가다.", "biz": "AI바우처 지원", "revision": "수정·연장"}, {"id": 279, "title": "2026년 디지털트윈 3D프린팅 의료공동제조소 실증 지원과제 모집 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-03-10T12:00", "end": "2026-04-10T14:00", "posted": "2026-03-10", "fields": ["융합(의료·제조·안전 등)"], "targets": ["기타"], "views": 8413, "files": 5, "summary": "3D 프린팅 의료공동제조소의 디지털 트윈 기능 구현을 위한 실증 지원과제를 모집한다. 신청 자격과 지원 규모는 첨부 공고문에 있다.", "biz": "디지털트윈 3D프린팅 의료공동제조소 실증", "revision": ""}, {"id": 281, "title": "2026년 AI컴퓨팅자원 활용기반 강화사업 (GPU 확보·구축·운용지원) 모집 공고", "org": "정보통신산업진흥원", "orgc": 0, "start": "2026-03-12T16:00", "end": "2026-04-13T15:00", "posted": "2026-03-12", "fields": ["AI컴퓨팅·반도체"], "targets": ["기타"], "views": 26801, "files": 5, "summary": "국내 AI컴퓨팅 인프라의 신속 확충과 활용 기반 강화를 위 , "biz": "공모", "revision": ""}, {"id": 906, "title": "[공모] 2026년 정보통신보조기기 보급제품 선정 공모 안내", "org": "한국지능정보사회진흥원", "orgc": 1, "start": "2026-02-03", "end": "2026-03-05", "posted": "2026-02-03", "fields": ["기타"], "targets": ["기타"], "views": 2148, "files": 2, "summary": "정보통신보조기기 보급제품을 선정하는 공모로, 참가자격과 제출서류는 공모유의서를 참조하도록 하고 있다. 3.5 15:00까지 직접 제출한다.", "biz": "공모", "revision": ""}]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const ITEMS = D.items, $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n) => Number(n || 0).toLocaleString('ko-KR');
const kdate = (s) => (s ? s.slice(0, 10).replace(/-/g, '.') : '');
const ktime = (s) => (s && s.length > 10 ? s.slice(11, 16) : '');
const iso = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const day = 86400000, P = (s) => new Date(s.slice(0, 10) + 'T00:00:00');
const url = (x) => D.base + '/notice/' + x.id;
const ST = { urgent: ['마감 임박', '⏰'], open: ['접수 중', '●'], upcoming: ['접수 예정', '◷'], always: ['상시 모집', '∞'], ended: ['접수 마감', '■'] };

let ref = P(new URLSearchParams(location.search).get('ref') || D.today), on = { soon: true, nw: true, mini: true, fav: true }, org = new Set(), field = new Set(), favOnly = false, page = 12;
let favs = new Set(); try { favs = new Set(JSON.parse(localStorage.getItem('draftFavs') || '[]')); } catch (e) {}
const saveFavs = () => { try { localStorage.setItem('draftFavs', JSON.stringify([...favs])); } catch (e) {} };

function status(x) {            // 서버의 services/public.py status()와 같은 규칙을 시안 기준일로 다시 계산
  const s = x.start ? new Date(x.start.length === 10 ? x.start + 'T00:00:00' : x.start) : null;
  const e = x.end ? new Date(x.end.length === 10 ? x.end + 'T23:59:59' : x.end) : null;
  const o = { dleft: null, pct: null };
  if (/^\s*\[?\s*접수\s*마감/.test(x.title)) o.st = 'ended';
  else if (!s && !e) o.st = (x.posted && ref - P(x.posted) > 365 * day) ? 'ended' : 'always';
  else if (s && ref < s) o.st = 'upcoming';
  else if (e && ref > e) o.st = 'ended';
  else if (!e) o.st = 'always';
  else { o.dleft = Math.floor((new Date(e.getFullYear(), e.getMonth(), e.getDate()) - new Date(ref.getFullYear(), ref.getMonth(), ref.getDate())) / day); o.st = o.dleft <= 7 ? 'urgent' : 'open'; }
  if (s && e && e > s) o.pct = Math.round(Math.min(100, Math.max(0, (ref - s) / (e - s) * 100)));
  o.label = o.dleft !== null ? (o.dleft === 0 ? '오늘 마감' : 'D-' + o.dleft) : ST[o.st][0];
  return o;
}
const isNew = (x) => x.posted && ref - P(x.posted) >= 0 && ref - P(x.posted) <= 7 * day;
const FIELDS = [...new Set(ITEMS.flatMap((x) => x.fields))].sort((a, b) => a.localeCompare(b, 'ko'));
const ORGS = [...new Set(ITEMS.map((x) => x.org))];

function card(x) {
  const o = x._s, fav = favs.has(x.id);
  const bar = x.start && x.end
    ? `<div><div class="period">신청 ${kdate(x.start)} ${ktime(x.start)} ~ ${kdate(x.end)} ${ktime(x.end)}</div><div class="ptrack ${o.st}"><div class="pfill" style="width:${o.pct ?? 0}%"></div></div></div>`
    : `<div class="period">신청 기간: 상시 모집(원문 확인)</div>`;
  return `<article class="card">
    <div class="ctop"><span class="dday ${o.st}">${ST[o.st][1]} ${esc(o.label)}</span>${on.nw && isNew(x) ? '<span class="new">NEW</span>' : ''}${x.revision ? `<span class="kind">${esc(x.revision)}</span>` : ''}<span class="org" data-c="${x.orgc}" style="${on.fav ? 'margin-left:auto' : ''}">${esc(x.org)}</span>${on.fav ? `<button class="star ${fav ? 'on' : ''}" data-id="${x.id}" title="${fav ? '관심 공고에서 빼기' : '관심 공고로 저장'}">${fav ? '★' : '☆'}</button>` : ''}</div>
    <h4><a href="${url(x)}" target="_blank">${esc(x.title)}</a></h4>
    <div class="biz">사업명 · ${esc(x.biz || '표시 없음')}</div>
    <div class="sum">${x.summary ? esc(x.summary) : '본문 요약 없음 — 상세 내용은 첨부 파일(' + x.files + '개)에 있습니다.'}</div>
    <div class="tags">${x.fields.filter((t) => t !== '기타').map((t) => `<span class="tag">#${esc(t)}</span>`).join('')}${x.targets.filter((t) => t !== '기타').map((t) => `<span class="tag t">대상 · ${esc(t)}</span>`).join('')}</div>
    ${bar}
    <div class="cfoot"><span>게시 ${kdate(x.posted)} · 조회 ${fmt(x.views)} · 첨부 ${x.files}개</span><a class="go" href="${url(x)}" target="_blank">자세히 보기 →</a></div></article>`;
}

function render() {
  ITEMS.forEach((x) => x._s = status(x));
  const base = ITEMS.filter((x) => (!org.size || org.has(x.org)) && (!field.size || x.fields.some((f) => field.has(f))) && (!favOnly || favs.has(x.id)));
  const endKey = (x) => (x._s.st === 'urgent' || x._s.st === 'open' ? x.end || '9' : x._s.st === 'upcoming' ? '8' + (x.start || '') : x._s.st === 'always' ? '9a' : '9z');
  const rows = base.slice().sort((a, b) => endKey(a).localeCompare(endKey(b)) || (b.posted || '').localeCompare(a.posted || ''));

  // ① 마감 임박 띠 — 접수 중 공고 중 마감이 가까운 순 6건(30일 이내)
  const soon = ITEMS.filter((x) => x._s.dleft !== null && x._s.dleft <= 30 && (!org.size || org.has(x.org))).sort((a, b) => a._s.dleft - b._s.dleft).slice(0, 10);
  $('soon').style.display = on.soon ? '' : 'none';
  $('soonrow').innerHTML = soon.length ? soon.map((x) => `<a class="sc" href="${url(x)}" target="_blank"><div class="d ${x._s.dleft <= 3 ? 'hot' : ''}">⏰ ${esc(x._s.label)}</div><div class="t">${esc(x.title)}</div><div class="o">${esc(x.org)} · ~${kdate(x.end)}</div></a>`).join('')
    : '<div class="empty" style="padding:10px;text-align:left">30일 안에 마감되는 공고가 없습니다. 위의 시안 기준일을 바꿔 보세요.</div>';
  $('soonh').innerHTML = `<span class="no">1</span>곧 마감되는 공고 <small style="font-weight:400;color:var(--t3);margin-left:8px">30일 이내 ${soon.length}건 · 마감 빠른 순</small>`;

  // 통계 카드
  const cnt = (f) => ITEMS.filter(f).length;
  $('stats').innerHTML = [['✅', cnt((x) => ['urgent', 'open'].includes(x._s.st)), '지금 신청할 수 있는 공모'], ['⏰', cnt((x) => x._s.st === 'urgent'), '7일 안에 마감'], ['🗓', cnt((x) => x._s.st === 'upcoming'), '곧 접수 시작'], ['∞', cnt((x) => x._s.st === 'always'), '상시 모집']]
    .map(([ic, n, l]) => `<div class="stat"><div class="ic">${ic}</div><div><div class="v">${fmt(n)}건</div><div class="l">${l}</div></div></div>`).join('');

  // ③ 분야 분포 미니 막대 + 기관
  const fc = Object.fromEntries(FIELDS.map((f) => [f, ITEMS.filter((x) => x.fields.includes(f)).length])), fmax = Math.max(...Object.values(fc));
  $('side').innerHTML = `<h3>기관</h3>` + ORGS.map((o) => `<label><input type="checkbox" data-g="org" value="${esc(o)}" ${org.has(o) ? 'checked' : ''}>${esc(o)}<i>${ITEMS.filter((x) => x.org === o).length}</i></label>`).join('') +
    `<h3>지원 분야 ${on.mini ? '<span class="no">3</span>' : ''}</h3>` + FIELDS.map((f) => `<label><input type="checkbox" data-g="field" value="${esc(f)}" ${field.has(f) ? 'checked' : ''}>${esc(f)}<i>${fc[f]}</i>${on.mini ? `<span style="flex-basis:100%;height:0"></span><span class="fbar" style="width:${Math.max(4, fc[f] / fmax * 100 * .78)}%"></span>` : ''}</label>`).join('') +
    `<hr><button class="reset" id="reset">조건 초기화</button>`;
  $('side').querySelectorAll('input').forEach((c) => c.onchange = () => { const s = c.dataset.g === 'org' ? org : field; c.checked ? s.add(c.value) : s.delete(c.value); page = 12; render(); });
  $('reset').onclick = () => { org.clear(); field.clear(); favOnly = false; page = 12; render(); };

  // 목록
  $('cnt').innerHTML = `조건에 맞는 공고 <b>${fmt(rows.length)}건</b>`;
  $('favchip').style.display = on.fav ? '' : 'none';
  $('favchip').className = 'fav-chip' + (favOnly ? ' on' : '');
  $('favchip').innerHTML = `${on.fav ? '<span class="no">4</span>' : ''}★ 관심 공고만 보기 (${favs.size})`;
  $('favnav').textContent = on.fav ? `★ 관심 공고 ${favs.size}` : '';
  $('cards').innerHTML = rows.slice(0, page).map(card).join('') || `<div class="empty">${favOnly ? '아직 저장한 관심 공고가 없습니다. 카드의 ☆를 눌러 보세요.' : '조건에 맞는 공고가 없습니다.'}</div>`;
  $('more').style.display = rows.length > page ? '' : 'none';
  $('cards').querySelectorAll('.star').forEach((b) => b.onclick = () => { const id = +b.dataset.id; favs.has(id) ? favs.delete(id) : favs.add(id); saveFavs(); render(); });
  $('reftxt').textContent = iso(ref);
  document.querySelectorAll('[data-ref]').forEach((b) => b.classList.toggle('on', b.dataset.ref === iso(ref)));
  const nn = ITEMS.filter(isNew).length;
  $('newtxt').textContent = on.nw ? `NEW 배지(게시 7일 이내): 현재 ${nn}건` : '';
}
document.querySelectorAll('[data-sw]').forEach((c) => c.onchange = () => { on[c.dataset.sw] = c.checked; render(); });
document.querySelectorAll('[data-ref]').forEach((b) => b.onclick = () => { ref = P(b.dataset.ref); page = 12; render(); });
$('favchip').onclick = () => { favOnly = !favOnly; page = 12; render(); };
$('more').onclick = () => { page += 12; render(); };
render();
</script></body></html>
