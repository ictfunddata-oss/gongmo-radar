<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>[안3] 공모사업 접수·마감 일정</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" />
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f5; --surface: #fcfcfb; --line: #e4e5e1; --line2: #cfd0cb;
    --t1: #0b0b0b; --t2: #52514e; --t3: #85847f;
    --series-1: #2a78d6; --series-1-soft: #cde2fb; --ended: #c9c8c2;
    --good: #0ca30c; --warning: #fab219; --critical: #d03b3b;
    --sans: "IBM Plex Sans KR", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--t1); font-family: var(--sans); font-size: 14px; line-height: 1.5; }
  a { color: inherit; }
  .app { max-width: 1360px; margin: 0 auto; padding: 26px 28px 60px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 18px; gap: 20px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -.03em; }
  header p { margin: 4px 0 0; color: var(--t2); }
  .today { font-size: 13px; color: var(--t2); background: var(--surface); border: 1px solid var(--line); padding: 8px 14px; border-radius: 6px; }
  .today b { color: var(--t1); }

  .strip { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; margin-bottom: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  .sd { text-align: center; padding: 8px 2px; border-radius: 6px; cursor: pointer; }
  .sd:hover { background: #f0efec; }
  .sd .w { font-size: 11.5px; color: var(--t3); }
  .sd .d { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .sd .n { font-size: 11.5px; height: 18px; margin-top: 2px; }
  .sd .n span { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--critical); color: #fff; font-weight: 600; }
  .sd.today { background: var(--t1); color: #fff; } .sd.today .w { color: #ccc; }
  .sd.sun .d { color: var(--critical); } .sd.today.sun .d { color: #fff; }
  .strip-title { grid-column: 1/-1; display: flex; justify-content: space-between; font-size: 13px; color: var(--t2); padding: 0 4px 6px; }

  .main { display: grid; grid-template-columns: minmax(0,1fr) 380px; gap: 16px; align-items: start; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
  .ph { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); gap: 10px; flex-wrap: wrap; }
  .ph h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .nav { display: flex; gap: 6px; align-items: center; }
  .nav button { border: 1px solid var(--line2); background: #fff; border-radius: 6px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .nav button:hover { background: #f0efec; }
  .jump { font-size: 12.5px; color: var(--t3); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .jump button { border: 0; background: #f0efec; border-radius: 999px; padding: 3px 10px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--t2); }

  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .cal .wh { padding: 8px; font-size: 12.5px; color: var(--t3); text-align: center; border-bottom: 1px solid var(--line); }
  .cal .wh:first-child { color: var(--critical); }
  .cell { min-width: 0; min-height: 112px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 6px 7px; cursor: pointer; position: relative; }
  .cell:nth-child(7n+7) { border-right: 0; }
  .cell:hover { background: #f6f6f3; }
  .cell.out { background: #f3f3f0; } .cell.out .dn { color: var(--line2); }
  .cell.sel { box-shadow: inset 0 0 0 2px var(--series-1); }
  .dn { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .cell.sun .dn { color: var(--critical); }
  .cell.today .dn { background: var(--t1); color: #fff; border-radius: 999px; padding: 1px 7px; }
  .ev { display: block; font-size: 11.5px; padding: 2px 6px; border-radius: 3px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev.end { background: #fdecec; color: #8a1c1c; border-left: 3px solid var(--critical); }
  .ev.end.past { background: #f0efec; color: var(--t3); border-left-color: var(--ended); }
  .ev.start { background: #e9f1fc; color: #184f95; border-left: 3px solid var(--series-1); }
  .ev.more { color: var(--t3); background: none; padding-left: 4px; }
  .legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--t2); padding: 10px 18px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .legend .l1::before { background: var(--critical); } .legend .l2::before { background: var(--series-1); } .legend .l3::before { background: var(--ended); }

  .list { max-height: 640px; overflow: auto; }
  .li { padding: 12px 18px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 62px 1fr; gap: 12px; text-decoration: none; }
  .li:hover { background: #f6f6f3; }
  .li .dd { text-align: center; font-size: 13px; font-weight: 700; padding: 6px 0; border-radius: 5px; background: #f0efec; color: var(--t2); height: fit-content; font-variant-numeric: tabular-nums; }
  .li .dd.c { background: #fdecec; color: #b42323; } .li .dd.s { background: #e9f1fc; color: #184f95; }
  .li .t { font-size: 13.5px; font-weight: 500; line-height: 1.4; }
  .li .m { font-size: 12px; color: var(--t3); margin-top: 3px; }
  .empty { padding: 30px 18px; color: var(--t3); text-align: center; }

  .gantt { padding: 14px 18px 18px; }
  .grow { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 12px; align-items: center; min-height: 30px; }
  .grow .gl { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--t2); }
  .gl a { text-decoration: none; } .gl a:hover { color: var(--series-1); }
  .gtrack { position: relative; height: 30px; border-left: 1px solid var(--line); }
  .gbar { position: absolute; top: 9px; height: 12px; background: var(--series-1); border-radius: 4px; min-width: 4px; }
  .gbar.ended { background: var(--ended); }
  .gbar.urgent { background: var(--critical); }
  .ghead { position: relative; height: 22px; font-size: 11.5px; color: var(--t3); }
  .ghead span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .gtoday { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--t1); z-index: 2; }
  .ghead .tl { color: var(--t1); font-weight: 700; }
  .gwrap { position: relative; }
  .gwrap .gtoday { top: 22px; }
  .gnote { font-size: 12.5px; color: var(--t3); padding: 0 18px 14px; }
  .viz-tip { position: fixed; left: 0; top: 0; pointer-events: none; opacity: 0; z-index: 99; background: #0b0b0b; color: #fff; padding: 7px 10px; border-radius: 4px; font-size: 12.5px; max-width: 320px; line-height: 1.5; }
  .draft { position: fixed; right: 16px; bottom: 16px; font-size: 12px; color: #fff; background: var(--t1); padding: 6px 12px; border-radius: 999px; font-weight: 600; }
  @media (max-width: 1100px) { .main { grid-template-columns: 1fr; } .strip { grid-template-columns: repeat(7, 1fr); } .grow { grid-template-columns: 180px 1fr; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1>공모사업 접수·마감 일정</h1><p>언제 접수가 시작되고 언제 마감되는지 달력으로 확인합니다.</p></div>
    <div class="today" id="today"></div>
  </header>

  <section class="strip" id="strip"></section>

  <section class="main">
    <div class="panel">
      <div class="ph">
        <div class="nav"><button id="prev">‹ 이전 달</button><h2 id="mtitle" style="min-width:120px;text-align:center"></h2><button id="next">다음 달 ›</button><button id="now">이번 달</button></div>
        <div class="jump" id="jump"></div>
      </div>
      <div class="cal" id="cal"></div>
      <div class="legend"><span class="l1">신청 마감</span><span class="l2">접수 시작</span><span class="l3">지난 마감</span></div>
    </div>
    <div class="panel">
      <div class="ph"><h2 id="ltitle"></h2><span style="font-size:12.5px;color:var(--t3)" id="lcount"></span></div>
      <div class="list" id="list"></div>
    </div>
  </section>

  <section class="panel" style="margin-top:16px">
    <div class="ph"><h2 id="gtitle">접수 기간 한눈에 보기</h2><span style="font-size:12.5px;color:var(--t3)">막대 = 신청 시작부터 마감까지 · 마우스를 올리면 상세 일시</span></div>
    <div class="gantt"><div class="gwrap" id="gantt"></div></div>
    <div class="gnote" id="gnote"></div>
  </section>
</div>
<div class="draft">UI 디자인 [안3]</div>

<script>window.NIPA_DATA = /*__DATA__*/null;</script>
<script>
/*__COMMON__*/
(() => {
  const WD = ["일", "월", "화", "수", "목", "금", "토"];
  const dated = ITEMS.filter((x) => x.startDate || x.endDate);
  const byEnd = {}, byStart = {};
  dated.forEach((x) => { if (x.end) (byEnd[x.end.slice(0, 10)] ||= []).push(x); if (x.start) (byStart[x.start.slice(0, 10)] ||= []).push(x); });
  const todayKey = ymd(NOW);
  let ym = new Date(NOW.getFullYear(), NOW.getMonth(), 1), selDay = todayKey;

  const open = ITEMS.filter(isOpen);
  $("today").innerHTML = `오늘 <b>${kdate(todayKey)}(${WD[NOW.getDay()]})</b> · 접수 중 <b>${open.length}건</b> · 7일 안에 마감 <b>${ITEMS.filter((x) => x.st === "urgent").length}건</b>`;

  // 앞으로 2주 띠
  $("strip").innerHTML = `<div class="strip-title"><span><b>앞으로 2주</b> 마감 일정</span><span>날짜를 누르면 아래 목록이 바뀝니다</span></div>` +
    Array.from({ length: 14 }, (_, i) => {
      const d = new Date(+NOW + i * DAY), k = ymd(d), n = (byEnd[k] || []).length;
      return `<div class="sd ${i === 0 ? "today" : ""} ${d.getDay() === 0 ? "sun" : ""}" data-k="${k}" data-tip="${k} 마감 ${n}건${n ? "<br>" + byEnd[k].map((x) => "· " + esc(x.title.slice(0, 30))).join("<br>") : ""}">
        <div class="w">${i === 0 ? "오늘" : WD[d.getDay()]}</div><div class="d">${d.getDate()}</div><div class="n">${n ? `<span>${n}</span>` : ""}</div></div>`;
    }).join("");
  $("strip").querySelectorAll(".sd").forEach((s) => s.onclick = () => { selDay = s.dataset.k; ym = new Date(selDay.slice(0, 4), +selDay.slice(5, 7) - 1, 1); draw(); });

  // 마감이 많은 달 바로가기
  const mc = {};
  dated.forEach((x) => { if (x.end) mc[x.end.slice(0, 7)] = (mc[x.end.slice(0, 7)] || 0) + 1; });
  const top = Object.entries(mc).filter(([k]) => k.startsWith(String(NOW.getFullYear()))).sort((a, b) => b[1] - a[1]).slice(0, 3);
  $("jump").innerHTML = `마감이 많았던 달` + top.map(([k, n]) => `<button data-k="${k}">${+k.slice(5)}월 ${n}건</button>`).join("");
  $("jump").querySelectorAll("button").forEach((b) => b.onclick = () => { ym = new Date(b.dataset.k.slice(0, 4), +b.dataset.k.slice(5) - 1, 1); selDay = null; draw(); });

  function listFor(title, rows, kindOf) {
    $("ltitle").textContent = title;
    $("lcount").textContent = `${rows.length}건`;
    $("list").innerHTML = rows.map((x) => {
      const k = kindOf(x), past = x.endDate && x.endDate < NOW;
      const cls = k === "start" ? "s" : past ? "" : "c";
      const lab = k === "start" ? "접수<br>시작" : past ? "마감<br>지남" : x.dleft != null ? (x.dleft === 0 ? "오늘<br>마감" : `D-${x.dleft}`) : "마감";
      return `<a class="li" href="${esc(x.url)}" target="_blank"><div class="dd ${cls}">${lab}</div><div><div class="t">${esc(x.title)}</div>
        <div class="m">${x.start ? kdate(x.start) + " " + ktime(x.start) : "?"} ~ ${kdate(x.end)} ${ktime(x.end)} · ${esc(x.kind)}</div></div></a>`;
    }).join("") || `<div class="empty">해당 기간에 일정이 없습니다.</div>`;
  }

  function draw() {
    const y = ym.getFullYear(), m = ym.getMonth();
    $("mtitle").textContent = `${y}년 ${m + 1}월`;
    const first = new Date(y, m, 1), startCell = new Date(y, m, 1 - first.getDay());
    const weeks = Math.ceil((first.getDay() + new Date(y, m + 1, 0).getDate()) / 7);
    let h = WD.map((w) => `<div class="wh">${w}</div>`).join("");
    for (let i = 0; i < weeks * 7; i++) {
      const d = new Date(+startCell + i * DAY + 3600000), k = ymd(d);
      const ends = byEnd[k] || [], starts = byStart[k] || [];
      const evs = ends.map((x) => `<span class="ev end ${x.endDate < NOW ? "past" : ""}" data-tip="<b>마감 ${ktime(x.end)}</b><br>${esc(x.title)}">${esc(x.title)}</span>`)
        .concat(starts.map((x) => `<span class="ev start" data-tip="<b>접수 시작 ${ktime(x.start)}</b><br>${esc(x.title)}">${esc(x.title)}</span>`));
      h += `<div class="cell ${d.getMonth() !== m ? "out" : ""} ${d.getDay() === 0 ? "sun" : ""} ${k === todayKey ? "today" : ""} ${k === selDay ? "sel" : ""}" data-k="${k}">
        <span class="dn">${d.getDate()}</span>${evs.slice(0, 3).join("")}${evs.length > 3 ? `<span class="ev more">외 ${evs.length - 3}건</span>` : ""}</div>`;
    }
    $("cal").innerHTML = h;
    $("cal").querySelectorAll(".cell").forEach((c) => c.onclick = () => { selDay = c.dataset.k; draw(); });

    if (selDay) {
      const rows = (byEnd[selDay] || []).concat(byStart[selDay] || []);
      listFor(`${+selDay.slice(5, 7)}월 ${+selDay.slice(8)}일 일정`, rows, (x) => (x.end && x.end.startsWith(selDay) ? "end" : "start"));
    } else {
      const key = `${y}-${pad(m + 1)}`;
      listFor(`${m + 1}월 마감 공고`, dated.filter((x) => x.end && x.end.startsWith(key)).sort((a, b) => a.endDate - b.endDate), () => "end");
    }
    gantt(y, m);
  }

  // 접수 기간 막대: 선택한 달 앞뒤 1개월(총 3개월) 창에 걸친 공고
  function gantt(y, m) {
    const from = new Date(y, m - 1, 1), to = new Date(y, m + 2, 0, 23, 59), span = to - from;
    const rows = dated.filter((x) => x.startDate && x.endDate && x.startDate <= to && x.endDate >= from).sort((a, b) => a.startDate - b.startDate);
    $("gtitle").textContent = `접수 기간 한눈에 보기 · ${from.getMonth() + 1}월 ~ ${to.getMonth() + 1}월`;
    const pos = (d) => Math.min(100, Math.max(0, ((d - from) / span) * 100));
    const tp = NOW >= from && NOW <= to ? pos(NOW) : null;
    let ticks = "";
    const tick = (d, l) => { const p = pos(d); if (tp == null || Math.abs(p - tp) > 4) ticks += `<span style="left:${p}%">${l}</span>`; };
    for (let i = 0; i < 3; i++) { tick(new Date(y, m - 1 + i, 1), `${new Date(y, m - 1 + i, 1).getMonth() + 1}월 1일`); tick(new Date(y, m - 1 + i, 15), "15일"); }
    if (tp != null) ticks += `<span class="tl" style="left:${tp}%">▼ 오늘</span>`;
    $("gantt").innerHTML = `<div class="grow"><div></div><div class="ghead">${ticks}</div></div>` +
      rows.slice(0, 40).map((x) => {
        const l = pos(x.startDate), r = pos(x.endDate);
        return `<div class="grow"><div class="gl"><a href="${esc(x.url)}" target="_blank" title="${esc(x.title)}">${STATUS[x.st].icon} ${esc(x.title)}</a></div>
          <div class="gtrack"><div class="gbar ${x.st === "ended" ? "ended" : x.st === "urgent" ? "urgent" : ""}" style="left:${l}%;width:${Math.max(0.6, r - l)}%"
          data-tip="<b>${esc(x.title)}</b><br>${kdate(x.start)} ${ktime(x.start)} ~ ${kdate(x.end)} ${ktime(x.end)}<br>접수 기간 ${x.span}일 · ${STATUS[x.st].label}"></div></div></div>`;
      }).join("") + (tp != null && rows.length ? `<div class="gtoday" style="left:calc(332px + (100% - 332px) * ${tp / 100})"></div>` : "") || `<div class="empty">이 기간에 접수 기간이 걸친 공고가 없습니다.</div>`;
    const sp = rows.map((x) => x.span).sort((a, b) => a - b), avg = sp.length ? sp[Math.floor(sp.length / 2)] : 0;
    $("gnote").textContent = rows.length ? `이 기간에 접수 기간이 걸친 공고는 ${rows.length}건이고, 접수 기간 중앙값은 ${avg}일입니다.${rows.length > 40 ? " (앞의 40건만 표시)" : ""} 파란 막대는 접수 중, 빨간 막대는 7일 안에 마감, 회색 막대는 마감된 공고입니다.` : "";
  }

  $("prev").onclick = () => { ym = new Date(ym.getFullYear(), ym.getMonth() - 1, 1); selDay = null; draw(); };
  $("next").onclick = () => { ym = new Date(ym.getFullYear(), ym.getMonth() + 1, 1); selDay = null; draw(); };
  $("now").onclick = () => { ym = new Date(NOW.getFullYear(), NOW.getMonth(), 1); selDay = todayKey; draw(); };
  draw();
})();
</script>
</body>
</html>
