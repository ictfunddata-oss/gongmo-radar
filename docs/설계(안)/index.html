 뒤 한 달 실사용 합계로 정한다. **5단계 실측(2026-11-25, CLI)**: 분류 v2 1,090건 $2.62(첫 실행)·$0.84(캐시 적중), 표준 필드 API 보완 15건 $0.64(건당 평균 $0.042, 최대 $0.105) → 월 신규 공모지원사업 약 18건이면 추출 월 약 $0.76"}], "decisions": [{"doc": "D-40", "번호": "ADR-001", "일자": "2026-10-01", "결정": "PoC 저장소는 SQLite로 한다", "근거": "설치·운영 부담이 없고 공고 수천 건 규모에 충분. 운영 DB 이관은 PIMS 연계 방식과 함께 결정", "상태": "결정", "관련": "D-20, I-06"}, {"doc": "D-40", "번호": "ADR-002", "일자": "2026-10-02", "결정": "선별은 규칙 1차 + AI 2차의 혼합 방식으로 한다", "근거": "입찰·결과 공지 등은 제목만으로 갈려 AI가 필요 없음. 비용·재현성 확보(원칙 P1)", "상태": "제안", "관련": "FS-SEL"}, {"doc": "D-40", "번호": "ADR-003", "일자": "2026-10-02", "결정": "기금·비R&D 판정은 내역사업 목록 대조를 기본으로 한다", "근거": "공고문에 재원·R&D 구분이 거의 없음. 사업구분 칸 채움률 99.2%(350/353)", "상태": "제안", "관련": "F-SEL-03·04, I-01"}, {"doc": "D-40", "번호": "ADR-004", "일자": "2026-10-02", "결정": "AI PoC는 Claude API로 하고 호출부를 한 모듈로 격리한다", "근거": "환경(SDK·키) 준비됨. AX계획의 외부 LLM 연동 검증 취지에 맞추되 공급자 교체 가능하게(원칙 P7)", "상태": "제안", "관련": "D-02 §5, I-08"}, {"doc": "D-40", "번호": "ADR-005", "일자": "2026-10-01", "결정": "첨부파일 자동 저장과 자동 실행은 보류한다", "근거": "사용자 결정(\"아직 붙이지 말고 기억만 해둬, 자동실행도 아직 필요없어\")", "상태": "대체됨", "관련": "F-CRW-12·13, ADR-010"}, {"doc": "D-40", "번호": "ADR-006", "일자": "2026-10-02", "결정": "대시보드 UI 개편 적용은 보류한다", "근거": "사용자 결정. 시안 4종은 `UI_디자인(안)`에 보존", "상태": "보류", "관련": "F-SVC-05~07·09"}, {"doc": "D-40", "번호": "ADR-007", "일자": "2026-10-02", "결정": "수요자 화면은 공고가 아니라 사업 단위로 보여 준다", "근거": "같은 사업이 본공고·변경·결과로 반복 게시(예: ICT창의기업육성 36건)", "상태": "제안", "관련": "F-CLS-06"}, {"doc": "D-40", "번호": "ADR-008", "일자": "2026-10-06", "결정": "프로젝트를 Python + Flask 웹앱 구조로 전환한다(앱 루트 = 작업 폴더, 소스 `app/`)", "근거": "사용자 결정. 수집·판별·조회를 한 앱에서 운영하고 수요자 화면(UI 시안 안2)을 붙이기 위함", "상태": "결정", "관련": "D-02 §3"}, {"doc": "D-40", "번호": "ADR-009", "일자": "2026-10-06", "결정": "AI 판별 모델은 Claude Sonnet 5.5, effort medium으로 한다", "근거": "사용자 결정. ADR-004의 공급자 격리 원칙은 유지(`app/ai/client.py`)", "상태": "결정", "관련": "D-02 §5"}, {"doc": "D-40", "번호": "ADR-010", "일자": "2026-10-06", "결정": "첨부파일은 신규 수집분부터 수집 시점에 즉시 저장한다. 자동 실행은 계속 보류", "근거": "사용자 결정. 기존 1,338개(약 1.87GB)는 필요 시 `fetch-attachments`로 받음. 저장 경로는 `.env`의 `ATTACHMENT_DIR`", "상태": "결정", "관련": "F-CRW-12·13"}, {"doc": "D-40", "번호": "ADR-011", "일자": "2026-10-06", "결정": "기존 NIPA DB(353건)는 새 스키마로 이관하고 원본은 `archive/legacy_nipa`에 보관한다", "근거": "사용자 결정. 이관 전후 건수 일치 확인(353·1,338·3)", "상태": "결정", "관련": "D-20 §4"}, {"doc": "D-40", "번호": "ADR-012", "일자": "2026-10-06", "결정": "수요자 화면(`/`)은 UI 시안 안2로 하고 AI 판정 '노출' 공고만 보여 준다. 운영 화면은 `/admin`, 카드는 앱 상세 화면으로 연결, 판별 전 공고는 단어 기준 임시 분류로 표시", "근거": "사용자 결정. 노출 기준은 설정 `PUBLIC_EXPOSURE`로 조정", "상태": "결정", "관련": "F-SVC-05, I-03"}, {"doc": "D-40", "번호": "ADR-013", "일자": "2026-10-06", "결정": "제목만으로 입찰·결과 발표·설명회가 확실한 공고는 AI 없이 규칙(rule_v1)으로 제외하고, 애매한 건은 AI에 넘긴다", "근거": "방향은 사용자 승인(원칙 P1 이행). 규칙의 구체적 범위는 Claude 설계: 실제 제목 검토에서 '선정 공고'(모집·결과 혼재)와 '(수정)…설명회 추가'가 오제외되는 것을 확인해 좁히고, 모집·변경 단어가 있으면 AI로 넘김. 규칙 범위는 담당자 검토 전 잠정", "상태": "대체됨", "관련": "F-SEL-01·02, ADR-016"}, {"doc": "D-40", "번호": "ADR-014", "일자": "2026-10-07", "결정": "분류 체계를 v1로 개정하는 안을 제안한다(참여 역할·공고 구분·지역 축 신설, 유형·지원방식·분야 조정)", "근거": "사용자 요청(\"AI가 분류 체계를 먼저 제안\"). 근거는 NIPA 353건 제목·사업구분 검토. 2026-10-07 사용자가 방향을 확정해 코드·프롬프트에 적용(`TAXONOMY_VERSION=v1`, `classify_v2`). 투자사·액셀러레이터는 수혜자 유형에 넣지 않음", "상태": "결정", "관련": "F-CLS-01~03·09, FS-CLS §3.1, I-02"}, {"doc": "D-40", "번호": "ADR-015", "일자": "2026-10-07", "결정": "노출은 사업공고·입찰공고 위주로 하고, 행사·경진대회·공모전 성격은 뺀다. AI 판별 결과를 먼저 보여 준 뒤 하나씩 고쳐 나간다", "근거": "사용자 결정. 역할(공급기업·운영기관 등)로는 거르지 않고 모두 보여 줌. 화면 기본 노출값은 '노출,검토'. 정답 표본 검증과 v0·v1 비교는 하지 않고 방향을 정하며 계속 개정. 입주 모집은 잠정 노출, 결과 발표·설명회·안내는 기존대로 제외", "상태": "결정", "관련": "F-SEL-05, I-03"}, {"doc": "D-40", "번호": "ADR-016", "일자": "2026-10-07", "결정": "제목 규칙 선별은 결과 발표·설명회·안내만 대상으로 한다(입찰·용역 제외)", "근거": "ADR-015로 입찰 공고가 노출 대상이 되어, 요약·분류가 없는 규칙 처리 대신 AI가 판별하게 함. ADR-013을 대체", "상태": "결정", "관련": "F-SEL-01"}, {"doc": "D-40", "번호": "ADR-017", "일자": "2026-10-07", "결정": "수요자 화면 개선 3건: ① 접수 마감 공고를 기본 필터에 포함(설정 `PUBLIC_SHOW_ENDED`) ② '변경 공고' 배지를 AI가 판별한 공고 구분으로 대체하고 차수(2차 등)는 별도 표시 ③ 참여 역할·지역을 필터·태그·상세에 표시", "근거": "사용자 결정. ①은 판별 결과를 확인하는 단계의 설정이며 운영 때는 0으로 끌 수 있음. ②는 제목에 '2차'만 있는 공고에 '변경 공고' 배지가 붙던 오류를 바로잡음", "상태": "결정", "관련": "F-SVC-05·10"}, {"doc": "D-40", "번호": "ADR-018", "일자": "2026-10-08", "결정": "입주 모집을 노출에서 제외한다. 사업·입찰이 아닌 단순 모집은 제외하는 방향이며, 입주 외의 '단순 모집' 범위는 추가 결정 대기", "근거": "사용자 결정(\"입주, 모집 관련 글을 제외해야 될 것 같다. 입찰이나 사업이 아니라 단순 모집 글은 제외\"). 노출 유형은 사업 모집·입찰·용역으로 좁아짐. 저장된 판정은 `reapply-exposure`로 다시 계산(노출 26건 → 제외, 재판별 없음). ADR-015의 '입주 잠정 노출'을 대체", "상태": "결정", "관련": "F-SEL-05, I-03"}, {"doc": "D-40", "번호": "ADR-019", "일자": "2026-10-08", "결정": "입찰·발주·공사 성격의 공고(공고 유형 '입찰·용역')를 노출에서 제외한다. 노출 유형은 사업 모집뿐이다", "근거": "사용자 결정(\"입찰 발주 공사 성격의 공고는 빼야 될 것 같다\"). ADR-015의 '입찰공고 노출'을 대체. 저장된 판정은 `reapply-exposure`로 재계산(6건: 노출 5·검토 1 → 제외). 유형은 '사업 모집'이지만 입찰·위탁 성격일 수 있는 경계 건(#226·#193·#68·#49)은 사용자 확인 대기", "상태": "결정", "관련": "F-SEL-05, I-03, I-10"}, {"doc": "D-40", "번호": "ADR-020", "일자": "2026-10-08", "결정": "수요자 화면과 분류를 단순화한다: ① 지원 분야 '분야 무관'을 '기타'로 통합(분류 체계 v1.1, 프롬프트 classify_v3, 저장된 84건 변경) ② 공고 유형은 둘 이상으로 나뉠 때만 표시 ③ 참여 역할은 화면에 표시하지 않음 ④ 'AI 분류' 출처 표시를 하지 않음", "근거": "사용자 결정. ③은 표시만 뺀 것이고 판별 값(`roles`)은 저장을 유지한다. '지원 대상 = 지원 자격(참여할 개인·기업 등)'으로 보라는 의견은 기준 변경과 재판별이 필요해 별도 결정 대기", "상태": "결정", "관련": "F-CLS-03·09, F-SVC-05·10"}, {"doc": "D-40", "번호": "ADR-021", "일자": "2026-10-08", "결정": "① 지원 대상(신청 자격)에 '기타'를 추가하고(분류 체계 v1.2, 프롬프트 classify_v4), 해당하는 값이 없으면 '기타'로 한다 ② 수요자 화면에서 지역 표시를 뺀다 ③ 기존 공고는 재판별하지 않고 비어 있던 지원 대상만 '기타'로 채운다", "근거": "사용자 결정. 저장된 판별 261건의 빈 대상을 '기타'로 변경(백업 `data/gongmo.db.bak-20261008b`). '기타'는 신청 자격이 적혀 있지 않은 공고도 포함하므로 실제 자격이 첨부에 있을 수 있음. 지역 값(`region`)은 저장을 유지", "상태": "결정", "관련": "F-CLS-01·09, F-SVC-10"}, {"doc": "D-40", "번호": "ADR-022", "일자": "2026-10-15", "결정": "입찰·용역을 다시 노출한다(ADR-019 대체). 입찰·용역은 발주·계약 성격까지 모두 수집해 화면 필터로 거르고, 공모전·교육·기관 행사(경진대회·공모전·포상, 행사·전시 참가, 설명회·안내)와 입주 모집은 계속 뺀다. 입찰·용역은 R&D 여부를 따지지 않는다", "근거": "사용자 결정(\"입찰, 공모 등 용역 관련된 내용은 다 수집해서 거르는 게 좋겠다\"). 노출 규칙만 바꾸고 `reapply-exposure`로 저장된 판정 6건 갱신(노출 200→205, 검토 38→39, 제외 115→109, 백업 `data/gongmo.db.bak-20261015`). 재판별 없음", "상태": "결정", "관련": "FS-SEL, FS-CLS, F-SEL-05"}, {"doc": "D-40", "번호": "ADR-023", "일자": "2026-10-15", "결정": "입찰·용역을 다시 노출에서 제외한다(ADR-022 대체). 수집·판별은 그대로 하고 노출 규칙만 되돌린다. 계약·입찰 일정은 이 서비스에 필요하지 않다", "근거": "사용자 결정(\"입찰은 제외하는 게 맞을 것 같다… 명확한 입찰공고는 제외\"). NIA 입찰공고 2026년 571건을 수집·판별한 화면 확인 뒤 결정(입찰 521건이 모두 '상시 모집'으로 표시되는 문제). `reapply-exposure`로 527건 갱신(노출→제외 526, 검토→제외 1, 백업 `data/gongmo.db.bak-20261015-bid-excl`). 재판별 없음", "상태": "결정", "관련": "FS-SEL, FS-CLS, F-SEL-05"}, {"doc": "D-40", "번호": "ADR-024", "일자": "2026-10-16", "결정": "수요자 목록 화면에 작은 서비스 4가지를 넣는다: 곧 마감 띠, NEW 배지, 분야 분포 막대, 관심 공고 저장. 관심 공고는 서버 저장 없이 브라우저에만 저장한다", "근거": "사용자 결정(시안 확인 후 \"서비스 다 넣어주고\"). 모두 현재 DB 값으로 구현하며 계정·알림·개인정보가 필요한 기능(이메일 알림, 기기 간 공유)은 하지 않는다. NEW는 수집일이 아닌 게시일 기준", "상태": "결정", "관련": "F-SVC-12~15, FS-SVC §4"}, {"doc": "D-40", "번호": "ADR-025", "일자": "2026-10-16", "결정": "수요자 화면의 카드·상세에서 '사업명 · ○○' 줄을 모든 기관에서 숨긴다", "근거": "사용자 결정(\"걍 다 숨겨줘\"). NIPA는 게시판의 사업구분, NIA는 제목 말머리(공모·위탁연구 등)가 들어가 'NIA는 사업명이 아닌 값'이 노출되는 문제가 있었다. 값은 계속 저장하고 검색 대상에 포함", "상태": "결정", "관련": "FS-SVC §3"}, {"doc": "D-40", "번호": "ADR-026", "일자": "2026-10-16", "결정": "'많이 찾는 검색어'를 고정 단어가 아니라 이용자가 실제로 검색한 기록으로 보여 준다. 검색한 사람은 저장하지 않고, 결과가 있었던 검색어만 2회 이상일 때 표시", "근거": "사용자 결정(\"실제 많이 검색한 내용을 보여주는 기능으로\"). 검색어를 개인정보 없이 저장하는 `search_logs` 테이블 추가, 이메일·전화번호·주소로 보이는 값은 기록하지 않음. 기록이 없으면 줄을 숨김", "상태": "결정", "관련": "F-SVC-18, FS-SVC §4.7"}, {"doc": "D-40", "번호": "ADR-027", "일자": "2026-10-16", "결정": "'많이 찾는 검색어'에 금칙어 목록을 적용한다. 금칙어가 들어 있는 검색어는 기록하지 않고, 이미 기록되었거나 여러 번 반복된 것도 화면에서 뺀다. 검색 자체는 막지 않는다", "근거": "사용자 결정(\"금칙어 목록 만들어주고… 반복 단어에서도 제외\"). 목록은 파일(`app/banned_terms.txt`)로 두어 담당자가 서버 재시작 없이 고칠 수 있게 함. 공백·기호를 지우고 비교하므로 우연히 겹치는 단어('성기', '애자', '일베' 등)는 목록에서 제외. 수집 공고 제목 933건이 걸리지 않는 것을 시험으로 확인", "상태": "결정", "관련": "F-SVC-18, FS-SVC §4.7"}, {"doc": "D-40", "번호": "ADR-028", "일자": "2026-10-16", "결정": "금칙어를 운영 화면(`/admin/banned`)에서 추가·삭제·점검할 수 있게 한다. 저장은 기존 금칙어 파일을 그대로 쓰고 별도 DB 테이블을 만들지 않는다", "근거": "사용자 결정(\"관리자 화면에서 금칙어를 관리할 수 있는 기능도\"). 파일을 직접 고치던 방식과 같은 곳을 쓰므로 두 방법이 충돌하지 않음. 정상 단어를 가리는 금칙어를 막기 위해 공고 제목 포함 여부를 경고하고, 최근 검색어에서 바로 금칙어로 추가할 수 있게 함. 운영 화면에 로그인이 없어 인증은 배포 전 과제로 남김", "상태": "결정", "관련": "F-SVC-19, FS-SVC §4.8"}, {"doc": "D-40", "번호": "ADR-029", "일자": "2026-10-16", "결정": "운영 화면(`/admin`)과 운영용 API는 관리자 로그인이 필요하다. 관리자 1명, 비밀번호는 해시로만 `.env`에 저장하고 세션 쿠키로 로그인을 유지한다. 비밀번호가 설정되지 않으면 운영 화면을 열지 않는다", "근거": "사용자 결정(\"관리자 페이지는 로그인이 필요해\"). 방식은 가장 단순한 비밀번호 로그인으로 시작하고(기관 계정 연동은 필요할 때 별도 결정), 운영 화면에 쓰기 기능(금칙어)이 생겨 먼저 필요했다. `/api/announcements` 등 제외·미판별 공고까지 담은 운영용 API도 함께 보호(공개 API만 예외). 로그인 5회 실패 시 10분 잠금", "상태": "결정", "관련": "F-SVC-20, FS-SVC §4.9"}, {"doc": "D-40", "번호": "ADR-030", "일자": "2026-10-16", "결정": "목록 카드에서 신청 기간 아래의 접수 진행 막대를 숨긴다(상세 화면은 유지)", "근거": "사용자 결정(\"신청기한 밑에 바 표시한 거는 필요 없을 것 같아\"). 신청 기간 문구와 D-day 배지가 같은 정보를 준다. 진행률(`pct`)·접수 기간 일수(`span`) 값은 서버가 계속 계산", "상태": "결정", "관련": "FS-SVC §3"}, {"doc": "D-40", "번호": "ADR-031", "일자": "2026-10-19", "결정": "접수 마감일이 없는 공고는 노출하지 않는다(노출 판정이 나와도 제외로 바꿈. 검토 판정은 그대로). 기관 구분 없이 모든 게시판에 적용", "근거": "사용자 결정(\"기간 없는 공고들은 노출에서 무조건 제외해야될 것 같아\"). 마감일이 없으면 진행 중인지 알 수 없고 곧 마감 띠·마감 표시도 못 쓴다. '상시모집'으로만 적힌 공고도 마감일이 없으므로 제외된다(현재 NIPA 4건, 모두 2023년 공고). 마감일을 나중에 채우면 `reapply-exposure`로 다시 계산", "상태": "결정", "관련": "FS-SEL 노출 결정표"}, {"doc": "D-40", "번호": "ADR-032", "일자": "2026-10-19", "결정": "한국전파진흥협회(RAPA) 공지사항(`rapa_notice`)을 수집 대상에 추가한다. 2026-01-01 이후 공고만, 첨부는 이름만 저장. 목록에 접수기간 칸이 없어 본문에서 찾고, 없으면 첨부 공고문·수행지침을 읽어 채운다", "근거": "사용자 요청. robots.txt 없음(404)이라 금지 규칙 없음. 목록은 `addList.do` POST, 상세는 GET으로 열림. 첨부 판독은 사용자 승인 후 임시 폴더에서만 했고(저장 안 함), 제목의 '~M/D'만 있는 7건은 시작일을 게시일로 둠", "상태": "결정", "관련": "F-CRW-02"}, {"doc": "D-40", "번호": "ADR-033", "일자": "2026-10-19", "결정": "운영 화면에서 담당자가 공고의 노출 여부를 버튼으로 직접 '노출'로 바꿀 수 있게 한다. 자동 판정은 보존하고 수동 값을 별도 표에 저장해 우선 적용한다", "근거": "사용자 요청. 자동 판정(마감일 없음·확신도 낮음 등)이 틀릴 때 담당자가 바로잡아야 함. 자동 판정 열을 덮어쓰면 재계산 때 사라지므로 별도 저장", "상태": "결정", "관련": "F-SVC-21, FS-SVC §4.10"}, {"doc": "D-40", "번호": "ADR-034", "일자": "2026-10-19", "결정": "마감일이 없어도 사이트가 접수기간을 '상시모집'으로 표기한 공고는, 게시일이 1년 이내이면 노출한다(ADR-031의 예외). 그 밖의 마감일 없는 공고는 계속 제외", "근거": "사용자 결정(\"A로 상시모집만 예외 처리\"). '상시모집'은 파싱 실패가 아니라 사이트가 적은 값(현재 NIPA 8건)이고 진짜 상시 모집이면 보여 줘야 한다. 오래된 공고가 계속 남지 않도록 게시 1년 기준을 둠(수요자 화면의 접수 마감 판정과 같은 기준). 노출 여부는 판정·재계산(`reapply-exposure`) 시점에 정해지므로 1년이 지난 공고는 다음 재계산 때 제외로 바뀜", "상태": "결정", "관련": "FS-SEL 노출 결정표"}, {"doc": "D-40", "번호": "ADR-035", "일자": "2026-10-19", "결정": "수요자 화면에서 차수 표시('2차', '3차 공고')를 목록·상세 모두 없애고, 상세 화면의 '공고 구분' 행과 구분 배지도 없앤다. 목록 카드의 공고 구분 배지(수정·연장 등)는 유지", "근거": "사용자 결정(\"상세페이지에 공고구분은 없어도 될 거 같아. 목록 화면에서도 3차공고 2차 이런 표시는 굳이 없어도 될 거 같아\"). 제목에 이미 차수가 적혀 있어 중복. 값은 판별 결과에 계속 저장하고 검색(차수 단어)에도 쓰임", "상태": "결정", "관련": "F-SVC-10"}, {"doc": "D-40", "번호": "ADR-036", "일자": "2026-10-19", "결정": "서비스 이름을 'ICT기금 공모사업 AI RADAR'로 하고 로고(레이더 아이콘 + Orbitron ExtraBold 워드마크)를 수요자·운영·로그인 화면에 공통으로 쓴다. 수요자 목록 안내 문구는 '공고내용은 해당 기관에서 수정·변경될 수 있으니 원문공고를 꼭 확인하세요.'로 바꾼다", "근거": "사용자 결정. Orbitron은 SIL OFL 1.1이라 상업적 사용 가능. 외부 서버에 의존하지 않도록 'AI RADAR' 글자만 담은 부분 집합 파일을 앱에 포함(1.7KB)", "상태": "결정", "관련": "F-SVC-22"}, {"doc": "D-40", "번호": "ADR-037", "일자": "2026-10-19", "결정": "지원방식이 '컨설팅·진단·멘토링'뿐인 사업 모집은 노출하지 않는다(제외). 다른 지원방식이 함께 있으면 노출", "근거": "사용자 결정(\"컨설팅과 같은 공고도 제외해야 돼\"). 범위는 사용자가 '지원방식이 컨설팅뿐인 공고'로 선택. 적용 시 노출 14건·검토 1건이 제외로 바뀜(SaaS 전환 컨설팅, 디지털인프라(SW) 진단 및 개선, 베트남 전문가 1:1 컨설팅 등). 컨설팅이 하나라도 포함되면 모두 빼는 안(29건)은 바우처·창업육성까지 빠져 채택하지 않음. 규칙은 `EXCLUDE_ONLY_METHODS`에 있고, 담당자가 '노출로 변경'하면 수동 값이 우선", "상태": "결정", "관련": "FS-SEL 노출 결정표"}, {"doc": "D-40", "번호": "ADR-038", "일자": "2026-10-19", "결정": "자동 실행(수집→규칙 선별→AI 판별→노출 재계산)을 구현하고 설정을 관리자 화면에서 한다. 기본값은 꺼짐·AI 끔. 서버 안 예약 실행기를 기본으로 하되 별도 데몬·단발 명령도 제공. AI 판별에는 1회/월 건수 상한을 둔다", "근거": "사용자 요청(\"관리자 대시보드 화면에서 자동화를 설정하는 기능, 스케줄러 실행 시간 등\"). ADR-010·ADR-005의 '자동 실행 보류'를 해제. 배포 시 AI 비용이 무제한으로 늘지 않도록 상한과 키 없음 처리를 넣고, 옛 공고(2025년 NIA 9건 등)가 자동 판별 대상이 되지 않도록 판별 대상 게시일 기준(기본 2026-01-01)을 둠. SQLite 잠금으로 중복 실행 방지", "상태": "결정", "관련": "F-CRW-13·14, F-SVC-23"}, {"doc": "D-40", "번호": "ADR-039", "일자": "2026-10-19", "결정": "선별 규칙을 코드에서 DB로 옮기고 운영 화면에서 관리하게 한다. NIA 입찰공고 게시판은 제목 말머리(조달입찰·사전규격 등)로 AI 호출 전에 '입찰·용역'으로 제외한다(ADR-016의 'NIA 입찰도 AI가 요약·분류' 방침을 변경). 규칙은 제외 유형만 만들 수 있고 판별 전 공고에만 적용. 자동 실행은 켜지 않음", "근거": "사용자 결정(\"자동실행은 켜지 말고 NIA 입찰을 규칙으로 제어해도 될 거 같아. 규칙을 관리할 수 있는 기능도\"). NIA 게시판은 월 약 70건이 대부분 입찰이라 배포 후 AI 비용의 대부분을 차지함 — 말머리 규칙으로 기존 판별 결과와 524건 모두 일치(어긋난 건 0)함을 확인. [공모]·[위탁연구] 말머리는 규칙에 걸리지 않아 AI가 판단. 노출 규칙(사업 모집만 노출)과는 별개로, 규칙이 잘못 넓으면 정상 공고가 사라지므로 저장 전 영향 건수 표시·입력 검증·제외 유형 제한을 둠", "상태": "결정", "관련": "F-SEL-09, F-SVC-24"}, {"doc": "D-40", "번호": "ADR-040", "일자": "2026-10-19", "결정": "AI 판별 항목에 핵심 일정(key_dates)과 지원 규모 숫자(총액·건당 최대·선정 건수·자부담 조건)를 추가한다(분류 체계 v1.3, 프롬프트 classify_v5). 접수 기간이 비어 있는 공고는 본문의 '접수 마감' 일정으로 채운다. 수요자 화면에 주요 일정·지원금 표시와 지원금 필터·정렬을 넣는다. 이미 판별된 노출·검토 공고에는 보강 가져오기로 새 항목만 채운다", "근거": "사용자 결정(추가 제안 중 1번 '핵심 일정·지원 규모 숫자화'). 같은 비용으로 달력·타임라인·필터·정렬을 가능하게 하고 접수 기간 누락을 줄인다. 숫자는 원문에 적힌 값만 쓰고 계산으로 만들지 않으며, 틀리면 곤란한 항목이라 화면에 원문 확인 안내를 유지. 보류: 첨부 판독(제목·본문으로 판단하기 어려운 건에 나중에 도입), 같은 사업 묶기, 운영자용 검토 보조·규칙 제안. 자연어 검색은 구현하지 않고 타당성만 검토", "상태": "결정", "관련": "F-CLS-12·13, F-SVC-25"}, {"doc": "D-40", "번호": "ADR-041", "일자": "2026-11-20", "결정": "정보 부족 공고는 첨부 공고문을 읽어 판별한다(2026-10-08 합의의 구현 보류를 해제). 대상은 본문 200자 미만 미판별 공고와 정보 부족으로 판별된 노출·검토 공고. 첨부에서 글자를 뽑아 DB에 저장하고 AI 입력에 본문과 같은 근거로 넣으며, 추출은 외부 서비스 없이 이 컴퓨터에서 한다. 미판별 공고는 제목 규칙으로 먼저 거른 뒤 남은 건만 읽는다", "근거": "사용자 결정(\"정보 부족건은 첨부를 통해서 판별하는게 맞는 거 아냐?\"). 제목만으로 판별한 뒤 다시 판별하면 비용이 두 번 드므로 첨부를 먼저 읽는다. 한계: 스캔본·이미지 속 글자는 못 읽음, PDF는 앞 40쪽만", "상태": "결정", "관련": "F-CLS-14"}, {"doc": "D-40", "번호": "ADR-042", "일자": "2026-11-20", "결정": "운영 화면에 통계·검색어·로그를 둔다. 방문은 목록·상세 조회만 세고, 접속 주소·계정·브라우저 정보는 저장하지 않는다(순방문은 하루만 쓰는 열쇠로 만든 값의 개수, 60일 뒤 삭제). 관리자가 바꾼 것과 로그인 시도는 운영 이력으로 1년 보관하되 비밀번호와 아이디 칸 입력값은 남기지 않는다", "근거": "사용자 요청(\"사용자 접속량, 검색어 등 필요한 관리자 화면 구성\"). 개인정보 최소화를 위해 사람을 알아볼 수 있는 값은 저장하지 않는 쪽을 택함. 기관의 개인정보 기준에 맞는지는 담당 부서 확인 필요", "상태": "결정", "관련": "F-SVC-26~28"}, {"doc": "D-40", "번호": "ADR-043", "일자": "2026-11-20", "결정": "운영 화면의 분류별 워드 클라우드(`/admin/workspaces`)와 분류별 작업 공간(`/admin/workspace`)을 삭제한다. 서비스 코드·화면·스타일·시험을 모두 제거하고, 지우기 전 파일을 `data/bak_wordcloud_1120/`에 백업한다", "근거": "사용자 요청(\"워드 클라우드 관련 소스 다 날려줘\"). 통계·검색어·로그 화면이 운영 확인 용도를 대신한다. 다른 시험이 쓰던 공용 도구는 `tests/helpers.py`로 옮김", "상태": "결정", "관련": "F-SVC-11"}, {"doc": "D-40", "번호": "ADR-044", "일자": "2026-11-20", "결정": "공고 AI 판별 기능을 모두 삭제한다: 분류 체계·판별 지침(classify_v1~v5)·AI 호출 코드·선별 규칙·노출 규칙·수동 노출 변경·가져오기 명령·AI 비용 문서, DB의 판별 결과(3,192건)·선별 규칙·노출 변경 표, 수요자 화면의 유형·분야·대상 필터와 배지. 수요자 화면은 수집한 원본 공고를 그대로 보여 준다. ADR-002·005·015~041 중 판별·노출·선별에 관한 결정은 이 결정으로 모두 폐기한다", "근거": "사용자 요청(\"판별에 대한 내용은 다 날려버려\", 범위: 데이터+코드·화면·문서 모두). 삭제 전 전체를 `data/bak_remove_cls_1120/`에 백업했다. 첨부 글자 추출(ADR-041의 추출 부분)은 판별과 무관해 남겼다", "상태": "결정 · 일부 대체됨(ADR-045·047, 2026-11-24)", "관련": "F-SVC-04·08·10·14·21·24·25 삭제"}, {"doc": "D-40", "번호": "ADR-045", "일자": "2026-11-24", "결정": "공고 분류와 상세화면 표준 필드 추출에 Claude API를 다시 쓴다. 모델은 `claude-sonnet-5-5`. 분류는 3종(공모지원사업·입찰공고·기타)과 하위 유형 12종을 구조화 출력(JSON 스키마)으로 받고, effort low·50건 묶음·시스템 프롬프트 캐시로 호출한다. 표준 필드(공고명·공고 내용·지원자격·공모 지원분야·공모기간)는 규칙으로 먼저 찾고 못 찾은 칸만 API로 추출한다. 보내는 값은 제목·말머리·상태·기간·게시일·본문(연락처 가림)·첨부 이름과 첨부 글자이며 작성자는 보내지 않는다. 사람이 고친 값은 API가 덮어쓰지 않는다. 추출 프롬프트(extract_v1)와 분류 프롬프트 v2(ADR-048)는 적용 전에 기관별 표본으로 CLI 검증한다", "근거": "사용자 결정(2026-11-24 Q&A: \"분류 + 표준 필드 추출\"). 분류 프롬프트 v1을 Claude Code CLI로 1,010건 검증: 형식 오류·누락 0, 앞선 분류(Orca 워커)와 일치 98.9%, 같은 설정 재실행 일치 99.8%, 비용 $0.74~2.39. ADR-044의 'AI 호출 코드 삭제'를 이 범위에서 대체한다", "상태": "결정 · 구현(2026-11-25)", "관련": "ADR-044, I-04·08·11, D-02 §9, D-20 §5, `plan/01`·`plan/02`"}, {"doc": "D-40", "번호": "ADR-046", "일자": "2026-11-24", "결정": "배포는 컨테이너 하나(Python 3.12 + Node 20)에 웹(gunicorn)과 워커(`automation-daemon`) 두 프로세스를 띄우고, SQLite·첨부는 영구 볼륨에 둔다. Vercel 서버리스에는 올리지 않는다. 인스턴스를 늘릴 때는 Postgres·객체 저장소로 옮긴다", "근거": "사용자 결정. 수집·분류·kordoc은 오래 걸리고 상시 예약 실행기가 필요하다. 서버리스는 파일 시스템이 읽기 전용이고 Python 런타임에 Node가 없다(D-02 §8.1의 서버리스 주의와 같은 결론)", "상태": "결정 · 구현(2026-11-25)", "관련": "I-07, D-02 §9, `plan/01` 4.5"}, {"doc": "D-40", "번호": "ADR-047", "일자": "2026-11-24", "결정": "수요자 화면에 공고 유형 필터(공모지원사업·입찰공고·기타)와 유형 배지를 둔다. 처음에는 공모지원사업만 보이고, 필터로 입찰공고·기타도 볼 수 있다. 입찰공고는 계속 수집한다", "근거": "사용자 결정. 2026-11-24 수집분 1,010건 중 입찰공고 675건(67%), 공모지원사업 216건(21%)이라 '공모사업 찾기' 목적에 맞게 기본 표시를 좁힌다. ADR-044의 '유형 필터·배지 삭제'를 이 범위에서 대체한다", "상태": "결정 · 구현(2026-11-25)", "관련": "F-SVC-29, I-03·10, ADR-044"}, {"doc": "D-40", "번호": "ADR-048", "일자": "2026-11-24", "결정": "분류 기준을 v2로 확정한다. v1(`plan/prompts/classify_v1.system.md`)에서 세 가지를 바꾸고 나머지는 그대로 둔다: ① 위탁연구·연구과제 공모는 협약 단서가 있어도 입찰공고(협상공모) ② 공모사업 대상이어도 사전규격·사전공개 말머리 글은 입찰공고(사전규격) ③ 채용 합격자 발표는 기타(채용). `classify_v2`를 만들고 v1과 같은 방식으로 다시 검증한 뒤 쓴다", "근거": "사용자 결정(2026-11-24 Q&A). v1 검증에서 판단이 갈린 유형(위탁연구 36건, 공모사업 사전공개 약 24건, 합격자 발표 약 20건)을 말머리와 성격이 분명한 쪽으로 고정한다", "상태": "결정(v2 작성·검증 전)", "관련": "ADR-045, `plan/prompts/`, `.team/classify-guide.md`"}, {"doc": "D-40", "번호": "ADR-049", "일자": "2026-11-24", "결정": "분류·추출의 동기 API 호출은 서버 측 대체 모델(`fallbacks: \"default\"`, beta `server-side-fallback-2026-07-01`)을 켠다. 안전 정책으로 거절되면 서버가 대체 모델로 다시 실행하고, 대체 여부와 실제 모델을 호출 기록에 남긴다. 일괄 처리(Message Batches)에는 쓸 수 없으므로 거기서 거절된 건은 '분류 보류'로 둔다", "근거": "사용자 결정. 대체된 부분은 대체 모델 단가로 청구된다", "상태": "결정 · 구현(2026-11-25)", "관련": "ADR-045, D-20 §5(llm_calls), `plan/02`"}, {"doc": "D-40", "번호": "ADR-050", "일자": "2026-11-24", "결정": "첨부 글자 읽기에 kordoc(npm, MIT)을 도입한다. MCP 서버가 아니라 CLI를 하위 프로세스로 부르고, 버전을 고정하며(시험 버전 4.24.59), 파일당 시간 제한을 두고, 실패하면 기존 추출기(`app/services/extract.py`)로 넘어간다. OCR은 끈다. zip은 앱에서 먼저 풀고, 같은 이름의 hwp/hwpx가 있으면 pdf보다 먼저 읽는다", "근거": "사용자 결정. 실측: HWP·HWPX 표를 칸 짝까지 보존(KCA 입찰개요·NIPA 지원대상 표), 파일당 약 0.6초. PDF 표는 칸이 어긋나고, 이미지 PDF는 OCR 없이 읽지 못하며, zip은 지원하지 않음(`plan/03`)", "상태": "결정 · 구현(2026-11-25)", "관련": "F-CRW-11, I-04, ADR-046, `plan/03`"}, {"doc": "D-40", "번호": "ADR-051", "일자": "2026-11-24", "결정": "상세화면 표준 필드(공고명·공고 내용·지원자격·공모 지원분야·공모기간)는 원문 발췌로 채운다. 생성 요약은 쓰지 않는다. API도 원문을 인용만 하고, 앱이 인용이 원문에 있는지 검사한다. 규칙 추출은 모든 유형에 돌리고, 규칙으로 못 찾은 칸의 API 보완은 공모지원사업에만 쓴다. 수요자 상세 화면의 '첨부 구조화' 블록(생성 코드가 저장소에 없는 JSON 3개)을 표준 5칸으로 바꾸고, 유형상 없는 칸('해당 없음')은 흐리게 보인다", "근거": "사용자 결정(2026-11-24 2차 Q&A). 원문에 없는 문장이 화면에 나오지 않게 하고, API 비용은 기본 화면에 보이는 유형에만 쓴다. 칸 배치는 늘 같게 둔다", "상태": "결정 · 구현(2026-11-25)", "관련": "F-SVC-30, ADR-045, D-20 §5"}, {"doc": "D-40", "번호": "ADR-052", "일자": "2026-11-24", "결정": "분류 전이거나 분류에 실패한 공고는 수요자 기본 목록에 넣고 '미분류' 배지를 단다. 유형 필터의 기본 선택('공모지원사업')에 미분류가 함께 보이고, '미분류'만 따로 고를 수도 있다", "근거": "사용자 결정(2026-11-24 2차 Q&A). 분류가 늦거나 API가 실패해도 새 공고가 화면에서 사라지지 않게 한다", "상태": "결정 · 구현(2026-11-25)", "관련": "F-SVC-29, ADR-047"}], "changes": [{"일자": "2026-11-25", "문서": "D-40", "버전": "0.32", "내용": "ADR-045~052 상태 '결정(구현 전)' → '결정 · 구현(2026-11-25)'", "작성": "Claude"}, {"일자": "2026-11-25", "문서": "FS-SVC", "버전": "0.23", "내용": "F-SVC-29·30 상태 '구현'", "작성": "Claude"}, {"일자": "2026-11-25", "문서": "FS-CRW", "버전": "0.7", "내용": "F-CRW-11 상태 '구현'(kordoc CLI, ADR-050)", "작성": "Claude"}, {"일자": "2026-11-25", "문서": "D-20", "버전": "0.4", "내용": "§5 배포 파이프라인 표 '계획' → '구현'", "작성": "Claude"}, {"일자": "2026-11-25", "문서": "D-02", "버전": "0.7", "내용": "§9.3 검증 현황: classify_v2 관문 1 통과, extract_v1 잠정 지표", "작성": "Claude"}, {"일자": "2026-11-25", "문서": "D-41", "버전": "0.7", "내용": "I-11 비고에 구현 5단계 실측 비용(분류 v2·표준 필드 API 보완) 추가", "작성": "Claude"}, {"일자": "2026-11-24", "문서": "D-40", "버전": "0.31", "내용": "ADR-051(표준 필드 원문 발췌·API 보완 범위·상세 표준 5칸), ADR-052(미분류 공고 기본 표시) 추가", "작성": "Claude"}, {"일자": "2026-11-24", "문서": "D-41", "버전": "0.6", "내용": "I-07(이식형까지만), I-11(실측 전까지 기록만) 비고 갱신", "작성": "Claude"}, {"일자": "2026-11-24", "문서": "FS-SVC", "버전": "0.22", "내용": "F-SVC-30(상세 표준 5칸) 추가, §4.13 '분류 전 공고' 확정, §4.14 신설", "작성": "Claude"}, {"일자": "2026-11-24", "문서": "D-20", "버전": "0.3", "내용": "§5 추가 표의 열 확정(plan/00 5.1과 맞춤), attachments.text_engine 추가", "작성": "Claude"}, {"일자": "2026-11-24", "문서": "D-02", "버전": "0.6", "내용": "§9를 plan/00 구현 핸드오프 기준으로 갱신(정한 값·검증 현황·남은 일)", "작성": "Claude"}, {"일자": "2026-11-24", "문서": "D-40", "버전": "0.30", "내용": "ADR-045~050 추가(API 분류·표준 필드 추출 재도입, 컨테이너 배포, 유형 필터, 분류 기준 v2, 서버 측 대체 모델, kordoc). ADR-044를 일부 대체됨으로 표시", "작성": "Claude"}, {"일자": "2026-11-24", "문서": "D-41", "버전": "0.5", "내용": "I-03·04·10 해결, I-07·08 일부 해결로 상태 변경, I-11(API 월 예 2026-10-02", "문서": "D-01", "버전": "0.1", "내용": "최초 작성 — 목표 구조, 설계 원칙 P1~P7, 로드맵", "작성": "Claude"}, {"일자": "2026-10-02", "문서": "D-02", "버전": "0.1", "내용": "최초 작성 — 기술 스택, 모듈 구조, AI 호출 방식, 비용 추정", "작성": "Claude"}, {"일자": "2026-10-02", "문서": "FS-CRW", "버전": "0.1", "내용": "최초 작성 — 수집 기능 13종(구현 6·부분 1·신규 3·검토 1·보류 2)", "작성": "Claude"}, {"일자": "2026-10-02", "문서": "FS-SEL", "버전": "0.1", "내용": "최초 작성 — 선별 기능 8종, 공고 유형 정의, 노출 결정표", "작성": "Claude"}, {"일자": "2026-10-02", "문서": "FS-CLS", "버전": "0.1", "내용": "최초 작성 — 분류 기능 8종, 분류 체계 초안 v0, 출력 스키마", "작성": "Claude"}, {"일자": "2026-10-02", "문서": "FS-SVC", "버전": "0.1", "내용": "최초 작성 — 서비스 기능 9종, PIMS 연계 후보, 화면 공통 규칙", "작성": "Claude"}, {"일자": "2026-10-02", "문서": "D-20", "버전": "0.1", "내용": "최초 작성 — 현재·목표 테이블 구조, 이관 방안", "작성": "Claude"}, {"일자": "2026-10-02", "문서": "D-30", "버전": "0.1", "내용": "최초 작성 — 검증 데이터, 지표 연결, 실험 기록 양식", "작성": "Claude"}, {"일자": "2026-10-02", "문서": "D-40", "버전": "0.1", "내용": "최초 작성 — ADR-001~007", "작성": "Claude"}, {"일자": "2026-10-02", "문서": "D-41", "버전": "0.1", "내용": "최초 작성 — I-01~10", "작성": "Claude"}, {"일자": "2026-10-02", "문서": "D-90", "버전": "0.1", "내용": "최초 작성", "작성": "Claude"}, {"일자": "2026-11-20", "문서": "전체", "버전": "1.0", "내용": "판별 기능 삭제(ADR-044): 분류·선별 문서(11·12)와 AI 호출 비용 문서 삭제, 나머지 문서에 삭제 안내 추가, F-SVC 일부 삭제 표시", "작성": "Claude"}], "warnings": []};</script>
<script>
(() => {
  const D = window.DESIGN;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const STATUS = ["구현", "부분", "시안", "신규", "검토", "보류", "폐기"];
  const SCOL = { 구현: "#0ca30c", 부분: "#eda100", 시안: "#2a78d6", 신규: "#e34948", 검토: "#ec835a", 보류: "#b9bdc4", 폐기: "#dfe1e5" };
  const BADGE = new Set([...STATUS, "초안", "확정", "결정", "제안", "대체됨", "미결", "해결", "상", "중", "하"]);
  const docById = Object.fromEntries(D.docs.map((d) => [d.meta.doc_id, d]));
  const area = (id) => ({ CRW: "수집", SEL: "선별", CLS: "분류·추출", SVC: "서비스" }[id.split("-")[1]] || id.split("-")[1]);
  const fnDoc = { CRW: "FS-CRW", SEL: "FS-SEL", CLS: "FS-CLS", SVC: "FS-SVC" };
  const badge = (s) => `<span class="badge b-${esc(s)}">${esc(s)}</span>`;

  // ── 인라인: 굵게·코드·링크·문서/기능 ID 링크 ──
  function inline(s) {
    const codes = [];
    s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
    s = esc(s);
    s = s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
    s = s.replace(/(^|[^\w-])(D-\d{2}|FS-[A-Z]{3})(?![\w-])/g, (m, p, id) => docById[id] ? `${p}<a class="ref" href="#doc/${id}">${id}</a>` : m);
    s = s.replace(/(^|[^\w-])(F-([A-Z]{3})-\d{2})(?![\w-])/g, (m, p, id, a) => fnDoc[a] ? `${p}<a class="ref" href="#doc/${fnDoc[a]}">${id}</a>` : m);
    s = s.replace(/(^|[^\w-])((ADR-\d{3})|(I-\d{2}))(?![\w-])/g, (m, p, id) => `${p}<a class="ref" href="#doc/${id.startsWith("ADR") ? "D-40" : "D-41"}">${id}</a>`);
    return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[i])}</code>`);
  }
  const cell = (c) => (BADGE.has(c.trim()) ? badge(c.trim()) : inline(c));
  const splitRow = (l) => l.trim().replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map((c) => c.trim().replace(/\\\|/g, "|"));

  // ── 블록: 제목·문단·목록·표·코드·인용(콜아웃)·HTML ──
  function md(src) {
    const L = src.replace(/\r/g, "").split("\n"); let i = 0, out = "";
    while (i < L.length) {
      const l = L[i];
      if (!l.trim()) { i++; continue; }
      if (l.startsWith("```")) { const buf = []; i++; while (i < L.length && !L[i].startsWith("```")) buf.push(L[i++]); i++; out += `<pre><code>${esc(buf.join("\n"))}</code></pre>`; continue; }
      const h = l.match(/^(#{1,4})\s+(.*)/); if (h) { out += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; i++; continue; }
      if (/^-{3,}\s*$/.test(l)) { out += "<hr>"; i++; continue; }
      if (l.startsWith("<")) { const buf = []; while (i < L.length && L[i].trim()) buf.push(L[i++]); out += buf.join("\n"); continue; }
      if (l.startsWith("|") && L[i + 1] && /^\|\s*:?-{3,}/.test(L[i + 1])) {
        const head = splitRow(l); i += 2; let rows = "";
        while (i < L.length && L[i].startsWith("|")) { rows += "<tr>" + splitRow(L[i]).map((c) => `<td>${cell(c)}</td>`).join("") + "</tr>"; i++; }
        out += `<div class="tbl-wrap"><table><thead><tr>${head.map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`; continue;
      }
      if (l.startsWith(">")) {
        const buf = []; while (i < L.length && L[i].startsWith(">")) buf.push(L[i++].replace(/^>\s?/, ""));
        const m = buf[0].match(/^\[!(\w+)\]\s*(.*)/); let kind = "note", title = "";
        if (m) { kind = m[1].toLowerCase(); title = m[2]; buf.shift(); }
        out += `<div class="callout ${kind}">${title ? `<div class="ct">${inline(title)}</div>` : ""}${buf.map((b) => `<p>${inline(b)}</p>`).join("")}</div>`; continue;
      }
      if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
        const ordered = /^\s*\d+\./.test(l); let html = "";
        while (i < L.length && /^\s*([-*]|\d+\.)\s+/.test(L[i])) {
          const sub = /^\s{2,}/.test(L[i]); const t = L[i].replace(/^\s*([-*]|\d+\.)\s+/, "");
          html += sub ? `<ul><li>${inline(t)}</li></ul>` : `<li>${inline(t)}</li>`; i++;
        }
        out += ordered ? `<ol>${html}</ol>` : `<ul>${html}</ul>`; continue;
      }
      const buf = []; while (i < L.length && L[i].trim() && !/^(#|\||>|```|<|\s*[-*]\s|\s*\d+\.\s)/.test(L[i])) buf.push(L[i++]);
      if (!buf.length) buf.push(L[i++]);
      out += `<p>${inline(buf.join(" "))}</p>`;
    }
    return out;
  }

  // ── 사이드바 ──
  function nav(active) {
    let h = `<div class="nav-group"><a href="#home" class="${active === "home" ? "on" : ""}">설계 현황 요약<i></i></a></div>`;
    D.groups.forEach((g) => {
      const ds = D.docs.filter((d) => d.meta.group === g);
      if (!ds.length) return;
      h += `<div class="nav-group"><h4>${esc(g)}</h4>` + ds.map((d) => `<a href="#doc/${esc(d.meta.doc_id)}" data-id="${esc(d.meta.doc_id)}" class="${active === d.meta.doc_id ? "on" : ""}">${esc(d.meta.title.replace(/^기능정의서 — /, ""))}<i>v${esc(d.meta.version)} · ${esc(d.meta.status)}</i></a>`).join("") + `</div>`;
    });
    $("nav").innerHTML = h;
    filterNav();
  }
  function filterNav() {
    const q = $("q").value.trim().toLowerCase();
    document.querySelectorAll("#nav a[data-id]").forEach((a) => {
      const d = docById[a.dataset.id];
      a.classList.toggle("hidden", !!q && !(d.meta.title + d.body).toLowerCase().includes(q));
    });
  }

  // ── 요약 화면 ──
  let fArea = "전체", fStatus = "전체";
  function home() {
    const F = D.functions, cnt = (s) => F.filter((f) => f["상태"] === s).length;
    const openI = D.issues.filter((x) => x["상태"] !== "해결");
    const last = D.changes[0];
    const docsDone = D.docs.filter((d) => d.meta.status === "확정").length;
    let h = `<div class="crumb">공모사업 파이프라인 · 설계 문서</div><h1 style="margin:0;font-size:28px;letter-spacing:-.03em">설계 현황 요약</h1>
      <div class="meta-line">문서 ${D.docs.length}개 · 생성 ${esc(D.generated_at.replace("T", " "))} · 원본 <code>설계(안)/docs/*.md</code></div>`;
    if (D.warnings.length) h += `<div class="warnbox"><b>⚠ 문서 점검 경고 ${D.warnings.length}건</b><br>${D.warnings.map(esc).join("<br>")}</div>`;
    h += `<section class="tiles">
      <div class="tile"><div class="l">정의된 기능</div><div class="v">${F.length}</div><div class="s">구현 ${cnt("구현")} · 부분 ${cnt("부분")} · 신규 ${cnt("신규")}</div></div>
      <div class="tile"><div class="l">미결 사항</div><div class="v">${openI.length}</div><div class="s">전체 ${D.issues.length}건 중 미해결</div></div>
      <div class="tile"><div class="l">설계 결정</div><div class="v">${D.decisions.length}</div><div class="s">결정 ${D.decisions.filter((x) => x["상태"] === "결정").length} · 제안 ${D.decisions.filter((x) => x["상태"] === "제안").length} · 보류 ${D.decisions.filter((x) => x["상태"] === "보류").length}</div></div>
      <div class="tile"><div class="l">확정 문서</div><div class="v">${docsDone}/${D.docs.length}</div><div class="s">최근 개정 ${last ? esc(last["일자"]) : "—"}</div></div>
    </section>`;

    // 영역별 구현 현황 (가로 누적 막대, 상태 = 범주)
    const areas = [...new Set(F.map((f) => area(f.ID)))];
    h += `<div class="card"><div class="hd"><h3>영역별 기능 현황</h3><div class="legend">${STATUS.filter(cnt).map((s) => `<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${SCOL[s]};margin-right:5px"></span>${s} ${cnt(s)}</span>`).join("")}</div></div>` +
      areas.map((a) => {
        const fs = F.filter((f) => area(f.ID) === a);
        return `<div style="display:grid;grid-template-columns:90px 1fr 60px;gap:12px;align-items:center;font-size:13px"><span>${esc(a)}</span>
          <div class="stack">${STATUS.map((s) => { const n = fs.filter((f) => f["상태"] === s).length; return n ? `<span style="flex:${n};background:${SCOL[s]}" title="${a} · ${s} ${n}건"></span>` : ""; }).join("")}</div>
          <span style="text-align:right;color:var(--t2)">${fs.length}개</span></div>`;
      }).join("") + `</div>`;

    // 기능 목록
    h += `<div class="card"><div class="hd"><h3>전체 기능 목록</h3>
      <div class="chips" id="fa">${["전체", ...areas].map((a) => `<button class="chip ${a === fArea ? "on" : ""}" data-v="${a}">${a}</button>`).join("")}</div></div>
      <div class="chips" id="fs" style="margin-bottom:6px">${["전체", ...STATUS.filter(cnt)].map((s) => `<button class="chip ${s === fStatus ? "on" : ""}" data-v="${s}">${s}${s === "전체" ? "" : " " + cnt(s)}</button>`).join("")}</div>
      <div class="tbl-wrap"><table><thead><tr><th>ID</th><th>영역</th><th>기능명</th><th>설명</th><th>우선순위</th><th>상태</th><th>비고</th></tr></thead><tbody id="ftb"></tbody></table></div></div>`;

    h += `<div class="grid2"><div class="card"><h3>미결 사항</h3><div class="tbl-wrap"><table><thead><tr><th>번호</th><th>쟁점</th><th>상태</th></tr></thead><tbody>` +
      D.issues.map((x) => `<tr><td><a class="ref" href="#doc/D-41">${esc(x["번호"])}</a></td><td>${inline(x["쟁점"])}</td><td>${badge(x["상태"])}</td></tr>`).join("") + `</tbody></table></div></div>
      <div class="card"><h3>최근 개정</h3><div class="tbl-wrap"><table><thead><tr><th>일자</th><th>문서</th><th>버전</th><th>내용</th></tr></thead><tbody>` +
      D.changes.slice(0, 8).map((c) => `<tr><td style="white-space:nowrap">${esc(c["일자"])}</td><td>${inline(c["문서"])}</td><td>${esc(c["버전"])}</td><td>${inline(c["내용"])}</td></tr>`).join("") + `</tbody></table></div>
      <a href="#doc/D-90">전체 개정 이력 →</a></div></div>`;

    h += `<div class="card"><h3>문서 목록</h3><div class="tbl-wrap"><table><thead><tr><th>문서번호</th><th>문서</th><th>분류</th><th>버전</th><th>상태</th><th>최종 개정</th></tr></thead><tbody>` +
      D.docs.map((d) => `<tr><td><a class="ref" href="#doc/${esc(d.meta.doc_id)}">${esc(d.meta.doc_id)}</a></td><td>${esc(d.meta.title)}</td><td>${esc(d.meta.group)}</td><td>${esc(d.meta.version)}</td><td>${badge(d.meta.status)}</td><td>${esc(d.meta.updated)}</td></tr>`).join("") + `</tbody></table></div></div>`;
    $("main").innerHTML = h + foot();
    const bind = (id, set) => document.querySelectorAll(`#${id} .chip`).forEach((b) => b.onclick = () => { set(b.dataset.v); document.querySelectorAll(`#${id} .chip`).forEach((x) => x.classList.toggle("on", x === b)); ftable(); });
    bind("fa", (v) => fArea = v); bind("fs", (v) => fStatus = v);
    ftable();
  }
  function ftable() {
    const q = $("q").value.trim().toLowerCase();
    const rows = D.functions.filter((f) => (fArea === "전체" || area(f.ID) === fArea) && (fStatus === "전체" || f["상태"] === fStatus) &&
      (!q || Object.values(f).join(" ").toLowerCase().includes(q)));
    const el = $("ftb"); if (!el) return;
    el.innerHTML = rows.map((f) => `<tr><td style="white-space:nowrap"><a class="ref" href="#doc/${fnDoc[f.ID.split("-")[1]]}">${esc(f.ID)}</a></td><td style="white-space:nowrap">${esc(area(f.ID))}</td><td style="white-space:nowrap">${inline(f["기능명"] || "")}</td><td>${inline(f["설명"] || "")}</td><td>${badge(f["우선순위"] || "")}</td><td>${badge(f["상태"] || "")}</td><td>${inline(f["비고"] || "")}</td></tr>`).join("") ||
      `<tr><td colspan="7" style="color:var(--t3)">조건에 맞는 기능이 없습니다.</td></tr>`;
  }

  // ── 문서 화면 ──
  function doc(id) {
    const d = docById[id]; if (!d) return home();
    const q = $("q").value.trim();
    let body = md(d.body.replace(/^\s*#\s+.*\n/, ""));
    if (q) body = body.replace(new RegExp(`(>[^<]*?)(${q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "gi"), "$1<mark>$2</mark>");
    const hist = D.changes.filter((c) => c["문서"] === id);
    $("main").innerHTML = `<div class="crumb">${esc(d.meta.group)} · ${esc(d.meta.doc_id)}</div><div class="doc"><h1>${esc(d.meta.title)}</h1>
      <div class="meta-line">${badge(d.meta.status)} 버전 ${esc(d.meta.version)} · 최종 개정 ${esc(d.meta.updated)} · 원본 <code>docs/${esc(d.file)}</code></div>${body}
      <h2>이 문서의 개정 이력</h2><div class="tbl-wrap"><table><thead><tr><th>일자</th><th>버전</th><th>내용</th><th>작성</th></tr></thead><tbody>${hist.map((c) => `<tr><td>${esc(c["일자"])}</td><td>${esc(c["버전"])}</td><td>${inline(c["내용"])}</td><td>${esc(c["작성"])}</td></tr>`).join("") || `<tr><td colspan="4">기록 없음</td></tr>`}</tbody></table></div></div>` + foot();
    scrollTo(0, 0);
  }
  const foot = () => `<div class="foot">이 페이지는 <code>python build_index.py</code>로 생성됩니다. 문서를 고칠 때는 md 원본을 수정하고 버전·개정 이력을 함께 갱신하세요(D-00 §5).</div>`;

  function route() {
    const h = location.hash.slice(1);
    if (h.startsWith("doc/")) { nav(h.slice(4)); doc(h.slice(4)); } else { nav("home"); home(); }
  }
  $("q").addEventListener("input", () => { filterNav(); const h = location.hash.slice(1); if (h.startsWith("doc/")) doc(h.slice(4)); else ftable(); });
  addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
