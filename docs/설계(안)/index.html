<script>window.DESIGN = {"generated_at": "2026-11-25T18:09:36", "groups": ["설계", "기능정의서", "데이터·검증", "관리"], "docs": [{"file": "00_개요.md", "meta": {"doc_id": "D-00", "title": "개요 및 문서 관리 규칙", "group": "설계", "version": "0.2", "status": "초안", "updated": "2026-10-06"}, "body": "\n> [!warning] 2026-11-20 판별 기능 삭제(ADR-044)\n> 공고 AI 판별·분류 체계·선별 규칙·노출 규칙·AI 호출 비용 관련 기능은 모두 삭제했다. 이 문서의 해당 내용은 **당시 설계의 이력**으로만 남기며 현재 구현과 다르다. 삭제 전 코드·DB·문서는 `data/bak_remove_cls_1120/`에 있다.\n\n# 개요 및 문서 관리 규칙\n\n## 1. 목적\n\n「ICT기금 사용자 중심 AX서비스 구축 계획(안)」('26.6.24, 기금사업성과팀)의 **공모사업 파이프라인**을 실제로 구현하기 위한 설계 문서 모음이다. 크롤링(공고 수집)과 AI 기능(선별·분류)의 설계 방향, 개발 방식, 기능 정의를 한곳에서 관리하고, 개발이 진행되면 같은 문서를 개정해 누적한다.\n\n> [!quote] AX계획 원문 (2. ICT기금 공모사업 파이프라인)\n> (정보 수집) 주요 전담기관 및 유관 부처 홈페이지를 대상으로 실시간 웹 크롤링을 통한 공고 데이터의 주기적 자동 수집\n> (AI기반 선별) 문맥 분석 기술을 활용해 일반 공지, 입찰, 타분야 사업 등을 구분하고 ICT기금 비R&D 사업공고만을 판별하여 추출\n> (콘텐츠 지능형 분석) 공고 내용의 주요 정보를 자동 추출·요약하고 지원대상, 지원방식, 사업 분야 등으로 구조화 및 카테고리화\n\n## 2. 범위\n\n| 구 분 | 포함 | 제외(별도 과제) |\n|---|---|---|\n| 수집 | 전담기관·유관기관 16개 공고 게시판 | 부처 보도자료, 민간 플랫폼 |\n| AI 기능 | 공고 선별, 분류, 핵심 정보 추출·요약, 사업 단위 묶기 | 규정·법령 어드바이저(AX계획 1번 과제) |\n| 서비스 | 운영 현황판, 조회 화면, 내보내기, PIMS 연계 방식 정의 | PIMS 내부 화면 개발 |\n\n## 3. 문서 체계\n\n| 문서번호 | 문서 | 주요 내용 |\n|---|---|---|\n| D-00 | 개요 및 문서 관리 규칙 | 목적·범위·용어·관리 규칙 |\n| D-01 | 설계 방향 | 목표 구조, 설계 원칙, 단계별 로드맵 |\n| D-02 | 개발 방식 | 기술 스택, 모듈 구조, AI 호출 방식, 테스트·운영 |\n| FS-CRW | 기능정의서 — 수집 | 기관 어댑터, 목록·상세 수집, 정규화, 실행 기록 |\n| FS-SEL | 기능정의서 — 선별 | 공고 유형 판정, 기금·비R&D 판정, 노출 결정 |\n| FS-CLS | 기능정의서 — 분류·추출 | 분류 체계, 정보 추출, 요약, 사업 단위 묶기 |\n| FS-SVC | 기능정의서 — 서비스 | 현황판, 조회 화면, 검수, PIMS 연계 |\n| D-20 | 데이터 설계 | 테이블 구조, 키 설계, 이관 방안 |\n| D-30 | 검증 및 품질 관리 | 검증 데이터, 정확도 측정, 실험 기록 |\n| D-40 | 결정 기록 | 설계 결정과 그 근거(누적) |\n| D-41 | 미결 사항 | 결정이 필요한 쟁점과 담당 |\n| D-90 | 개정 이력 | 문서별 개정 내역(누적) |\n\n## 4. 용어\n\n| 용어 | 뜻 |\n|---|---|\n| 기관 어댑터 | 기관 게시판 하나를 읽는 수집 모듈. 기관이 늘면 어댑터만 추가한다 |\n| 증분 수집 | 이미 수집한 글을 건너뛰고 새 글만 받는 방식 |\n| 선별 | 수집된 공고 가운데 수요자에게 보여 줄 ICT기금 비R&D 사업공고를 고르는 것 |\n| 분류 | 선별된 공고에 수혜자 유형·지원방식·사업분야 값을 붙이는 것 |\n| 내역사업 목록 | 기금운용계획상 내역사업과 기금 여부·R&D 구분을 담은 기준표(사업 마스터) |\n| 사업 단위 묶기 | 같은 사업의 본공고·수정공고·결과 공지를 하나의 사업으로 연결하는 것 |\n| 검증 데이터 | 담당자가 정답을 표시한 공고 묶음. AI 판정 정확도를 재는 기준 |\n\n## 5. 문서 관리 규칙\n\n> [!important] 누적 관리 원칙\n> 문서는 지우지 않고 **개정**한다. 바뀐 내용은 D-90 개정 이력에, 설계 판단은 D-40 결정 기록에 남긴다.\n\n| 항목 | 규칙 |\n|---|---|\n| 원본 | `설계(안)/docs/*.md`가 원본이다. `index.html`은 생성물이므로 직접 고치지 않는다 |\n| 머리말 | 문서마다 `doc_id`·`title`·`group`·`version`·`status`·`updated`를 둔다 |\n| 버전 | 내용 보완은 0.1 단위로 올리고, 담당자 검토를 거쳐 확정하면 1.0으로 올린다 |\n| 상태 | `초안` → `검토` → `확정`. 확정 문서를 고치면 다시 `검토`로 내린다 |\n| 기능 ID | `F-{영역}-{번호}`(예: F-SEL-03). 한 번 쓴 번호는 기능이 폐기돼도 재사용하지 않는다 |\n| 기능 상태 | `구현` · `부분` · `시안` · `신규` · `검토` · `보류` · `폐기` 중 하나 |\n| 결정·미결 | 결정은 `ADR-NNN`, 미결은 `I-NN`으로 번호를 붙이고 행을 지우지 않는다(상태만 바꾼다) |\n| 개정 절차 | ① md 수정 → ② `version`·`updated` 갱신 → ③ D-90에 한 줄 추가 → ④ `python build_index.py` 실행 |\n\n`build_index.py`는 실행할 때 기능 ID 중복, 머리말 누락, 개정 이력에 없는 버전을 찾아 경고한다.\n\n## 6. 근거 자료\n\n| 자료 | 위치 |\n|---|---|\n| AX서비스 구축 계획(안) | `docs/기획/붙임. ICT기금 사용자 중심 AX서비스 구축 계획.hwpx` |\n| 크롤링 추진계획(안) | `docs/기획/ICT기금 공모사업 웹크롤링 추진계획(안).hwpx` |\n| 대상 기관 URL 점검 결과 | `docs/기획/ICT기금_전담기관_크롤링타겟_점검결과.xlsx` |\n| 성과지표 정의서 | `docs/기획/ICT기금_공모사업_크롤링_성과지표_정의서.xlsx` |\n| 웹앱 소스(Flask) | `app/`, 실행 안내 `README.md` |\n| 웹앱 DB·첨부 | `data/gongmo.db`, 첨부는 `.env`의 `ATTACHMENT_DIR` |\n| 구 NIPA 수집기·DB(보관) | `archive/legacy_nipa/` |\n| 대시보드 UI 시안 | `docs/UI_디자인(안)/index.html` — 안2를 수요자 화면으로 적용 예정 |\n"}, {"file": "01_설계방향.md", "meta": {"doc_id": "D-01", "title": "설계 방향", "group": "설계", "version": "0.1", "status": "초안", "updated": "2026-10-02"}, "body": "\n> [!warning] 2026-11-20 판별 기능 삭제(ADR-044)\n> 공고 AI 판별·분류 체계·선별 규칙·노출 규칙·AI 호출 비용 관련 기능은 모두 삭제했다. 이 문서의 해당 내용은 **당시 설계의 이력**으로만 남기며 현재 구현과 다르다. 삭제 전 코드·DB·문서는 `data/bak_remove_cls_1120/`에 있다.\n\n# 설계 방향\n\n## 1. 목표 구조\n\n공고 한 건이 수집부터 서비스까지 거치는 흐름이다. 각 단계는 앞 단계의 저장 결과만 읽으므로 따로 다시 돌릴 수 있다. 예를 들어 분류 기준이 바뀌면 수집을 다시 하지 않고 분류 단계만 재실행한다.\n\n<div class=\"flow\">\n  <div class=\"step\"><b>① 수집<\/b><span>기관 어댑터가 목록·상세를 읽음<\/span><em>FS-CRW<\/em><\/div>\n  <div class=\"step\"><b>② 정규화 저장<\/b><span>공통 구조로 DB 저장<\/span><em>D-20<\/em><\/div>\n  <div class=\"step\"><b>③ 선별<\/b><span>규칙 → 내역사업 대조 → AI<\/span><em>FS-SEL<\/em><\/div>\n  <div class=\"step\"><b>④ 분류·추출<\/b><span>유형·분야·지원정보 구조화<\/span><em>FS-CLS<\/em><\/div>\n  <div class=\"step\"><b>⑤ 검수<\/b><span>확신 낮은 건 담당자 확인<\/span><em>FS-SVC<\/em><\/div>\n  <div class=\"step\"><b>⑥ 서비스<\/b><span>현황판·조회·PIMS 연계<\/span><em>FS-SVC<\/em><\/div>\n<\/div>\n\n| 단계 | 입력 | 출력 | 실행 시점 |\n|---|---|---|---|\n| ① 수집 | 기관 게시판 URL | 공고 원문(제목·기간·본문·첨부 목록) | 매일 1회(증분) |\n| ② 정규화 저장 | 원문 | 공통 스키마의 공고 행 | 수집 직후 |\n| ③ 선별 | 공고 행 + 내역사업 목록 | 공고 유형, 기금·R&D 구분, 노출 여부 | 신규·변경 공고 발생 시 |\n| ④ 분류·추출 | 노출 대상 공고 | 수혜자 유형, 지원방식, 사업분야, 지원정보 요약 | 선별 직후 |\n| ⑤ 검수 | 확신 낮은 판정 | 담당자 확정값 | 주 1회 또는 수시 |\n| ⑥ 서비스 | 확정·자동 판정 결과 | 현황판, 조회 화면, 내보내기 | 상시 |\n\n## 2. 설계 원칙\n\n| 번호 | 원칙 | 적용 |\n|---|---|---|\n| P1 | **규칙으로 정할 수 있는 것은 규칙으로** | 입찰·결과 발표처럼 제목만으로 갈리는 공고와 기금 여부(내역사업 대조)는 AI를 쓰지 않는다. AI는 애매한 건과 본문 이해가 필요한 분류에만 쓴다 |\n| P2 | **AI 판정은 재현 가능하게** | 모든 판정에 모델명·프롬프트 버전·분류 체계 버전·근거 문장을 함께 저장한다 |\n| P3 | **사람 판정이 우선** | 담당자가 고친 값은 AI 재실행으로 덮어쓰지 않는다. 고친 값은 검증 데이터로 쌓는다 |\n| P4 | **원천 보존** | 원문 URL, 최초·최종 수집 시각, 사이트 원문 값을 지우지 않는다. 가공값은 별도 칸에 둔다 |\n| P5 | **기관 추가는 어댑터 추가로** | 저장 구조·선별·분류는 기관과 무관하게 만든다. 새 기관은 어댑터 파일 하나로 붙인다 |\n| P6 | **준법 수집** | robots.txt 준수, 요청 간격 0.3초 이상, 개인정보(담당자 연락처 등) 미수집 |\n| P7 | **공급자 교체 가능** | AI 호출부를 한 모듈로 모아, 모델·공급자를 바꿔도 선별·분류 로직은 그대로 둔다 |\n\n## 3. 핵심 설계 판단\n\n> [!tip] 기금·비R&D 판정은 AI가 아니라 기준표 대조\n> NIPA 공고 353건을 보면 공고문에 재원(기금·일반회계)이나 R&D 구분이 거의 적혀 있지 않다. 반면 상세 페이지의 사업구분 칸이 99.2%(350/353건) 채워져 있어 내역사업명 역할을 한다. 그래서 사업구분 → 내역사업 → 기금·R&D 구분을 기준표로 대조하고, 기준표에 없는 사업만 AI가 추정한 뒤 담당자가 확인한다(ADR-003).\n\n> [!tip] 공고가 아니라 사업 단위로 보여 준다\n> 같은 사업이 본공고·수정공고·추가모집·결과 공지로 여러 번 게시된다(예: 'ICT창의기업육성' 36건). 수요자 화면은 사업 하나를 카드 하나로 보여 주고 공고 이력을 그 안에 묶는다(F-CLS-06).\n\n> [!warning] 내용이 첨부에만 있는 공고\n> NIPA 공고의 27.5%(97/353건)는 본문이 50자 미만이고 내용이 첨부(hwp·pdf)에 있다. 첨부 저장은 보류 중이므로, 1차 PoC에서는 이런 공고를 '정보 부족'으로 표시하고 정확도를 따로 집계한다(I-04).\n\n## 4. 단계별 로드맵\n\n| 단계 | 시기 | 범위 | 완료 기준 |\n|---|---|---|---|\n| 0. 선행 수집 | '26.10월 초(완료) | NIPA 사업공고 1개 게시판 | 353건 수집, 빠진 번호·오류 0건 |\n| 1. 선별·분류 PoC | '26.10월 | NIPA 2026년 공고 121건 | 검증 데이터 구축, 선별·분류 정확도 첫 측정 |\n| 2. 수집 확대 | '26.10월 ~ 11월 | 1단계 7개 기관 | 기관별 어댑터 가동, 공통 스키마 이관 |\n| 3. 보완 | '26.11월 ~ 12월 | 2단계 기관, 오분류 개선 | 정확도 목표 달성(목표치 I-09) |\n| 4. 실증·연계 | '26.12월 ~ '27년 | PIMS 연계 | 연계 방식 확정(I-06), 서비스 오픈 |\n\n## 5. 범위 밖으로 둔 것\n\n| 항목 | 상태 | 근거 |\n|---|---|---|\n| 첨부파일 자동 저장 | 보류 | '26.10.1 사용자 결정(ADR-005). 다운로드 링크 토큰이 접속마다 바뀌어, 도입 시 수집 시점에 즉시 받아야 함 |\n| 자동 실행(작업 스케줄러) | 보류 | '26.10.1 사용자 결정(ADR-005). 현재 `update_nipa_dashboard.bat` 수동 실행 |\n| 대시보드 UI 개편 | 보류 | '26.10.2 사용자 결정(ADR-006). 시안 4종은 `UI_디자인(안)`에 보존 |\n"}, {"file": "02_개발방식.md", "meta": {"doc_id": "D-02", "title": "개발 방식", "group": "설계", "version": "0.7", "status": "초안", "updated": "2026-11-25"}, "body": "\n> [!warning] 2026-11-20 판별 기능 삭제(ADR-044)\n> 공고 AI 판별·분류 체계·선별 규칙·노출 규칙·AI 호출 비용 관련 기능은 모두 삭제했다. 이 문서의 해당 내용은 **당시 설계의 이력**으로만 남기며 현재 구현과 다르다. 삭제 전 코드·DB·문서는 `data/bak_remove_cls_1120/`에 있다.\n>\n> 2026-11-24 ADR-045~050으로 분류·표준 필드 추출을 API로 다시 넣기로 했다(구현 전). 새 구성은 §9. §5·§8의 옛 판별 흐름은 이력이다.\n\n# 개발 방식\n\n## 1. 개발 원칙\n\n- 내부 자체 개발로 진행하고, 이미 가동 중인 NIPA 수집기(`nipa/nipa_crawler.py`)를 공통 구조로 확장한다.\n- PoC는 NIPA 2026년 공고 121건으로 작게 시작하고, 정확도를 잰 뒤 대상을 넓힌다.\n- 수집·선별·분류를 각각 따로 실행할 수 있게 나눈다. 한 단계를 고쳐도 다른 단계는 다시 돌리지 않는다(D-01 §1).\n\n## 2. 기술 스택\n\n| 구 분 | 현재(PoC) | 확장 시 | 비고 |\n|---|---|---|---|\n| 언어 | Python 3 | 동일 | 기존 수집기와 같은 언어 |\n| HTTP·파싱 | requests, BeautifulSoup(lxml) | 동일 | 정적 HTML 게시판 |\n| 동적 페이지 | 없음 | Ajax 직접 호출 우선, 필요 시 Playwright | KOTRA 등(F-CRW-09) |\n| 저장소 | SQLite(`nipa/data/nipa.db`) | 운영 DB 이관 검토 | 이관 대상·시기는 I-06과 함께 결정 |\n| AI | 없음 | Claude API(Python `anthropic` SDK) | 이 PC에 SDK 1.5.0과 API 키 준비됨 |\n| 내보내기 | openpyxl(엑셀), HTML 대시보드 | 동일 + PIMS 연계 | |\n| 실행 | `update_nipa_dashboard.bat` 수동 | 스케줄러(보류, ADR-005) | |\n\n## 3. 모듈 구조(안)\n\n현재는 `nipa/` 폴더에 NIPA 전용 코드만 있다. 기관을 늘리기 전에 아래 구조로 정리한다.\n\n```\npipeline/\n├── crawl/\n│   ├── core.py          # 세션·재시도·요청 간격·robots.txt 확인·실행 기록\n│   ├── adapters/        # 기관 어댑터 — 기관 하나 = 파일 하나\n│   │   ├── nipa.py\n│   │   ├── nia.py\n│   │   └── ...\n│   └── run.py           # 어댑터 목록을 돌며 증분 수집\n├── ai/\n│   ├── client.py        # AI 호출 단일 진입점(모델·공급자 교체 지점)\n│   ├── select.py        # 선별(FS-SEL)\n│   ├── classify.py      # 분류·추출(FS-CLS)\n│   ├── prompts/         # 프롬프트 원문 — 파일명에 버전(select_v1.md)\n│   └── schemas/         # 출력 JSON 스키마 — 분류 체계 버전과 짝\n├── store/\n│   ├── schema.sql       # D-20 데이터 설계\n│   └── migrate.py\n├── service/\n│   ├── build_dashboard.py\n│   └── export.py\n└── tests/\n    ├── fixtures/        # 기관별 목록·상세 HTML 스냅샷\n    └── test_adapters.py\n```\n\n## 4. 기관 어댑터 방식\n\n어댑터는 게시판마다 다른 부분만 담고, 요청 간격·재시도·저장은 `core.py`가 공통으로 처리한다.\n\n| 어댑터가 정하는 것 | 내용 |\n|---|---|\n| 기관·게시판 정보 | 기관명, 게시판명, 목록 URL, 수집 방식(정적·Ajax·브라우저) |\n| 목록 파싱 | 게시물 ID, 목록 번호, 제목, 게시일, 마지막 페이지 판정 |\n| 상세 파싱 | 사업구분, 신청기간, 작성일, 조회수, 본문, 첨부 목록 |\n| 기관별 예외 | 날짜 형식, 상시모집 표기, 공지 고정글 처리 |\n\n> [!tip] NIPA 수집기에서 얻은 교훈\n> 마지막 묶음 페이지(31~36쪽)에서는 '마지막 페이지' 링크가 사라져 첫 전체 수집이 31쪽에서 끝났다. 페이지 링크 번호의 최댓값으로 판정하도록 고친 뒤 353건을 모두 받았다. 기관마다 이런 예외가 있으므로 어댑터별로 HTML 스냅샷 테스트를 둔다(§7).\n\n## 5. AI 호출 방식\n\n> [!note] 공급자\n> AX계획은 \"내부 PoC 및 검증을 통해 외부LLM(OpenAI, 법제처 등) API 연동\"으로 되어 있다. 이 설계는 이미 환경이 갖춰진 Claude API로 PoC를 진행하되, 호출부를 `ai/client.py` 하나로 모아 공급자를 바꿀 수 있게 한다(P7). 최종 공급자와 비용 승인은 I-08.\n\n| 항목 | 방식 | 이유 |\n|---|---|---|\n| 모델 | `claude-sonnet-5-5`(Claude Sonnet 5.5), effort `medium` | '26.10.6 사용자 결정(ADR-009). `.env`의 `AI_MODEL`·`AI_EFFORT`로 바꿀 수 있음. 거절 대비 서버측 fallback(`fallbacks=\"default\"`) 사용 |\n| 출력 형식 | 구조화 출력(JSON 스키마 강제) | 분류값이 정해진 목록 밖으로 나가지 않게 하고, 파싱 실패를 없앰 |\n| 프롬프트 구성 | 고정부(역할·분류 기준·내역사업 목록) + 가변부(공고 1건) | 고정부를 앞에 두어 프롬프트 캐시를 적용 |\n| 대량 처리 | 메시지 배치(Message Batches) | 최초 일괄 분류·재분류처럼 급하지 않은 작업은 배치로 보내 비용 절반 |\n| 일상 처리 | 신규 공고만 건별 호출 | 하루 신규 공고가 적어(NIPA 2026년 월평균 약 13건) 건별 호출로 충분 |\n| 안전장치 | 응답 거절(refusal) 확인 후 결과 저장, 실패 건은 '검토 필요'로 | 판정이 비어 있는 채로 노출되지 않게 |\n| 기록 | 모델명·프롬프트 버전·분류 체계 버전·입출력 토큰 수 저장 | 재현성(P2)과 비용 추적 |\n\n**비용 추정**(PoC 121건, [추정] — PoC에서 실측해 갱신. 단가가 옛 값이라 배포용 추정은 §8을 본다)\n\n| 항목 | 가정 | 추정 |\n|---|---|---|\n| 건당 가변 입력 | 공고 메타 + 본문(2026년 평균 717자) ≈ 1천 토큰 | 121건 × 1천 = 약 12만 토큰 |\n| 고정부(캐시 읽기) | 분류 기준 + 내역사업 목록 ≈ 4천 토큰 | 121건 × 4천 = 약 48만 토큰 |\n| 출력(사고 과정 포함) | 건당 약 1.5천 토큰 | 약 18만 토큰 |\n| 합계 | 입력 $4/백만, 캐시 읽기 $0.20/백만, 출력 $20/백만 토큰 | 약 4~5달러(배치 시 절반) |\n\n## 6. 개발 절차\n\n| 순서 | 작업 | 산출물 |\n|---|---|---|\n| 1 | 내역사업 목록 확보(I-01), 분류 체계 확정(I-02) | 기준표, 분류 체계 v1 |\n| 2 | 검증 데이터 구축: 2026년 121건에 AI가 먼저 판정하고 담당자가 정답 표시 | 검증 데이터 v1(D-30) |\n| 3 | 선별·분류 프롬프트 v1 작성, 검증 데이터로 정확도 측정 | 실험 기록(D-30 §4) |\n| 4 | 오분류 사례를 보고 규칙·프롬프트 보완, 재측정 | 프롬프트 v2 이후 |\n| 5 | 공통 스키마 이관, 1단계 기관 어댑터 추가 | 기관별 어댑터·테스트 |\n| 6 | 검수 화면·PIMS 연계 방식 확정 | FS-SVC 개정 |\n\n## 7. 테스트·형상 관리·운영\n\n| 구 분 | 방식 |\n|---|---|\n| 어댑터 테스트 | 기관별 목록·상세 HTML을 `tests/fixtures`에 저장하고, 파싱 결과(건수·필수 항목)를 비교. 사이트가 개편되면 실패해 바로 드러남 |\n| AI 회귀 확인 | 프롬프트·모델을 바꿀 때마다 검증 데이터로 재측정하고, 정확도가 떨어지면 반영하지 않음 |\n| 형상 관리 | 작업 폴더가 아직 git 저장소가 아님. 코드·프롬프트·설계 문서를 git으로 관리하도록 전환 권장(I-07) |\n| 운영 감시 | 실행 기록(runs)에 처리·신규·오류 건수 기록, 필수 항목 결측률이 급증하면 구조 변경 경고(F-CRW-07) |\n| 비밀정보 | API 키는 환경변수로만 다루고 코드·문서에 적지 않음 |\n\n## 8. 배포 시 정기 실행 구조와 비용 추정 (2026-10-19, ADR-038)\n\n### 8.1 정기 실행 구조\n\n```\n[예약] 관리자 화면에서 정한 요일·시각\n   │  (서버 안 예약 실행기 15초마다 점검 / 별도 데몬 / cron·작업 스케줄러 → automation-run)\n   ▼\n[잠금] DB 잠금 획득 — 이미 실행 중이면 건너뜀\n   ▼\n① 수집 ──▶ ② 제목 규칙 선별 ──▶ ③ AI 판별 ──▶ ④ 노출 재계산\n (무료)       (무료)             (Claude API,     (무료)\n 게시판별      선정결과·설명회     1회·월 상한)      마감일·상시모집·컨설팅뿐\n 증분 수집     등은 AI 없이 제외                    규칙 + 수동 변경 우선\n   ▼\n[기록] 실행 기록(상태·단계별 건수·상세) → 관리자 화면에서 확인\n```\n\n| 배치 방식 | 설명 | 적합한 경우 |\n|---|---|---|\n| ① 서버 안 예약 실행기(기본) | 웹 서버 프로세스가 예약을 함께 처리. 별도 구성 없음 | 서버 한 대, 상시 켜 둠 |\n| ② 웹과 데몬 분리 | 웹은 `AUTOMATION_SCHEDULER=0`, 별도 서비스로 `automation-daemon` | 웹을 여러 개 띄우거나 웹 재시작과 분리하고 싶을 때 |\n| ③ 작업 스케줄러 | cron·Windows 작업 스케줄러가 `automation-run`을 호출 | 서버리스·관리형 환경, 기관 표준 스케줄러 사용 |\n\n- 권장 시작 일정: 평일 하루 1~2회(예: 06:00, 14:00). 게시판 요청 간격(`CRAWL_DELAY`)과 robots.txt 준수는 그대로.\n- 안전장치: 기본값 꺼짐, AI 1회·월 건수 상한, 키 없음·연속 실패 시 AI 단계만 중단, 판별 대상 게시일 기준.\n- API 키는 서버 환경변수(`ANTHROPIC_API_KEY`)로만 두고 코드·저장소·화면에 쓰지 않는다.\n- 서버리스(예: Vercel) 환경은 오래 걸리는 수집·판별과 상시 실행기가 맞지 않으므로 ③ 방식 또는 상시 서버를 쓴다(I-06 DB 이관과 함께 결정).\n\n### 8.2 AI 비용 추정 [추정 — 운영하며 실측해 갱신]\n\n| 항목 | 값 | 근거 |\n|---|---|---|\n| 단가(Sonnet 5.5) | 입력 $2 · 캐시 읽기 $0.10 · 출력 $10 / 백만 토큰, 배치는 절반 | 공식 가격표(platform.claude.com, 2026-10-19 확인) |\n| 고정 입력(분류 기준 프롬프트) | 약 3.3천 토큰, 캐시 읽기 | API 실측 호출 4건 |\n| 가변 입력 | ≈ 440 + 0.78 × 본문 글자 수 토큰(본문 상한 12,000자) | 실측 4건의 회귀 — 표본이 작아 오차가 큼 |\n| 출력 | 건당 약 480 토큰 | 실측 평균 484 |\n| 건당 비용 | NIPA·RAPA형(평균 본문 551자) 약 $0.0069, NIA형(평균 5,289자) 약 $0.0143 | 위 값으로 계산 |\n| 월 신규 공고 | NIA 약 70건(대부분 입찰), NIPA 약 8건, RAPA 약 11건 | 2026-03~09 평균 |\n\n| 시나리오 | 월 AI 대상 | 월 비용(USD) | 원화(1,400원 가정) |\n|---|---|---|---|\n| A. 지금 구조 그대로(NIA 입찰도 AI 판별) | 약 90건 | 약 $1.1 | 약 1,600원 |\n| B. NIA 입찰 게시판은 규칙으로 제외(AI는 [공모]만) | 약 25건 | 약 $0.2 | 약 300원 |\n| C. 기관 10곳으로 확대(A 기준, 기관당 NIPA형 20건/월 추가) | 약 230건 | 약 $2.1 | 약 3,000원 |\n| D. 과거 공고 1,000건 일괄 판별(1회성, 배치 시 절반) | 1,000건 | 약 $9(배치 $4.5) | 약 12,600원 |\n\n- 토큰 추정이 3배 틀려도 시나리오 A는 월 $4 안팎. 월 상한(기본 300건)을 두면 최악도 약 $4.3.\n- 모델을 Haiku 5.5($0.10/$0.50)로 바꾸면 약 1/20이지만 정확도는 검증 전(E-001 재실험 필요).\n- 제외 항목: 서버·도메인·인증서·DB 호스팅 비용, 인건비.\n- 반영됨(ADR-039): NIA 입찰 게시판은 제목 말머리 규칙으로 AI 호출 전에 처리하므로 현재 구조는 시나리오 B(월 약 $0.2)에 해당한다. 규칙은 운영 화면 '선별 규칙'에서 관리한다.\n\n## 9. 배포 파이프라인 (2026-11-24, ADR-045~052)\n\n> 구현은 저장소의 `plan/00_구현핸드오프.md` 한 문서로 맡긴다(결정·계약·단계·관문·명세). 배경과 검증 결과는 `plan/01_핸드오프_배포파이프라인.md`, kordoc 판단은 `plan/03_kordoc_도입검토.md`에 있다. 아래는 결정 사항 요약이며 아직 구현하지 않았다.\n\n### 9.1 구성\n\n```\n 워커 프로세스 (automation-daemon, 예약 실행)\n   ├─ ① 수집        crawler.crawl() — 기존 그대로\n   ├─ ② 첨부 글자    zip 풀기 → kordoc CLI(hwp·hwpx 우선) → 실패 시 extract.py   (ADR-050)\n   ├─ ③ 분류        Claude API · classify_v2 · 구조화 출력                     (ADR-045·048)\n   ├─ ④ 표준 필드    규칙 → 못 찾은 칸만 Claude API · extract_v1               (ADR-045)\n   └─ 기록          automation_runs + llm_calls(토큰·비용·요청 ID·대체 여부)\n 웹 프로세스 (gunicorn, AUTOMATION_SCHEDULER=0)\n   └─ 수요자 화면: 유형 필터, 기본 공모지원사업                                (ADR-047)\n 배포: 컨테이너(Python 3.12 + Node 20) + 영구 볼륨(SQLite·첨부)               (ADR-046)\n```\n\n### 9.2 정한 값\n\n| 항목 | 값 | 근거 |\n|---|---|---|\n| 모델 | `claude-sonnet-5-5` (입력 $2 · 캐시 읽기 $0.10 · 출력 $10 / 백만 토큰) | ADR-045 |\n| 출력 | `output_config.format` JSON 스키마(구조화 출력), 앱에서 한 번 더 검사(누락·하위 유형 소속) | 검증 2회 × 1,010건 형식 오류 0 |\n| effort · thinking | low · 생략(적응형 기본) | 분류 작업, `temperature`·prefill은 이 모델에서 400 |\n| 묶음 · 캐시 | 50건 · 시스템 프롬프트 `cache_control` | 호출당 11~18초 |\n| 거절 대비 | 동기 호출 `fallbacks: \"default\"`, 일괄 처리는 '분류 보류' | ADR-049 |\n| 대량 처리 | Message Batches API(50% 할인) | 재분류·백필 |\n| 보내는 값 | 제목·말머리·상태·기간·게시일·본문(연락처 가림)·첨부 이름·첨부 글자. 작성자 제외 | 개인정보 최소화 |\n| 사람 수정값 | API가 덮어쓰지 않음 | 원칙 P3 |\n| 첨부 읽기 | kordoc CLI, 버전 고정, OCR 끔, 실패 시 extract.py | ADR-050 |\n| 표준 필드 | 원문 발췌, 규칙은 모든 유형·API 보완은 공모지원사업만, 상세 화면 표준 5칸 | ADR-051 |\n| 미분류 공고 | 수요자 기본 목록에 포함, '미분류' 배지 | ADR-052 |\n| 예산 상한 | 실측 전까지 상한 없이 기록만(`llm_calls`, 운영 화면 월 합계) | I-11 |\n\n### 9.3 검증 현황\n\n| 대상 | 상태 | 결과 |\n|---|---|---|\n| 분류 프롬프트 v1 | CLI 검증 완료(2026-11-24) | 1,010건, 형식 오류·누락 0, 앞선 분류와 일치 98.9%, 재실행 일치 99.8%, 비용 $0.74~2.39 |\n| 분류 프롬프트 v2(ADR-048) | CLI 검증 완료(2026-11-25, 관문 1 통과) | 다시 수집한 1,090건, 형식 오류·누락 0, 경계 규칙 준수 98.3~98.6%, 경계 밖 기준 일치 99.7%, 재실행 class 일치 99.9%, 비용 $2.62(첫 실행)·$0.84(캐시). `plan/01` 5.1 |\n| 표준 필드 추출 extract_v1 | CLI 검증(2026-11-25, 정답표 검수 전 잠정) | 표본 45건: '확인' 칸 정답률 92.6%, 공모지원사업 채움 period·content·qualify 94.4%, 인용 불일치 0. KCA period 5/10으로 관문 기준 미달(사전규격 공개 글은 원문에 기간 없음, 기준 결정 필요). 추출 비용 건당 평균 $0.042. `plan/validation/gold/report-20261125.md` |\n\n### 9.4 남은 일\n\n`plan/00_구현핸드오프.md`의 0~7단계로 진행한다. 구현 중에는 실제 API를 부르지 않고 Claude Code CLI로 검증하며, 작업 브랜치에 단계별로 커밋한다(2026-11-24 2차 Q&A).\n\n1. 0단계: `classify_v2` 작성·재검증(ADR-048), 정답표 초안\n2. 1~4단계: 배포 전 버그 5건(`plan/01` 2.3), 스키마, kordoc·규칙 추출·API 클라이언트·화면(Orca 분할), 자동화 연결\n3. 5단계: `extract_v1` 작성·검증, 비용 실측\n4. 6~7단계: 컨테이너 배포 묶음, 전체 확인, 설계 문서 상태 갱신\n5. 사용자 몫: 정답표 검수, 배포 뒤 실호출 확인·백필, 예산 상한(I-11), 호스팅 위치(I-07)\n6. 분류·추출 기능정의서는 구현 뒤 작성한다. 삭제된 F-CLS·F-SEL 번호는 다시 쓰지 않는다\n"}, {"file": "03_개발절차.md", "meta": {"doc_id": "D-03", "title": "개발 절차", "group": "설계", "version": "0.2", "status": "초안", "updated": "2026-10-14"}, "body": "\n> [!warning] 2026-11-20 판별 기능 삭제(ADR-044)\n> 공고 AI 판별·분류 체계·선별 규칙·노출 규칙·AI 호출 비용 관련 기능은 모두 삭제했다. 이 문서의 해당 내용은 **당시 설계의 이력**으로만 남기며 현재 구현과 다르다. 삭제 전 코드·DB·문서는 `data/bak_remove_cls_1120/`에 있다.\n\n# 개발 절차\n\n공모사업 웹크롤링(가칭 「공모사업 AI RADAR」)을 개발하는 데 필요한 절차와 현재까지의 진행 내용이다. 진행 내용은 대화·설계(안)·코드를 바탕으로 정리한 초안이며, 담당자가 검토해 고친다. 담당·일정 칸은 비워 둔다.\n\n> [!note] 상태 표기\n> 완료 / 진행 / 보류 / 미착수. 보류는 사용자가 구현을 미루기로 한 사항이다.\n\n## 1. 절차 개요\n\n| 단계 | 구분 | 주요 활동 | 산출물 | 담당 | 일정 | 상태 |\n|---|---|---|---|---|---|---|\n| 1 | 기획·요구 정의 | 추진 목적, 수집 대상 기관, 노출 기준 정의 | 추진계획(안), 요구사항 | | | 진행 |\n| 2 | 설계 | 시스템 구성, 데이터(DB) 설계, 분류 체계, AI 판별 기준 | 기능설계(안) 13개 문서, 시스템 구성도(안) | | | 진행 |\n| 3 | 수집기 개발 | 기관별 수집기, 증분 수집, 오류 처리 | NIPA 수집기, 첨부 저장 | | | 진행(NIPA만) |\n| 4 | AI 판별 개발 | 사전 규칙, 본문 판별, 첨부 판독, 노출 결정 | 규칙·판별 모듈, 분류 체계 v1.2 | | | 진행(첨부 판독 보류) |\n| 5 | 서비스 화면 개발 | 사용자 페이지, 관리자 페이지 | 수요자 화면, 운영 화면 | | | 진행 |\n| 6 | 시험·검증 | 수집 건수 대조, 판별 결과 검수, 화면 점검 | 시험 코드, 판별 결과 확인 | | | 일부 진행 |\n| 7 | 배포·보안 | 호스팅·DB 구성, 키 관리, 접근 통제 | | | | 미착수 |\n| 8 | 운영·개선 | 자동 실행, 모니터링, 기관 확대, 분류 보완 | | | | 보류 |\n\n## 2. 단계별 상세\n\n### 2.1 기획·요구 정의\n\n| 항목 | 내용 |\n|---|---|\n| 목적 | 전담기관·유관기관에 흩어진 공모 공고를 모아 ICT기금사업 정보 파편화를 해소하고, 기금사업정보관리시스템의 활용성을 높인다 |\n| 입력 | 「ICT기금 사용자 중심 AX서비스 구축 계획」('26.6월)의 공모사업 파이프라인, 전담기관 크롤링 타겟 점검 결과(엑셀) |\n| 작업 | ① 추진계획(안) 작성(추진목적·방향·일정·내용·향후계획) ② 요구사항 정리(아래 표) ③ 시스템 명칭 가칭 「공모사업 AI RADAR」 지정 |\n| 산출물 | `ICT기금 공모사업 웹크롤링 추진계획(안).hwpx`, 신규 초안·작성본 문서 |\n| 완료 기준 | |\n| 관련 문서 | D-00 개요, D-01 설계방향, D-41 미결사항 |\n\n사용자 요구사항(대화에서 확인된 것)\n\n| 구분 | 요구 | 반영 상태 |\n|---|---|---|\n| 수집 | NIPA 사업공고 전체 수집 후 새 글만 증분 수집 | 구현 |\n| 수집 | 유관기관(16개 제외)으로 대상을 단계적으로 확대. 구성도에 \"+\"로 확대 표현 | 설계(안) |\n| 수집 | 관리자 화면에서 수동 수집 실행, 게시기간 지정 수집 | 보류(F-CRW-14·15) |\n| 수집 | 자동 실행(작업 스케줄러), 첨부 일괄 저장 | 보류(ADR-005·010) |\n| 선별 | 기금사업 관련성 검토, 사업 모집만 노출. 입찰·입주·행사·대회·공모전·결과 발표·설명회는 제외 | 구현(ADR-015·018·019) |\n| 선별 | R&D 사업은 제외하고 비R&D 사업만 노출 | 구현(R&D 여부는 AI 추정) |\n| 선별 | 본문 정보가 부족한 건은 첨부 공고문을 읽어 판독 | 시범 5건, 선별 단계 통합은 보류 |\n| 분류 | 지원 대상·지원 방식·사업 분야·공고 구분을 AI가 분류 | 구현(체계 v1.2) |\n| 분류 | AI 호출 비용 없이 Claude Code가 판별한 결과를 가져오기 | 구현(F-CLS-10) |\n| 화면 | 수요자 화면: 분야·대상·상태로 조회, 마감 공고 포함 | 구현(F-SVC-05) |\n| 화면 | 분류별 워드 클라우드, 조회수·검색 키워드 통계 | 워드 클라우드 시안, 통계는 보류 |\n| 운영 | 비용·요금은 나중에 책정 | 보류 |\n| 보고 | 시스템 구성도(안), 개발 진행절차 정리 | 구성도 완료, 본 문서 작성 중 |\n\n### 2.2 설계\n\n| 항목 | 내용 |\n|---|---|\n| 목적 | 수집·선별·분류를 단계별로 나누고 기관이 늘어도 같은 구조로 확장하는 설계를 갖춘다 |\n| 입력 | 기존 NIPA 수집기, 추진계획(안), 요구사항 |\n| 작업 | ① 기능설계(안) 작성(개요·설계방향·개발방식·수집·선별·분류·서비스·데이터·검증·결정기록·미결사항·개정이력) ② Flask 웹앱 구조 전환(ADR-008) ③ DB 설계(공고·첨부·판별 기록·실행 기록) ④ 분류 체계 v1.2 확정 ⑤ 시스템 구성도(안) 작성(수집·저장·AI 활용·서비스 화면 4영역) |\n| 산출물 | `docs/설계(안)` 문서 및 `index.html`, `app/schema.sql`, 시스템 구성도 HTML·PNG 2종 |\n| 완료 기준 | |\n| 관련 문서 | D-01, D-02, D-20, FS-SEL, FS-CLS, D-40 결정기록(ADR-001~021) |\n\n주요 설계 결정\n\n| 결정 | 내용 |\n|---|---|\n| 선별 방식 | 제목 규칙으로 명확한 건만 먼저 거르고 나머지는 AI가 판별(ADR-002·013·016) |\n| 판별 기록 | 판별을 덮어쓰지 않고 쌓아 두고 최신 값을 조회(재현성) |\n| AI 호출 | 호출부를 한 모듈(`app/ai/client.py`)로 모아 공급자 교체 가능(ADR-004) |\n| 모델 | Claude Sonnet 5.5, effort medium(ADR-009) |\n| 저장소 | 현재 SQLite. 배포 시 외부 DB 이관 검토(ADR-001·011) |\n| 첨부 판독 | 정보 부족 건만 수집 직후 공고문을 읽는 방향 합의, 구현 보류 |\n\n### 2.3 수집기 개발\n\n| 항목 | 내용 |\n|---|---|\n| 목적 | 기관 게시판의 공고와 첨부 목록을 빠짐없이 수집하고, 새 글만 이어서 받는다 |\n| 입력 | NIPA 사업공고 게시판 |\n| 작업 | ① NIPA 목록·상세 수집 ② 증분 수집 ③ 정규화(신청기간 분리, 첨부 크기 환산) ④ 변경 반영 ⑤ 실행 기록(`runs`) ⑥ 첨부파일 저장 ⑦ 기존 NIPA DB 이관 |\n| 산출물 | `app/crawler/`(어댑터, 실행기, 첨부 처리), `data/gongmo.db` |\n| 완료 기준 | |\n| 관련 문서 | FS-CRW(F-CRW-01~15) |\n\n현재 수집 결과\n\n| 항목 | 값 |\n|---|---|\n| 기관 | NIPA 1곳 |\n| 공고 | 353건 |\n| 첨부 목록 | 1,338건 |\n| 미구현 | 타 기관 수집기, 동적 페이지(F-CRW-09), robots.txt 자동 확인 |\n| 보류 | 자동 실행, 수동 수집 버튼, 게시기간 지정 수집, 첨부 일괄 저장 |\n\n### 2.4 AI 판별 개발\n\n| 항목 | 내용 |\n|---|---|\n| 목적 | 기금사업과 관련된 공모만 골라 노출하고, 지원 대상·방식·분야를 구조화한다 |\n| 입력 | 공고 제목·본문, (정보 부족 건) 첨부 공고문 |\n| 작업 | ① 제목 규칙 선별(결과 발표·설명회 등) ② AI 본문 판별(유형, 지원 대상·방식·분야, R&D 여부 등) ③ 노출 결정(`decide_exposure`) ④ 분류 체계 v1 → v1.2 개정, 프롬프트 `classify_v4` ⑤ Claude Code 판별 결과 가져오기 ⑥ 첨부 판독 시범 5건 |\n| 산출물 | `app/ai/`(분류기, 스키마, 프롬프트), `app/services/rules.py`, 판별 기록 |\n| 완료 기준 | |\n| 관련 문서 | FS-SEL, FS-CLS, D-30 |\n\n현재 판별 결과(첨부 시범 5건 반영 후)\n\n| 구분 | 건수 |\n|---|---|\n| 노출 | 200 |\n| 검토 | 38 |\n| 제외 | 115 |\n| 합계 | 353 |\n\n- 노출 결정: 공고 유형이 '사업 모집'이면 노출, 사업 모집이 아니거나 R&D 사업이면 제외, R&D 미확인·확신 낮음·기타는 검토.\n- 정확도(정답 표본 대비)는 측정하지 않는다. 점진 개정 방식으로 결과를 보고 하나씩 고친다(ADR-015).\n- 보류: 첨부 판독의 선별 단계 통합(대상 148건, 그중 공고문류 139건). 내역사업 대조(F-SEL-03·04)는 목록 확보 전이라 미착수.\n\n### 2.5 서비스 화면 개발\n\n| 항목 | 내용 |\n|---|---|\n| 목적 | 수요자가 공모사업을 쉽게 찾고, 담당자가 수집·판별 현황을 확인하게 한다 |\n| 입력 | 판별이 끝난 공고, UI 디자인 시안 4종 |\n| 작업 | ① 수요자 화면(`/`, 공고 상세) ② 운영 화면(`/admin`) ③ 분류별 워드 클라우드 화면(`/admin/workspaces`, 2026-11-20 삭제) ④ 엑셀·CSV 내보내기 ⑤ 공고 구분·차수 배지 |\n| 산출물 | `app/web/`, `app/templates/`, `app/static/` |\n| 완료 기준 | |\n| 관련 문서 | FS-SVC(F-SVC-01~11), ADR-012·017·020·021 |\n\n| 구분 | 상태 |\n|---|---|\n| 수요자 화면(사용자 페이지) | 구현. 노출 공고만 표시, 마감 공고 기본 포함 |\n| 운영 화면(관리자 페이지) | 구현. 현황·전체 공고. 통계(조회수·검색 키워드)와 수동 수집은 보류 |\n| 워드 클라우드 | 구현했다가 2026-11-20 삭제(ADR-043) |\n| 검수 화면(F-SVC-04), PIMS 연계(F-SVC-08) | 미착수 |\n\n### 2.6 시험·검증\n\n| 항목 | 내용 |\n|---|---|\n| 목적 | 수집 누락과 판별 오류를 확인하고 결과의 신뢰도를 확보한다 |\n| 입력 | 수집 데이터, 판별 결과, 게시판 원문 |\n| 작업 | ① 수집 건수 대조(게시판 마지막 페이지 판정 오류를 고쳐 353건 모두 수집) ② 이관 전후 건수 일치 확인(353·1,338·3) ③ 규칙 선별·판별 가져오기 시험 코드(`tests/`) ④ 첨부 판독 5건을 상세 페이지 본문과 대조 ⑤ 판별 결과를 화면에서 보고 담당자가 지적·보완 |\n| 산출물 | `tests/test_rules.py`, `tests/test_import.py`, 개정 이력 |\n| 완료 기준 | |\n| 관련 문서 | D-30 검증 및 품질 |\n\n- 정답 표본 검증과 버전 간 비교는 하지 않기로 했다(점진 개정 방식).\n- 수집기 HTML 스냅샷 시험, 기관별 어댑터 시험은 미착수.\n\n### 2.7 배포·보안\n\n| 항목 | 내용 |\n|---|---|\n| 목적 | 웹앱을 안전하게 배포하고 접근·비밀 값을 관리한다 |\n| 입력 | 웹앱 코드, 운영 환경 요건 |\n| 작업 | ① 호스팅 방식 검토(Vercel) ② DB 이관 방안(서버리스는 로컬 SQLite 파일과 상시 실행을 유지하지 못함) ③ 수집 배치 실행 방식 ④ API 키 등 비밀 값 분리 보관 ⑤ 관리자 화면 접근 통제 ⑥ 수집 운영 원칙(robots.txt 준수, 요청 간격 0.3초 이상) |\n| 산출물 | |\n| 완료 기준 | |\n| 관련 문서 | D-02 §7, I-06 PIMS 연계, I-07 형상 관리·운영 환경 |\n\n- 현재: 로컬 PC에서 Flask로 실행. 작업 폴더는 git 저장소가 아님.\n- 검토 중: 외부 크롤링 서비스(Firecrawl 등) 활용은 시험 후 결정.\n\n### 2.8 운영·개선\n\n| 항목 | 내용 |\n|---|---|\n| 목적 | 수집을 안정적으로 이어 가고 대상 기관과 분류를 단계적으로 넓힌다 |\n| 입력 | 운영 기록, 담당자 의견 |\n| 작업 | ① 자동 실행 ② 구조 변경 감지·알림 ③ 유관기관 확대(수집 난이도별 단계) ④ 분류 체계 보완(대·중·소 계층 검토) ⑤ 조회수·검색 키워드 통계 ⑥ 요약 기능 검토 |\n| 산출물 | |\n| 완료 기준 | |\n| 관련 문서 | FS-CRW, D-41 미결사항 |\n\n- 모두 보류 또는 검토 단계이다. 분류 계층(대·중·소)은 방향만 논의하고 보류했다.\n\n## 3. 일정\n\n| 단계 | 시작 | 종료 | 상태 | 비고 |\n|---|---|---|---|---|\n| 1. 기획·요구 정의 | | | 진행 | |\n| 2. 설계 | | | 진행 | |\n| 3. 수집기 개발 | | | 진행 | NIPA 완료 |\n| 4. AI 판별 개발 | | | 진행 | 첨부 판독 보류 |\n| 5. 서비스 화면 개발 | | | 진행 | |\n| 6. 시험·검증 | | | 일부 진행 | |\n| 7. 배포·보안 | | | 미착수 | |\n| 8. 운영·개선 | | | 보류 | |\n\n## 4. 참고\n\n- 개발 방식과 기술 스택은 D-02 `02_개발방식.md`를 따른다.\n- 이 문서에 적는 내용이 설계(안)의 다른 문서와 다르면, 해당 문서를 함께 고치고 D-90에 이력을 남긴다.\n"}, {"file": "10_기능정의서_수집.md", "meta": {"doc_id": "FS-CRW", "title": "기능정의서 — 수집", "group": "기능정의서", "version": "0.7", "status": "초안", "updated": "2026-11-25"}, "body": "\n> [!warning] 2026-11-20 판별 기능 삭제(ADR-044)\n> 공고 AI 판별·분류 체계·선별 규칙·노출 규칙·AI 호출 비용 관련 기능은 모두 삭제했다. 이 문서의 해당 내용은 **당시 설계의 이력**으로만 남기며 현재 구현과 다르다. 삭제 전 코드·DB·문서는 `data/bak_remove_cls_1120/`에 있다.\n\n# 기능정의서 — 수집\n\n## 1. 기능 목록\n\n| ID | 기능명 | 설명 | 우선순위 | 상태 | 비고 |\n|---|---|---|---|---|---|\n| F-CRW-01 | 기관 어댑터 등록 | 기관·게시판·목록 URL·수집 방식을 등록하고 어댑터와 연결 | 상 | 구현 | `app/crawler/adapters/` 등록부, 실행 시 orgs·boards 자동 등록 |\n| F-CRW-02 | 목록 수집 | 게시판 목록을 쪽 단위로 읽어 게시물 ID·제목·게시일 확보 | 상 | 구현 | NIPA |\n| F-CRW-03 | 상세 수집 | 상세 페이지에서 사업구분·신청기간·작성일·조회수·본문·첨부 목록 확보 | 상 | 구현 | NIPA |\n| F-CRW-04 | 증분 수집 | 새 글이 없는 쪽을 만나면 중단해 신규 공고만 수집 | 상 | 구현 | NIPA |\n| F-CRW-05 | 정규화 | 신청기간을 시작·마감 일시로 나누고 첨부 크기를 바이트로 환산 | 상 | 구현 | |\n| F-CRW-06 | 변경 반영 | 다시 읽은 공고의 제목·기간·본문 변경을 갱신하고 최종 확인 시각 기록 | 중 | 구현 | 변경 이력은 미보관 |\n| F-CRW-07 | 구조 변경 감지 | 목록 0건, 필수 항목 결측률 급증 시 실행을 '주의'로 기록하고 알림 | 상 | 부분 | 1쪽 0건 오류·실행 상태(정상/주의/오류)만 구현 |\n| F-CRW-08 | 접근 정책 준수 | robots.txt 확인, 요청 간격, 브라우저 UA, 재시도 | 상 | 구현 | 수집·첨부 시작 전 robots.txt 자동 확인(`ROBOTS_CHECK`), 막히거나 확인 불가면 그 실행은 수집하지 않고 기록 |\n| F-CRW-09 | 동적 페이지 수집 | Ajax 응답 직접 호출, 불가하면 헤드리스 브라우저 | 중 | 신규 | KOTRA 등 |\n| F-CRW-10 | 실행 기록 | 실행 번호·방식·처리·신규·갱신·오류 건수와 로그 저장 | 상 | 구현 | runs 테이블 |\n| F-CRW-11 | 첨부 텍스트 추출 | hwp·hwpx·pdf 첨부에서 텍스트만 뽑아 분류에 활용(파일 미저장) | 중 | 구현 | 보류 기능과 경계, I-04. 2026-11-24 ADR-050: kordoc CLI로 읽고(OCR 끔, zip은 먼저 풀기, hwp/hwpx를 pdf보다 먼저) 실패하면 `extract.py`로 넘어가도록 바꿨다(2026-11-25 구현, `app/services/kordoc.py`·`attach_text.py`). 추출 글자는 표준 필드 추출(ADR-045)의 근거로도 쓴다 |\n| F-CRW-12 | 첨부파일 저장 | 신규 공고의 첨부를 수집 시점에 즉시 내려받아 보관(기존 공고는 `fetch-attachments`) | 상 | 구현 | ADR-010 |\n| F-CRW-13 | 자동 실행 | 관리자 화면에서 정한 요일·시각에 수집→규칙 선별→AI 판별→노출 재계산을 자동 실행 | 중 | 구현 | ADR-038. 서버 내 예약 실행기, 별도 데몬(`automation-daemon`), 작업 스케줄러용 단발 실행(`automation-run`) |\n| F-CRW-14 | 관리자 화면 수동 수집 | `/admin/automation`의 '지금 실행' 버튼으로 저장된 설정의 단계를 한 번 실행 | 중 | 구현 | ADR-038. 기간을 지정한 수집(F-CRW-15)은 아직 보류 |\n| F-CRW-15 | 게시기간 지정 수집 | 시작일·종료일을 지정해 그 기간에 게시된 공고만 수집 | 중 | 보류(요구 기록) | 사용자 의견('26.10.7). 현재 `crawl`은 `--full`·`--pages`만 있고 기간 지정 없음 |\n\n## 2. 기능 상세\n\n### F-CRW-02 목록 수집\n\n| 항목 | 내용 |\n|---|---|\n| 입력 | 게시판 목록 URL, 쪽 번호 |\n| 처리 | 목록 표의 행마다 게시물 ID(상세 링크 끝 번호), 목록 번호, 사이트 상태, 제목, 사업구분, 신청기간 원문, 작성자, 게시일을 읽음 |\n| 마지막 쪽 판정 | 쪽 링크 번호의 최댓값. '마지막 페이지' 링크는 마지막 묶음에서 사라지므로 쓰지 않음 |\n| 출력 | 목록 행 배열, 마지막 쪽 번호 |\n| 예외 | 요청 실패는 3회 재시도(2·4·6초 대기) 후 실행 오류로 기록하고 중단 |\n\n### F-CRW-03 상세 수집\n\n| 항목 | NIPA 추출 위치 | 비고 |\n|---|---|---|\n| 사업구분 | `.gdi1 .bluebox` | 추출률 99.2%(350/353) |\n| 신청기간 | `.gdi2` | 추출률 97.7%(345/353), 나머지 8건은 사이트에 '상시모집' 표기 |\n| 작성일 | `.infoDt` | 추출률 100% |\n| 조회수 | `.infoVw` | |\n| 본문 | '내용' 칸 텍스트 | 50자 미만 97건(27.5%) |\n| 첨부 목록 | '첨부파일' 칸의 다운로드 링크 | 파일명·확장자·크기·URL. URL의 토큰은 접속마다 바뀌어 만료됨 |\n\n한 건의 상세 수집이 실패해도 전체를 멈추지 않고 오류 건수만 올린다.\n\n### F-CRW-04 증분 수집\n\n| 규칙 | 내용 |\n|---|---|\n| 시작 | 1쪽부터 읽음 |\n| 중단 | 이미 수집한 글이 있는 상태에서, 한 쪽에 새 글이 하나도 없으면 그 쪽까지 처리하고 중단 |\n| 갱신 | 읽은 쪽의 기존 글은 상세를 다시 읽어 변경을 반영(F-CRW-06) |\n| 실측 | '26.10.1 증분 실행: 1쪽 10건 확인, 신규 0건, 7초 |\n\n### F-CRW-07 구조 변경 감지\n\n| 감지 조건(안) | 판정 |\n|---|---|\n| 1쪽 목록이 0건 | 오류 — 게시판 URL·구조 변경 의심 |\n| 이번 실행의 사업구분·신청기간·작성일 결측률이 직전 30일 평균보다 20%p 이상 높음 | 주의 |\n| 상세 요청 오류율 10% 이상 | 주의 |\n\n임계값은 1단계 기관 가동 후 실측으로 조정한다.\n\n### F-CRW-08 접근 정책 준수\n\n| 항목 | 현재 | 목표 |\n|---|---|---|\n| 요청 간격 | 0.3초(설정 가능) | 기관별 설정, 최소 0.3초 |\n| UA | Chrome 브라우저 UA 고정 | 동일 |\n| robots.txt | 점검 엑셀로 수동 확인 | 실행 시작 시 자동 확인, 차단 경로면 수집 생략·기록 |\n| 개인정보 | 작성자(담당자 이름) 저장 중 | 수요자 화면에 노출하지 않음, 연락처는 수집하지 않음 |\n\n## 3. 기관별 적용 계획\n\n| 단계 | 기관(게시판) | 수집 방식 | 조치 |\n|---|---|---|---|\n| 0 | NIPA(사업공고) | 정적 | 가동 중 |\n| 1 | NIA, KCA, SPRi, KISA(사업공고), KAIT(입찰·사업), ETRI(입찰) | 정적 | 어댑터 신규 |\n| 2 | KOTRA(입찰·사업) | 동적(Ajax) | F-CRW-09 |\n| 2 | NIPA(입찰), KISDI, KICI, KODIA, RAPA | 정적·확인 필요 | 게시판 URL 재지정·추가 확인 |\n| 3 | IITP, KOFAC, TTA, Kdata, KISA(입찰) | — | 현재 불가(폐기 URL·DNS 실패·개편·403). 기관 협조 요청 또는 대체 경로 |\n| 제외 | ETRI(위탁연구) | — | robots.txt 차단 |\n\n※ 근거: `ICT기금_전담기관_크롤링타겟_점검결과.xlsx`('26.10.1 점검, 16개 기관 24개 URL)\n"}, {"file": "13_기능정의서_서비스.md", "meta": {"doc_id": "FS-SVC", "title": "기능정의서 — 서비스", "group": "기능정의서", "version": "0.23", "status": "초안", "updated": "2026-11-25"}, "body": "\n> [!warning] 2026-11-20 판별 기능 삭제(ADR-044)\n> 공고 AI 판별·분류 체계·선별 규칙·노출 규칙·AI 호출 비용 관련 기능은 모두 삭제했다. 이 문서의 해당 내용은 **당시 설계의 이력**으로만 남기며 현재 구현과 다르다. 삭제 전 코드·DB·문서는 `data/bak_remove_cls_1120/`에 있다.\n\n# 기능정의서 — 서비스\n\n## 1. 기능 목록\n\n| ID | 기능명 | 설명 | 우선순위 | 상태 | 비고 |\n|---|---|---|---|---|---|\n| F-SVC-01 | 수집 운영 현황판 | 수집 상태·마감 임박·전체 공고를 한 화면에 표시 | 상 | 구현 | `nipa_crawler_dashboard_live.html` |\n| F-SVC-02 | 엑셀·CSV 내보내기 | 전체 공고·첨부 목록 엑셀, 필터 적용 CSV | 중 | 구현 | 웹앱: `flask --app run export`(AI 판별 열 포함) |\n| F-SVC-03 | 성과지표 산출 | DB에서 지표 실적을 계산해 정의서 엑셀 생성 | 중 | 구현 | `nipa/build_kpi_sheet.py` |\n| F-SVC-04 | ~~검수 화면~~ | **삭제(2026-11-20, ADR-044)** — 판별·분류·노출 기능과 함께 제거 | - | 삭제 | |\n| F-SVC-05 | 공모사업 조회(수요자) | 수집한 공고 전체를 접수 상태·기관·검색어로 찾는 수요자 화면 | 상 | 구현 | 분야·대상 필터는 ADR-044로 삭제 |\n| F-SVC-06 | 접수·마감 일정 | 달력·간트로 접수 기간 표시 | 하 | 시안 | UI 시안 안3, 적용 보류 |\n| F-SVC-07 | 분석 리포트 | 게시 추이·사업·분야 구성 보고서 | 하 | 시안 | UI 시안 안4, 적용 보류 |\n| F-SVC-08 | ~~PIMS 연계(선별·분류 결과 제공)~~ | **삭제(2026-11-20, ADR-044)** — 판별·분류·노출 기능과 함께 제거 | - | 삭제 | |\n| F-SVC-10 | ~~공고 구분 표시~~ | **삭제(2026-11-20, ADR-044)** — 판별·분류·노출 기능과 함께 제거 | - | 삭제 | |\n| F-SVC-11 | ~~분류별 워드 클라우드(운영)~~ | **삭제(2026-11-20, ADR-043)**. 운영 화면 `/admin/workspaces`·`/admin/workspace`와 관련 코드를 모두 제거함 | - | 삭제 | 필요하면 `data/bak_wordcloud_1120/`의 백업을 참고 |\n| F-SVC-12 | 곧 마감 띠 | 목록 위에 마감이 가까운 접수 중 공고를 가로 칩으로 보여 줌. 칩을 누르면 공고 상세로 이동 | 중 | 구현 | 규칙 §4.1. 설정 `PUBLIC_SOON_DAYS`·`PUBLIC_SOON_MAX` |\n| F-SVC-13 | NEW 배지 | 최근 게시된 공고의 카드에 NEW 표시 | 하 | 구현 | 규칙 §4.2. 설정 `PUBLIC_NEW_DAYS` |\n| F-SVC-14 | ~~분야 분포 막대~~ | **삭제(2026-11-20, ADR-044)** — 판별·분류·노출 기능과 함께 제거 | - | 삭제 | |\n| F-SVC-15 | 관심 공고 저장 | 카드의 ☆로 공고를 저장하고 '관심 공고만 보기'로 모아 봄. 이 브라우저에만 저장 | 중 | 구현 | 규칙 §4.4 |\n| F-SVC-16 | 목록 쪽 번호 이동 | 목록 위·아래에 쪽 번호 막대를 두고 '더 보기'를 대체. 한 쪽 12건 | 중 | 구현 | 규칙 §4.5 |\n| F-SVC-17 | 기관 구분 표시 | 카드·상세에 기관별 색 배지, 왼쪽에 기관 필터(기관이 둘 이상일 때) | 중 | 구현 | 규칙 §4.6. 기관 추가 시 자동 반영 |\n| F-SVC-18 | 많이 찾는 검색어 | 검색창 아래에 이용자가 실제로 많이 검색한 단어를 칩으로 보여 줌. 누르면 그 단어로 검색 | 중 | 구현 | 규칙 §4.7. 설정 `PUBLIC_POPULAR_*`. 기록 테이블 `search_logs` |\n| F-SVC-19 | 금칙어 관리(운영) | 운영 화면에서 금칙어·예외 단어를 보고 추가·삭제하고, 검색어가 걸리는지 점검하며, 최근 검색어에서 바로 금칙어로 추가 | 중 | 구현 | `/admin/banned`. 규칙 §4.8 |\n| F-SVC-20 | 관리자 로그인 | 운영 화면(`/admin`)과 운영용 API를 로그인한 관리자만 쓰게 함. 수요자 화면·공개 API는 그대로 열려 있음 | 상 | 구현 | 규칙 §4.9. `flask --app run set-admin-password` |\n| F-SVC-21 | ~~노출 여부 수동 변경~~ | **삭제(2026-11-20, ADR-044)** — 판별·분류·노출 기능과 함께 제거 | - | 삭제 | |\n| F-SVC-22 | 서비스 로고·안내 문구 | 화면 상단에 'ICT기금 공모사업 AI RADAR' 로고(레이더 아이콘 + Orbitron 워드마크)를 수요자·운영·로그인 화면에 공통 표시. 수요자 목록의 안내 문구는 '공고내용은 해당 기관에서 수정·변경될 수 있으니 원문공고를 꼭 확인하세요.' | 중 | 구현 | ADR-036. 글꼴 라이선스는 `app/static/fonts/LICENSE-Orbitron.txt` |\n| F-SVC-23 | 자동화 설정 화면 | 운영 화면 '자동화'에서 자동 실행 사용 여부·요일·시각(하루 최대 3회)·수집 대상 게시판·실행 단계·AI 판별 상한을 설정하고, 지금 실행·실행 기록·이번 달 AI 사용량(예상 비용)을 본다 | 상 | 구현 | 규칙 §4.11 |\n| F-SVC-24 | ~~선별 규칙 화면~~ | **삭제(2026-11-20, ADR-044)** — 판별·분류·노출 기능과 함께 제거 | - | 삭제 | |\n| F-SVC-25 | ~~주요 일정·지원금 표시~~ | **삭제(2026-11-20, ADR-044)** — 판별·분류·노출 기능과 함께 제거 | - | 삭제 | |\n| F-SVC-26 | 운영 통계 화면 | 운영 화면 '통계'(`/admin/dashboard`)에 방문 수·순방문, 검색 현황, 많이 본 공고, 기관별 수집·판별·노출 현황, 최근 문제 알림을 모아 보여 줌 | 상 | 구현 | ADR-042. 방문은 IP·계정을 저장하지 않고 하루 단위로 센다 |\n| F-SVC-27 | 검색어 통계 | '검색어'(`/admin/searches`)에서 기간별 검색 횟수·결과 없음 비율·검색어 목록, CSV 내려받기 | 중 | 구현 | F-SVC-18 기록 사용 |\n| F-SVC-28 | 로그 관리 | '로그'(`/admin/logs`)에서 수집·자동 실행 기록과 운영 이력(관리자 변경·로그인 시도, 1년 보관)을 본다 | 중 | 구현 | ADR-042 |\n| F-SVC-29 | 공고 유형 필터·배지 | 수요자 목록에 공고 유형(공모지원사업·입찰공고·기타) 필터와 카드 배지를 둔다. 처음에는 공모지원사업만 보인다 | 상 | 구현 | ADR-047·052. 유형 값은 분류 결과(ADR-045·048). 규칙 §4.13 |\n| F-SVC-30 | 상세 표준 5칸 | 공고 상세에 공고명·공고 내용·지원자격·공모 지원분야·공모기간을 늘 같은 순서로 보여 준다. 값은 원문 발췌이고 출처(사이트 칸·본문·첨부 파일명)를 함께 표시한다 | 상 | 구현 | ADR-051. 규칙 §4.14. 기존 '첨부 구조화' 블록을 대체 |\n| F-SVC-09 | 화면 한글화 | 현황판의 영문 문구를 한글로 교체 | 중 | 시안 | UI 시안 안1, 적용 보류 |\n\n## 2. 기능 상세\n\n### F-SVC-04 검수 화면\n\n| 항목 | 내용 |\n|---|---|\n| 대상 | 검토 대기열(F-SEL-06) 공고 |\n| 표시 | 공고 원문 링크, 제목, 사업구분, AI 판정값, 근거 문장, 확신도 |\n| 입력 | 확정 / 수정(값 선택) / 제외, 메모 |\n| 저장 | 담당자 판정 테이블(D-20 `reviews`)에 판정자·일시와 함께 저장 |\n| PoC 대안 | 검토 대상을 엑셀로 내보내고 담당자가 '정답' 열을 채워 다시 읽어 들임 |\n\n### F-SVC-08 PIMS 연계\n\n| 방식(후보) | 장점 | 단점 |\n|---|---|---|\n| 파일 제공(주기적 엑셀·JSON) | 가장 단순, 보안 검토 부담 적음 | 실시간성 낮음 |\n| PIMS가 읽는 조회 API | PIMS 화면에서 바로 최신 데이터 | API 서버 운영 필요 |\n| PIMS DB 직접 적재 | 조회 성능 좋음 | 스키마 결합, 권한 협의 필요 |\n\nAX계획의 \"공모사업은 별도페이지 제작 후 데이터 연계\"에 따라 PIMS 쪽 화면은 별도로 만들고, 이 과제는 데이터 제공 방식까지 정한다.\n\n## 3. 화면 공통 규칙\n\n| 규칙 | 내용 |\n|---|---|\n| 언어 | 화면 문구는 모두 한글 |\n| 접수 상태 | 페이지를 연 시각 기준으로 계산. 제목에 '[접수마감]'이 있으면 기간과 관계없이 마감 |\n| 상시 모집 | 신청기간이 없고 게시 1년 이내면 '상시 모집', 1년이 지나면 '접수 마감' |\n| 개인정보 | 수요자 화면에 작성자(담당자 이름)를 표시하지 않음 |\n| 접수 진행 막대 | 목록 카드에는 신청 기간 글자 아래의 진행 막대를 표시하지 않는다(ADR-030). 신청 기간 문구와 D-day 배지로 충분하다고 판단. 상세 화면의 막대는 그대로 |\n| 사업명 줄 | 카드·상세에 '사업명 · ○○' 줄을 표시하지 않는다(ADR-025). 기관마다 사업구분 칸이 달라 NIA는 제목의 말머리가 들어가 사업명이 아니었다. 값(`biz`)은 저장하고 검색에는 계속 쓴다 |\n| 분류 출처 표시 | 수요자 화면에는 'AI 분류'·'임시 분류' 같은 출처 표시를 하지 않는다(ADR-020). 신청 자격·일정은 원문 확인 안내만 둔다 |\n| 출처 | 모든 공고에 원문 링크 제공 |\n\n※ 위 규칙은 UI 시안 제작 중 정한 것이다('26.10.2). 시안 적용은 보류(ADR-006)지만 규칙은 화면 개발 시 그대로 쓴다.\n\n## 4. 목록 화면 서비스 규칙\n\n수요자 목록 화면(`/`)에 얹은 작은 서비스의 기준이다. 시안은 `docs/UI_디자인(안)/시각화/목록화면_서비스추가.html`이고 구현은 `app/static/public.js`·`app/services/public.py`다. 기준을 바꾸면 이 절과 설정값을 함께 고친다.\n\n### 4.1 곧 마감 띠 (F-SVC-12)\n\n| 항목 | 규칙 |\n|---|---|\n| 대상 | 접수 상태가 '마감 임박' 또는 '접수 중'인 공고. 상시 모집·접수 예정·접수 마감은 제외 |\n| 조건 | 마감까지 남은 일수(오늘 포함, 마감일 당일은 0일)가 `PUBLIC_SOON_DAYS`(기본 30일) 이하 |\n| 정렬·건수 | 남은 일수가 적은 순, 같으면 마감 일시가 빠른 순. 최대 `PUBLIC_SOON_MAX`(기본 10건) |\n| 표시 | D-day, 제목(두 줄까지), 기관, 마감일. 남은 일수 3일 이하는 빨강 강조 |\n| 필터와의 관계 | 아래 목록의 필터·검색과 무관하게 전체 공고에서 뽑는다 |\n| 대상이 없을 때 | 띠를 숨긴다 |\n\n### 4.2 NEW 배지 (F-SVC-13)\n\n| 항목 | 규칙 |\n|---|---|\n| 기준 | 게시일(없으면 목록의 작성일)이 오늘 포함 `PUBLIC_NEW_DAYS`(기본 7일) 이내. 7일 전 날짜는 해당하지 않음 |\n| 제외 | 게시일이 오늘보다 미래이거나 없으면 표시하지 않음 |\n| 접수 상태와 관계 | 상태(마감 등)와 무관하게 게시일만 본다 |\n| 계산 위치 | 서버(`is_new`). 수집일(`first_seen`)이 아니라 게시일을 쓴다 — 한꺼번에 수집한 공고가 모두 NEW가 되는 것을 막기 위함 |\n\n### 4.3 분야 분포 막대 (F-SVC-14)\n\n| 항목 | 규칙 |\n|---|---|\n| 대상 | 왼쪽 필터의 '지원 분야' 묶음만. 다른 묶음에는 붙이지 않음 |\n| 길이 | 현재 필터를 반영한 분야별 건수(항목 옆 숫자와 같은 값)를 그 묶음의 최대 건수 대비 비율로 그린다. 최대값이 표시 폭의 78% |\n| 최소 폭 | 건수가 1건 이상이면 4% 이상, 0건이면 막대를 그리지 않음 |\n| 한 공고가 여러 분야 | 공고가 가진 모든 분야에 각각 센다(합계가 전체 건수보다 클 수 있음) |\n\n### 4.4 관심 공고 저장 (F-SVC-15)\n\n| 항목 | 규칙 |\n|---|---|\n| 저장 위치 | 이용자 브라우저 `localStorage`의 `gongmoFavs`(공고 번호 배열). 서버에는 보내지 않고 계정·개인정보를 쓰지 않음 |\n| 저장소를 쓸 수 없을 때 | 오류 없이 동작하고 이번 방문 동안만 유지 |\n| 건수 | 지금 목록에 있는 공고만 센다. 노출에서 빠진 공고의 번호는 남아 있어도 세지 않음 |\n| 보기 | '관심 공고만 보기'는 다른 필터와 함께 적용(AND). 상단 메뉴에 건수 표시(0건이면 숨김) |\n| 한계 | 다른 브라우저·기기와 공유되지 않고 브라우저 데이터를 지우면 사라진다. 이메일·알림 연계는 하지 않음 |\n\n### 4.5 목록 쪽 번호 이동 (F-SVC-16)\n\n| 항목 | 규칙 |\n|---|---|\n| 쪽 크기 | 12건 |\n| 막대 | 처음·이전·번호·다음·마지막. 번호는 처음, 마지막, 현재 앞뒤 2쪽을 보이고 사이는 '…' |\n| 위치 | 목록 위와 아래 두 곳에 같은 막대 |\n| 초기화 | 필터·검색·정렬·통계 카드·조건 초기화를 바꾸면 1쪽으로 돌아감 |\n| 쪽 이동 | 번호를 누르면 목록 맨 위로 이동. 쪽이 1개뿐이면 막대를 숨김 |\n\n### 4.6 기관 구분 표시 (F-SVC-17)\n\n| 항목 | 규칙 |\n|---|---|\n| 배지 색 | 기관 코드별 고정 번호(NIPA 0, NIA 1). 새 기관은 코드 문자 합으로 2~5번 색을 받음 |\n| 필터 | 노출 공고에 기관이 둘 이상일 때만 '기관' 묶음을 보여 줌. 검색어에도 기관명 포함 |\n| 노출 기준 | 기관과 무관하게 같은 노출 규칙(사업 모집만)을 적용. 입찰·용역은 제외(ADR-023) |\n\n### 4.7 많이 찾는 검색어 (F-SVC-18)\n\n| 항목 | 규칙 |\n|---|---|\n| 기록 시점 | 이용자가 검색창에 입력을 멈추고 1.5초가 지났을 때, 검색 버튼을 눌렀을 때, Enter를 눌렀을 때. 같은 방문(탭)에서 같은 검색어는 한 번만 기록 |\n| 기록하지 않는 것 | '많이 찾는 검색어' 칩을 눌러 한 검색, 2자 미만·30자 초과, 이메일·전화번호·인터넷 주소로 보이는 값, **금칙어가 들어 있는 검색어**(아래) |\n| 저장 항목 | 검색어(공백 정리), 소문자로 맞춘 값, 그때 화면에 나온 결과 건수, 검색 일시(`search_logs`). **검색한 사람은 저장하지 않음**(IP·계정·브라우저 정보 없음) |\n| 보관 기간 | 180일. 새 기록을 쓸 때 오래된 기록을 지움 |\n| 집계 | 최근 `PUBLIC_POPULAR_DAYS`(기본 30일) 동안 **결과가 1건 이상 나온** 검색어를 대소문자 구분 없이 묶어 센다. 표기는 가장 많이 쓰인 것으로 보여 줌 |\n| 표시 조건 | `PUBLIC_POPULAR_MIN`(기본 2회) 이상 검색된 것만, 많은 순으로 최대 `PUBLIC_POPULAR_MAX`(기본 5개). 횟수가 같으면 최근에 검색된 것이 앞섬 |\n| 기록이 없을 때 | 줄 전체를 숨김(고정 검색어를 대신 보여 주지 않음) |\n| 금칙어 | `app/banned_terms.txt`(설정 `BANNED_TERMS_PATH`). 한 줄에 한 단어, `#`은 설명, `!`로 시작하면 예외 단어. 파일을 고치면 서버를 다시 켜지 않아도 바로 적용 |\n| 금칙어 검사 방식 | 검색어와 금칙어 모두 소문자로 바꾸고 한글·영문·숫자·자모만 남겨(공백·기호 제거) 비교한다. 검색어에 금칙어가 **포함**되면 걸림('시 발', '시.발', 'Fuck', 'ㅅㅂ' 모두 해당). 예외 단어는 먼저 빼고 나머지로 검사('시발점'은 통과) |\n| 금칙어 적용 범위 | ① 기록하지 않음 ② 이미 기록된 것도 집계·표시에서 뺌(반복 횟수가 많아도 보이지 않음. 목록을 늘리면 기존 기록에도 바로 적용) ③ **검색 자체는 막지 않음** — 이용자가 입력하면 결과는 그대로 나옴 |\n| 금칙어 목록 구성 | 욕설, 초성·자모 줄임말, 선정적 표현, 비하·혐오 표현. 공백을 없애고 검사하므로 다른 단어의 일부로 우연히 겹치는 짧은 단어는 넣지 않는다(예: '구성기관'의 '성기', '애자일'의 '애자', '한-일 베트남'의 '일베'). 수집한 공고 제목 전체가 걸리지 않는지 시험으로 확인 |\n| 한계 | 한 사람이 여러 방문(탭)에서 같은 단어를 반복하면 횟수가 늘어난다. 기록이 적은 초기에는 비어 있을 수 있다. 목록은 완전하지 않으며(새로운 은어·변형은 담당자가 추가), 글자를 바꿔 쓰거나(예: 'ㅅ1ㅂ') 풀어 쓰는 변형은 걸러지지 않을 수 있다 |\n| 활용 | 같은 기록으로 관리자 화면의 검색 키워드 통계(보류 중)를 만들 수 있다 |\n\n### 4.8 금칙어 관리 화면 (F-SVC-19)\n\n| 항목 | 규칙 |\n|---|---|\n| 위치 | 운영 화면 `/admin/banned`(상단 '금칙어 관리') |\n| 저장 | 별도 테이블이 아니라 금칙어 파일(`app/banned_terms.txt`)을 직접 고친다. 화면에서 추가한 단어는 파일 끝 `관리자 화면에서 추가` 구역에 들어가고, 기존 설명·단어는 그대로 보존. 추가·삭제 때마다 직전 상태를 `.bak`으로 백업. 바뀐 목록은 서버를 다시 켜지 않아도 수요자 화면에 바로 적용 |\n| 금칙어 추가 | 공백·기호를 뺀 글자가 2자 이상 30자 이하. 이미 있는 단어(공백이 달라도 같은 단어)는 거절. **수집한 공고 제목에 그 단어가 들어 있으면 경고하고 저장하지 않는다**(정상 검색어를 가릴 수 있음). '그래도 추가'를 체크해야 저장 |\n| 예외 단어 | 금칙어가 정상 단어의 일부로 걸릴 때 추가한다. 같은 방식으로 추가·삭제 |\n| 삭제 | 단어 옆 ×를 누르고 확인하면 삭제. 기본 단어와 관리자 추가 단어 모두 삭제할 수 있음 |\n| 검색어 점검 | 입력한 검색어가 걸리는지, 어떤 금칙어에 걸렸는지 보여 줌(저장하지 않음) |\n| 최근 검색어 | 최근 `PUBLIC_POPULAR_DAYS`일 검색어를 많은 순으로(최대 50개) 보여 줌. 결과가 0건이었던 검색어와 금칙어도 포함. 상태: **금칙어**(걸림) / **표시 중**(결과 있는 검색이 `PUBLIC_POPULAR_MIN`회 이상) / **대기**. 행마다 '금칙어로 추가' 버튼 |\n| 접근 제어 | 관리자 로그인이 필요하다(F-SVC-20, §4.9). 로그인하지 않은 요청은 추가·삭제도 처리되지 않음 |\n\n### 4.9 관리자 로그인 (F-SVC-20)\n\n| 항목 | 규칙 |\n|---|---|\n| 보호 대상 | `/admin/` 아래 모든 화면·쓰기 요청, 운영용 API(`/api/announcements`, `/api/announcements/<id>`, `/api/stats`). 열려 있는 것: 수요자 화면 `/`, 공고 상세 `/notice/…`, 공개 API `/api/public/announcements`, 검색어 기록 `/search-log` |\n| 계정 | 관리자 1명(아이디 `ADMIN_ID`, 기본 `admin`). 기관 계정(SSO) 연동은 하지 않음 — 필요하면 별도 결정 |\n| 비밀번호 | **해시로만 저장**(`.env`의 `ADMIN_PASSWORD_HASH`). 코드·문서·화면에 평문을 두지 않는다. 설정은 `flask --app run set-admin-password`(10자 이상, 입력은 화면에 보이지 않음). `--generate`는 무작위 비밀번호를 만들어 `data/admin_initial_password.txt`에만 기록하고 화면에 출력하지 않음 — 로그인한 뒤 바꾸고 그 파일을 지운다 |\n| 서명 키 | 세션 쿠키 서명용 `SECRET_KEY`가 기본값이거나 32자 미만이면 설정 명령이 무작위 값으로 바꿈 |\n| 세션 | 서명된 세션 쿠키(HttpOnly, SameSite=Lax). `ADMIN_SESSION_HOURS`(기본 8시간) 뒤 만료. 로그아웃 버튼(`POST /admin/logout`)은 쿠키를 지움. https로 배포하면 `ADMIN_COOKIE_SECURE=true` |\n| 비밀번호가 설정되지 않았을 때 | 운영 화면은 열리지 않고(503) 설정 방법을 안내한다. 열려 있는 채로 두지 않는다 |\n| 로그인 실패 제한 | 같은 접속 주소에서 10분 안에 5번 실패하면 10분간 로그인을 막음(맞는 비밀번호도 거절). 실패할 때마다 0.4초 지연. 서버를 다시 켜면 초기화 |\n| 로그인 뒤 이동 | `next` 주소는 이 사이트의 `/admin` 아래 경로만 허용 |\n| CSRF | 쓰기 요청은 모두 POST이고 쿠키가 SameSite=Lax라서 다른 사이트에서 보낸 요청에는 로그인 쿠키가 실리지 않음. 별도 토큰은 아직 없음 |\n| 한계 | 실패 횟수가 서버 메모리에만 있어 서버를 여러 대로 늘리거나 다시 켜면 공유·유지되지 않는다. 비밀번호 분실 시 설정 명령을 다시 실행한다. 감사 기록(누가 언제 무엇을 바꿨는지)은 아직 없음 |\n\n### 4.10 노출 여부 수동 변경 (F-SVC-21)\n\n| 항목 | 규칙 |\n|---|---|\n| 표시 | 운영 화면 목록의 '노출 여부' 칸에 노출·검토·제외 배지. 담당자가 바꾼 건에는 '수동' 표시와 '자동 판정: ○○'를 함께 보여 줌 |\n| 버튼 | 노출이 아닌 공고에 '노출로 변경', 수동으로 바꾼 공고에 '자동 판정으로'(되돌리기). 로그인한 관리자만 처리 |\n| 저장 | 자동 판정(`classifications.exposure`)은 그대로 두고 담당자 값을 `exposure_overrides`에 따로 저장. 조회 뷰(`latest_classifications`)가 수동 값을 우선 |\n| 유지 | 재판별, `reapply-exposure`, 규칙 변경으로도 수동 값은 지워지지 않음. '자동 판정으로' 버튼으로만 해제 |\n| 반영 범위 | 수요자 화면·공개 API·엑셀 내보내기·통계 모두 수동 값 기준 |\n| 제한 | 판별 전 공고는 바꿀 수 없음. '제외로 변경' 버튼은 없음(필요하면 별도 결정). 누가 바꿨는지는 저장하지 않음(관리자 1명). 마감일 없는 공고(ADR-031)도 수동으로 노출 가능 |\n\n### 4.11 자동화 설정 (F-SVC-23)\n\n| 항목 | 규칙 |\n|---|---|\n| 접근 | 로그인한 관리자만(`/admin/automation`) |\n| 기본값 | 자동 실행 꺼짐, AI 판별 꺼짐, 첨부 내려받기 꺼짐, 판별 대상은 2026-01-01 이후 공고. 켜기 전에는 아무 일도 일어나지 않음 |\n| 예약 | 요일(월~일)과 시각(하루 최대 3개)을 서버 현지 시각으로 지정. 서버가 꺼져 있던 동안 지나간 예약은 60분 안에만 따라잡고 그 이후는 건너뜀 |\n| 실행 단계 | ① 수집(새 글이 없는 쪽에서 멈춤, 쪽수 상한 지정 가능) ② 제목 규칙 선별(비용 없음) ③ AI 판별(Claude API, 비용 발생) ④ 노출 재계산. 단계별로 켜고 끌 수 있고, 한 단계가 실패해도 다음 단계는 계속 |\n| AI 비용 통제 | 1회 최대 건수, 이번 달 최대 건수(상한에 닿으면 AI 단계만 건너뜀), 연속 3회 실패 시 중단. API 키가 없으면 건너뛰고 '주의'로 기록. 키 값은 화면에 보이지 않고 설정 여부만 표시 |\n| 중복 실행 방지 | DB 잠금(박동 3분). 예약 실행기가 여러 프로세스에 떠 있어도 한 번에 하나만 실행. '지금 실행'도 실행 중이면 거절 |\n| 실행 기록 | 시작·종료 시각, 방식(예약/수동/명령), 상태(정상·주의·오류·실행 중), 단계별 결과와 상세 기록 |\n| 사용량 | 이번 달 API 판별 호출 수·토큰·예상 비용(단가는 설정 `AI_PRICE_*`, 환율은 가정값 `USD_KRW`). 규칙·수동(Claude Code) 판별은 비용이 없어 집계하지 않음 |\n| 실행 방식 | ① 웹 서버 안 예약 실행기(기본) ② 웹은 `AUTOMATION_SCHEDULER=0`, 별도 `automation-daemon` ③ cron·Windows 작업 스케줄러에서 `automation-run` |\n| 한계 | 서버 현지 시각만 지원. 예약 실행기는 서버가 켜져 있어야 동작(서버리스 배포에는 부적합 → ③ 사용). 실행 도중 중단된 기록은 '실행 중'으로 남을 수 있음(잠금은 3분 뒤 풀림) |\n\n### 4.12 선별 규칙 화면 (F-SVC-24, F-SEL-09)\n\n| 항목 | 규칙 |\n|---|---|\n| 접근 | 로그인한 관리자만(`/admin/rules`) |\n| 규칙 구성 | 이름, 적용 게시판(전체 또는 하나), 검사 대상(제목 / 말머리=사업구분), 방식(단어 포함 / 정규식), 찾을 단어, 예외 단어, 결과 유형, 사용 여부, 메모 |\n| 결과 유형 | 제외 유형(입찰·용역, 입주 모집, 행사·전시 참가, 경진대회·공모전·포상, 결과 발표, 설명회·안내)만. 사업 모집으로 확정하는 규칙은 만들 수 없음(애매하면 AI가 판단 — 원칙 P1) |\n| 검사 순서 | 목록 순서대로 검사해 처음 걸리는 규칙을 씀. 예외 단어가 함께 있으면 그 규칙은 건너뜀 |\n| 입력 검증 | 정규식 오류, 1글자 단어, 모든 공고에 걸리는 식(빈 글자에도 맞는 정규식)은 저장 거절 |\n| 영향 확인 | 목록에 규칙별로 '현재 공고 적중 건수 · 판별 전 건수 · 이미 다르게 판별된 건수(그중 노출 중)'와 예시를 보여 줌. 다르게 판별된 건수가 많으면 규칙이 너무 넓다는 신호 |\n| 적용 범위 | 아직 판별하지 않은 공고에만 적용. 이미 판별된 결과는 바꾸지 않음. 적용 시점: 판별 시(`classify`), 자동화 ②단계, 화면의 '판별 전 공고에 지금 적용'(AI 호출 없음) |\n| 시험 | 제목·말머리·게시판을 넣어 어느 규칙에 걸리는지 저장 없이 확인 |\n| 기본 규칙 | 처음 한 번만 넣음: 결과 발표(제목), 설명회·안내(제목), NIA 입찰 말머리(조달·입찰·사전규격·사전공개 → 입찰·용역), NIA 검토결과 공개(→ 설명회·안내). 지우면 다시 살아나지 않음 |\n| 한계 | 규칙 변경 이력은 남기지 않음(이름·수정 시각만). 규칙은 제목·말머리만 봄(본문 검사 없음). 같은 공고가 AI 판별로 이미 처리됐다면 규칙을 고쳐도 되돌리지 않음 |\n\n### 4.13 공고 유형 필터 (F-SVC-29, ADR-047)\n\n| 항목 | 규칙 |\n|---|---|\n| 기본 선택 | 공모지원사업만 보인다. 입찰공고·기타는 필터에서 켜면 보인다 |\n| 유형 값 | 분류 결과(announcement_labels, D-20 §5)의 class. 사람이 고친 값을 먼저 쓴다 |\n| 분류 전 공고 | '미분류' 배지를 달아 기본 목록에 넣는다(ADR-052). 기본 선택('공모지원사업')에 함께 보이고, '미분류'만 따로 고를 수도 있다 |\n| 배지 | 카드와 상세에 유형 배지를 단다. 하위 유형(입찰·사전규격·참가·교육 등)은 상세에만 표시한다 |\n| 건수 | 접수 상태 필터처럼 유형별 건수를 버튼에 보여 준다 |\n| 수집 | 입찰공고도 계속 수집한다(I-10) |\n\n### 4.14 상세 표준 5칸 (F-SVC-30, ADR-051)\n\n| 항목 | 규칙 |\n|---|---|\n| 위치 | 상세 화면의 '첨부 공고문에서 읽어 정리한 내용' 블록 자리. '핵심 정보'·'공고 요약' 블록은 그대로 둔다 |\n| 칸 이름 | 공모지원사업·미분류: 공고명·공고 내용·지원자격·공모 지원분야·공모기간. 입찰공고: 공고명·사업 개요·입찰참가자격·분야·계약방법(대체값)·입찰서 접수기간. 기타: 공고명·공고 내용만 값이 있고 나머지는 해당 없음 |\n| 값 | 원문 발췌(생성 요약 없음). 400자를 넘으면 접어 둔다 |\n| 출처 | 값 아래에 '사이트 칸' / '공고 본문' / '첨부: 파일명'. API가 위치를 찾은 값은 'AI 발췌'를 덧붙인다 |\n| 미확인 | '원문 확인 필요'와 원문 공고·첨부 목록 링크 |\n| 해당 없음 | 줄을 흐리게 하고 '이 유형의 공고에는 없는 항목' |\n| 충돌 | 높은 출처(사이트 칸 > 본문 > 첨부)의 값을 보이고 다른 출처의 값을 함께 적는다 |\n| 정리 전 공고 | '아직 정리하지 않은 공고입니다. 원문을 확인하세요.' |\n"}, {"file": "20_데이터설계.md", "meta": {"doc_id": "D-20", "title": "데이터 설계", "group": "데이터·검증", "version": "0.4", "status": "초안", "updated": "2026-11-25"}, "body": "\n> [!warning] 2026-11-20 판별 기능 삭제(ADR-044)\n> 공고 AI 판별·분류 체계·선별 규칙·노출 규칙·AI 호출 비용 관련 기능은 모두 삭제했다. 이 문서의 해당 내용은 **당시 설계의 이력**으로만 남기며 현재 구현과 다르다. 삭제 전 코드·DB·문서는 `data/bak_remove_cls_1120/`에 있다.\n\n# 데이터 설계\n\n## 1. 현재 구조(NIPA PoC)\n\n`nipa/data/nipa.db`(SQLite)의 테이블 3개다.\n\n| 테이블 | 행 수('26.10.1) | 키 | 내용 |\n|---|---|---|---|\n| announcements | 353 | id(NIPA 게시물 번호) | 공고 원문·가공값·최초/최종 수집 시각 |\n| attachments | 1,338 | (ann_id, seq) | 첨부 파일명·확장자·크기·URL |\n| runs | 3 | run_id | 실행 방식·처리·신규·갱신·오류 건수, 로그 |\n\n> [!warning] 기관을 늘리기 전에 바꿀 점\n> 게시물 번호는 기관마다 따로 매겨지므로 `id` 하나로는 기관 간에 겹친다. 키를 (게시판, 게시물 번호)로 바꾸고 기관·게시판 테이블을 둔다.\n\n## 2. 목표 구조(안)\n\n| 테이블 | 키 | 주요 칼럼 | 관련 기능 |\n|---|---|---|---|\n| orgs | org_id | 기관명, 약칭, 기관 유형(전담·유관) | F-CRW-01 |\n| boards | board_id | org_id, 게시판명, 목록 URL, 수집 방식, robots 허용 여부, 사용 여부 | F-CRW-01·08 |\n| announcements | ann_id(내부 일련) | board_id, post_no, 제목, 사업구분, 신청 시작·마감, 작성일, 조회수, 본문, 원문 URL, first_seen, last_seen | F-CRW-02~06 |\n| attachments | (ann_id, seq) | 파일명, 확장자, 크기, URL, 텍스트 추출 여부 | F-CRW-03·11 |\n| runs | run_id | board_id, 방식, 시작·종료, 처리·신규·갱신·오류, 상태(정상·주의·오류), 로그 | F-CRW-07·10 |\n| biz_master | biz_code | 내역사업명, 기금 여부, R&D 구분, 소관 기관, 기준 연도 | F-SEL-03·04 |\n| biz_alias | (alias, biz_code) | 사이트 사업구분 표기 → 내역사업 연결 | F-SEL-03 |\n| selections | (ann_id, run_no) | 공고 유형, 기금 여부, R&D 구분, 노출 결정, 확신도, 근거, 판정 방식(규칙·대조·AI), 모델, 프롬프트 버전 | F-SEL-01~05 |\n| classifications | (ann_id, run_no) | 수혜자 유형, 지원방식, 사업분야, 추출 항목 JSON, 요약, 정보 부족 여부, 확신도, 모델, 프롬프트·분류 체계 버전, 토큰 수 | F-CLS-01~05 |\n| programs | program_id | 사업명, biz_code, 연도, 대표 공고 | F-CLS-06 |\n| program_notices | (program_id, ann_id) | 공고의 역할(본공고·변경·결과·설명회) | F-CLS-06 |\n| reviews | review_id | ann_id, 대상(선별·분류), 필드, AI 값, 확정 값, 판정자, 일시, 메모 | F-SEL-07, F-SVC-04 |\n| taxonomy | (version, code) | 분류 체계 버전별 코드·명칭·정의 | F-CLS-08 |\n\n## 3. 설계 규칙\n\n| 규칙 | 내용 |\n|---|---|\n| 판정 이력 보존 | selections·classifications는 덮어쓰지 않고 실행마다 run_no를 올려 쌓는다. 최신값은 조회용 뷰로 제공 |\n| 최종값 우선순위 | reviews(담당자) > 최신 AI·규칙 판정 |\n| 원문·가공 분리 | 사이트 원문 값(period_raw 등)과 가공 값(start_at 등)을 따로 둔다 |\n| 시각 표기 | ISO 8601(`2026-10-01T17:51:20`), 한국 시간 |\n| 개인정보 | 작성자 이름은 내부 칼럼으로만 두고 외부 제공 데이터에서 뺀다 |\n\n## 4. 이관 방안\n\n| 순서 | 작업 |\n|---|---|\n| 1 | orgs·boards에 NIPA 사업공고 게시판 등록 |\n| 2 | announcements를 새 구조로 복사(post_no = 기존 id, board_id = NIPA 사업공고) |\n| 3 | attachments·runs의 키를 새 ann_id·board_id로 바꿔 복사 |\n| 4 | 대시보드·성과지표 스크립트가 새 구조를 읽도록 수정하고, 이관 전후 건수(353·1,338·3) 대조 |\n\n운영 DB(PIMS 쪽 등)로 옮길지는 PIMS 연계 방식(I-06)과 함께 정한다.\n\n## 5. 배포 파이프라인 추가 표 (구현 2026-11-25, ADR-045·051)\n\n앱 스키마(`app/schema.sql`)에 더한 표다(2026-11-25 구현, 기존 DB의 `attachments.text_engine`은 `db._migrate`가 붙인다). 기존 표의 칸은 바꾸지 않는다(원천·가공 분리).\n\n| 테이블 | 키 | 주요 칼럼 | 비고 |\n|---|---|---|---|\n| announcement_labels | ann_id | class, sub, confidence, reason, status(확정/수동 확인/분류 보류), source(api/manual), prompt_version, model, request_id, input_hash, labeled_at, labeled_by | 유형 분류(ADR-045·048). source=manual(사람 수정)은 API가 덮어쓰지 않음. input_hash가 바뀌거나 prompt_version이 다르면 다시 분류. 라벨이 없거나 class가 비면 화면에서 '미분류'(ADR-052) |\n| announcement_fields | (ann_id, field) | value(원문 발췌), start_at·end_at(기간만), source(site/body/attachment), source_ref(파일명), evidence(근거 문장), status(확인/미확인/해당 없음/충돌), note, method(rule/api), prompt_version, input_hash, extracted_at | 표준 필드 5종(공고명·공고 내용·지원자격·공모 지원분야·공모기간). 출처 우선순위는 사이트 칸 > 본문 > 첨부. 같은 입력으로 API를 다시 부르지 않도록 API 결과 행은 input_hash가 같으면 보존(ADR-051) |\n| llm_calls | call_id | run_id, 단계(classify/extract), 방식(sync/batch), model, served_model, 대체 여부(ADR-049), request_id, 공고 수, 입력·출력·캐시 읽기·캐시 쓰기 토큰, 추정 비용, 결과(ok/refusal/max_tokens/invalid/error), 오류, 시각, 소요 ms | 비용 실측과 예산 상한(I-11) 근거 |\n| attachments(열 추가) | (ann_id, seq) | text_engine(kordoc/legacy) | 첨부 글자를 어느 추출기로 읽었는지(ADR-050). text_status 값의 뜻은 그대로 |\n\nDDL과 저장 규칙은 `plan/00_구현핸드오프.md` 5.1·부록 C.8, 표준 필드 분석은 `docs/핸드오프/상세화면_표준필드_20261124.md`.\n"}, {"file": "30_검증및품질.md", "meta": {"doc_id": "D-30", "title": "검증 및 품질 관리", "group": "데이터·검증", "version": "0.2", "status": "초안", "updated": "2026-10-06"}, "body": "\n> [!warning] 2026-11-20 판별 기능 삭제(ADR-044)\n> 공고 AI 판별·분류 체계·선별 규칙·노출 규칙·AI 호출 비용 관련 기능은 모두 삭제했다. 이 문서의 해당 내용은 **당시 설계의 이력**으로만 남기며 현재 구현과 다르다. 삭제 전 코드·DB·문서는 `data/bak_remove_cls_1120/`에 있다.\n\n# 검증 및 품질 관리\n\n## 1. 검증 데이터 구축\n\n| 항목 | 내용 |\n|---|---|\n| 대상 | NIPA 2026년 게시 공고 121건(1차). 1단계 기관 가동 후 기관별 30건 이상 추가 |\n| 방법 | AI가 먼저 판정 → 담당자가 엑셀에서 정답 열 표시 → 정답을 reviews 테이블로 적재 |\n| 정답 항목 | 공고 유형, 기금 여부, R&D 구분, 노출 여부, 수혜자 유형, 지원방식, 사업분야 |\n| 판정자 | 기금사업성과팀 담당자 1인 + 애매한 건 2인 교차 확인 |\n| 보관 | 검증 데이터는 버전을 붙여 고정(v1 = 2026년 121건). 프롬프트 개선에 쓴 사례와 평가용 사례를 나눠 둔다 |\n\n> [!tip] 개선용·평가용 분리\n> 오분류 사례를 보고 프롬프트를 고치면 그 사례에서는 정확도가 오를 수밖에 없다. 121건 중 일부(예: 30건)를 평가 전용으로 떼어 두고, 프롬프트를 고칠 때 보지 않는다.\n\n## 2. 측정 지표\n\n성과지표 정의서(`ICT기금_공모사업_크롤링_성과지표_정의서.xlsx`)의 8개 지표 가운데 이 설계와 연결되는 항목이다.\n\n| 지표 | 산식 | 현재('26.10.1) | 관련 기능 |\n|---|---|---|---|\n| 1. 수집 대상 기관 구축률 | 가동 기관 수 ÷ 16 × 100 | 6.3%(1/16) | FS-CRW |\n| 2. 수집 완전성 | 수집 건수 ÷ 사이트 게시 건수 × 100 | 100%(353/353) | F-CRW-02~04 |\n| 3. 수집 성공률 | (처리 − 오류) ÷ 처리 × 100 | 100%(3회 실행, 오류 0) | F-CRW-10 |\n| 4. 수집 적시성 | 게시 다음 날까지 수집한 비율 | 측정 전 | F-CRW-04·13 |\n| 5. 핵심 항목 추출률 | 항목별 추출 건수 ÷ 전체 × 100 | 작성일 100%, 사업구분 99.2%, 신청기간 97.7% | F-CRW-03 |\n| 6. 비R&D 공모 선별 정확도 | 일치 건수 ÷ 검증 건수 × 100 | 측정 전 | FS-SEL |\n| 7. 수혜자 유형 분류 정확도 | 일치 건수 ÷ 검증 건수 × 100 | 측정 전 | FS-CLS |\n| 8. 공모정보 이용 실적 | 월간 조회 수·이용자 수 | 측정 전 | F-SVC-08 |\n\n추가 운영 지표: 검토 대기 비율(F-SEL-06), 정보 부족 비율(F-CLS-07), 건당 AI 비용.\n\n## 3. 판정 기준\n\n| 대상 | 일치로 보는 경우 |\n|---|---|\n| 공고 유형·노출 여부 | 값이 같음 |\n| 수혜자 유형·지원방식(복수 선택) | 코드 집합이 같음(완전 일치). 부분 일치율은 참고값으로 따로 기록 |\n| 사업분야(최대 3개) | 담당자 정답의 첫 분야가 AI 결과에 포함 |\n| 추출 항목 | 금액·기간이 원문과 같음. 원문에 없는데 값을 만든 경우는 오류로 별도 집계 |\n\n## 4. 실험 기록\n\n프롬프트·모델·설정을 바꿀 때마다 한 줄씩 추가한다. 행은 지우지 않는다.\n\n| 실험 | 일자 | 대상 | 프롬프트 | 모델·설정 | 선별 정확도 | 분류 정확도 | 비용 | 메모 |\n|---|---|---|---|---|---|---|---|---|\n| E-001 | — | 검증 v1 | select_v1 / classify_v1 | claude-sonnet-5-5, effort medium | — | — | — | 첫 측정 예정 |\n\n## 5. 수집 품질 점검\n\n| 점검 | 주기 | 방법 |\n|---|---|---|\n| 빠진 번호·중복 | 실행마다 | 목록 번호 1~N 대조(성과지표 2) |\n| 필수 항목 결측률 | 실행마다 | F-CRW-07 기준 |\n| 기관 URL 재점검 | 분기 | 점검 엑셀 갱신(HTTP 상태·robots.txt) |\n| 어댑터 회귀 테스트 | 코드 변경 시 | HTML 스냅샷 대비 파싱 결과 비교 |\n"}, {"file": "40_결정기록.md", "meta": {"doc_id": "D-40", "title": "결정 기록", "group": "관리", "version": "0.32", "status": "초안", "updated": "2026-11-25"}, "body": "\n> [!warning] 2026-11-20 판별 기능 삭제(ADR-044)\n> 공고 AI 판별·분류 체계·선별 규칙·노출 규칙·AI 호출 비용 관련 기능은 모두 삭제했다. 이 문서의 해당 내용은 **당시 설계의 이력**으로만 남기며 현재 구현과 다르다. 삭제 전 코드·DB·문서는 `data/bak_remove_cls_1120/`에 있다.\n>\n> 2026-11-24 ADR-045~052로 공고 분류와 표준 필드 추출을 Claude API로 다시 넣기로 했고, 2026-11-25 작업 브랜치 `feat/api-pipeline`에 구현했다(배포 전, 실제 API 호출 확인은 배포 뒤). 새 구성은 D-02 §9와 저장소의 `plan/` 폴더(구현은 `plan/00_구현핸드오프.md`)에 있고, 위의 옛 판별 설계는 여전히 이력이다.\n\n# 결정 기록\n\n설계 판단을 한 건씩 남긴다. 결정을 바꿀 때는 기존 행을 지우지 않고 상태를 '대체됨'으로 바꾼 뒤 새 번호로 추가한다.\n\n| 번호 | 일자 | 결정 | 근거 | 상태 | 관련 |\n|---|---|---|---|---|---|\n| ADR-001 | 2026-10-01 | PoC 저장소는 SQLite로 한다 | 설치·운영 부담이 없고 공고 수천 건 규모에 충분. 운영 DB 이관은 PIMS 연계 방식과 함께 결정 | 결정 | D-20, I-06 |\n| ADR-002 | 2026-10-02 | 선별은 규칙 1차 + AI 2차의 혼합 방식으로 한다 | 입찰·결과 공지 등은 제목만으로 갈려 AI가 필요 없음. 비용·재현성 확보(원칙 P1) | 제안 | FS-SEL |\n| ADR-003 | 2026-10-02 | 기금·비R&D 판정은 내역사업 목록 대조를 기본으로 한다 | 공고문에 재원·R&D 구분이 거의 없음. 사업구분 칸 채움률 99.2%(350/353) | 제안 | F-SEL-03·04, I-01 |\n| ADR-004 | 2026-10-02 | AI PoC는 Claude API로 하고 호출부를 한 모듈로 격리한다 | 환경(SDK·키) 준비됨. AX계획의 외부 LLM 연동 검증 취지에 맞추되 공급자 교체 가능하게(원칙 P7) | 제안 | D-02 §5, I-08 |\n| ADR-005 | 2026-10-01 | 첨부파일 자동 저장과 자동 실행은 보류한다 | 사용자 결정(\"아직 붙이지 말고 기억만 해둬, 자동실행도 아직 필요없어\") | 대체됨 | F-CRW-12·13, ADR-010 |\n| ADR-006 | 2026-10-02 | 대시보드 UI 개편 적용은 보류한다 | 사용자 결정. 시안 4종은 `UI_디자인(안)`에 보존 | 보류 | F-SVC-05~07·09 |\n| ADR-007 | 2026-10-02 | 수요자 화면은 공고가 아니라 사업 단위로 보여 준다 | 같은 사업이 본공고·변경·결과로 반복 게시(예: ICT창의기업육성 36건) | 제안 | F-CLS-06 |\n| ADR-008 | 2026-10-06 | 프로젝트를 Python + Flask 웹앱 구조로 전환한다(앱 루트 = 작업 폴더, 소스 `app/`) | 사용자 결정. 수집·판별·조회를 한 앱에서 운영하고 수요자 화면(UI 시안 안2)을 붙이기 위함 | 결정 | D-02 §3 |\n| ADR-009 | 2026-10-06 | AI 판별 모델은 Claude Sonnet 5.5, effort medium으로 한다 | 사용자 결정. ADR-004의 공급자 격리 원칙은 유지(`app/ai/client.py`) | 결정 | D-02 §5 |\n| ADR-010 | 2026-10-06 | 첨부파일은 신규 수집분부터 수집 시점에 즉시 저장한다. 자동 실행은 계속 보류 | 사용자 결정. 기존 1,338개(약 1.87GB)는 필요 시 `fetch-attachments`로 받음. 저장 경로는 `.env`의 `ATTACHMENT_DIR` | 결정 | F-CRW-12·13 |\n| ADR-011 | 2026-10-06 | 기존 NIPA DB(353건)는 새 스키마로 이관하고 원본은 `archive/legacy_nipa`에 보관한다 | 사용자 결정. 이관 전후 건수 일치 확인(353·1,338·3) | 결정 | D-20 §4 |\n| ADR-012 | 2026-10-06 | 수요자 화면(`/`)은 UI 시안 안2로 하고 AI 판정 '노출' 공고만 보여 준다. 운영 화면은 `/admin`, 카드는 앱 상세 화면으로 연결, 판별 전 공고는 단어 기준 임시 분류로 표시 | 사용자 결정. 노출 기준은 설정 `PUBLIC_EXPOSURE`로 조정 | 결정 | F-SVC-05, I-03 |\n| ADR-013 | 2026-10-06 | 제목만으로 입찰·결과 발표·설명회가 확실한 공고는 AI 없이 규칙(rule_v1)으로 제외하고, 애매한 건은 AI에 넘긴다 | 방향은 사용자 승인(원칙 P1 이행). 규칙의 구체적 범위는 Claude 설계: 실제 제목 검토에서 '선정 공고'(모집·결과 혼재)와 '(수정)…설명회 추가'가 오제외되는 것을 확인해 좁히고, 모집·변경 단어가 있으면 AI로 넘김. 규칙 범위는 담당자 검토 전 잠정 | 대체됨 | F-SEL-01·02, ADR-016 |\n| ADR-014 | 2026-10-07 | 분류 체계를 v1로 개정하는 안을 제안한다(참여 역할·공고 구분·지역 축 신설, 유형·지원방식·분야 조정) | 사용자 요청(\"AI가 분류 체계를 먼저 제안\"). 근거는 NIPA 353건 제목·사업구분 검토. 2026-10-07 사용자가 방향을 확정해 코드·프롬프트에 적용(`TAXONOMY_VERSION=v1`, `classify_v2`). 투자사·액셀러레이터는 수혜자 유형에 넣지 않음 | 결정 | F-CLS-01~03·09, FS-CLS §3.1, I-02 |\n| ADR-015 | 2026-10-07 | 노출은 사업공고·입찰공고 위주로 하고, 행사·경진대회·공모전 성격은 뺀다. AI 판별 결과를 먼저 보여 준 뒤 하나씩 고쳐 나간다 | 사용자 결정. 역할(공급기업·운영기관 등)로는 거르지 않고 모두 보여 줌. 화면 기본 노출값은 '노출,검토'. 정답 표본 검증과 v0·v1 비교는 하지 않고 방향을 정하며 계속 개정. 입주 모집은 잠정 노출, 결과 발표·설명회·안내는 기존대로 제외 | 결정 | F-SEL-05, I-03 |\n| ADR-016 | 2026-10-07 | 제목 규칙 선별은 결과 발표·설명회·안내만 대상으로 한다(입찰·용역 제외) | ADR-015로 입찰 공고가 노출 대상이 되어, 요약·분류가 없는 규칙 처리 대신 AI가 판별하게 함. ADR-013을 대체 | 결정 | F-SEL-01 |\n| ADR-017 | 2026-10-07 | 수요자 화면 개선 3건: ① 접수 마감 공고를 기본 필터에 포함(설정 `PUBLIC_SHOW_ENDED`) ② '변경 공고' 배지를 AI가 판별한 공고 구분으로 대체하고 차수(2차 등)는 별도 표시 ③ 참여 역할·지역을 필터·태그·상세에 표시 | 사용자 결정. ①은 판별 결과를 확인하는 단계의 설정이며 운영 때는 0으로 끌 수 있음. ②는 제목에 '2차'만 있는 공고에 '변경 공고' 배지가 붙던 오류를 바로잡음 | 결정 | F-SVC-05·10 |\n| ADR-018 | 2026-10-08 | 입주 모집을 노출에서 제외한다. 사업·입찰이 아닌 단순 모집은 제외하는 방향이며, 입주 외의 '단순 모집' 범위는 추가 결정 대기 | 사용자 결정(\"입주, 모집 관련 글을 제외해야 될 것 같다. 입찰이나 사업이 아니라 단순 모집 글은 제외\"). 노출 유형은 사업 모집·입찰·용역으로 좁아짐. 저장된 판정은 `reapply-exposure`로 다시 계산(노출 26건 → 제외, 재판별 없음). ADR-015의 '입주 잠정 노출'을 대체 | 결정 | F-SEL-05, I-03 |\n| ADR-019 | 2026-10-08 | 입찰·발주·공사 성격의 공고(공고 유형 '입찰·용역')를 노출에서 제외한다. 노출 유형은 사업 모집뿐이다 | 사용자 결정(\"입찰 발주 공사 성격의 공고는 빼야 될 것 같다\"). ADR-015의 '입찰공고 노출'을 대체. 저장된 판정은 `reapply-exposure`로 재계산(6건: 노출 5·검토 1 → 제외). 유형은 '사업 모집'이지만 입찰·위탁 성격일 수 있는 경계 건(#226·#193·#68·#49)은 사용자 확인 대기 | 결정 | F-SEL-05, I-03, I-10 |\n| ADR-020 | 2026-10-08 | 수요자 화면과 분류를 단순화한다: ① 지원 분야 '분야 무관'을 '기타'로 통합(분류 체계 v1.1, 프롬프트 classify_v3, 저장된 84건 변경) ② 공고 유형은 둘 이상으로 나뉠 때만 표시 ③ 참여 역할은 화면에 표시하지 않음 ④ 'AI 분류' 출처 표시를 하지 않음 | 사용자 결정. ③은 표시만 뺀 것이고 판별 값(`roles`)은 저장을 유지한다. '지원 대상 = 지원 자격(참여할 개인·기업 등)'으로 보라는 의견은 기준 변경과 재판별이 필요해 별도 결정 대기 | 결정 | F-CLS-03·09, F-SVC-05·10 |\n| ADR-021 | 2026-10-08 | ① 지원 대상(신청 자격)에 '기타'를 추가하고(분류 체계 v1.2, 프롬프트 classify_v4), 해당하는 값이 없으면 '기타'로 한다 ② 수요자 화면에서 지역 표시를 뺀다 ③ 기존 공고는 재판별하지 않고 비어 있던 지원 대상만 '기타'로 채운다 | 사용자 결정. 저장된 판별 261건의 빈 대상을 '기타'로 변경(백업 `data/gongmo.db.bak-20261008b`). '기타'는 신청 자격이 적혀 있지 않은 공고도 포함하므로 실제 자격이 첨부에 있을 수 있음. 지역 값(`region`)은 저장을 유지 | 결정 | F-CLS-01·09, F-SVC-10 |\n| ADR-022 | 2026-10-15 | 입찰·용역을 다시 노출한다(ADR-019 대체). 입찰·용역은 발주·계약 성격까지 모두 수집해 화면 필터로 거르고, 공모전·교육·기관 행사(경진대회·공모전·포상, 행사·전시 참가, 설명회·안내)와 입주 모집은 계속 뺀다. 입찰·용역은 R&D 여부를 따지지 않는다 | 사용자 결정(\"입찰, 공모 등 용역 관련된 내용은 다 수집해서 거르는 게 좋겠다\"). 노출 규칙만 바꾸고 `reapply-exposure`로 저장된 판정 6건 갱신(노출 200→205, 검토 38→39, 제외 115→109, 백업 `data/gongmo.db.bak-20261015`). 재판별 없음 | 결정 | FS-SEL, FS-CLS, F-SEL-05 |\n| ADR-023 | 2026-10-15 | 입찰·용역을 다시 노출에서 제외한다(ADR-022 대체). 수집·판별은 그대로 하고 노출 규칙만 되돌린다. 계약·입찰 일정은 이 서비스에 필요하지 않다 | 사용자 결정(\"입찰은 제외하는 게 맞을 것 같다… 명확한 입찰공고는 제외\"). NIA 입찰공고 2026년 571건을 수집·판별한 화면 확인 뒤 결정(입찰 521건이 모두 '상시 모집'으로 표시되는 문제). `reapply-exposure`로 527건 갱신(노출→제외 526, 검토→제외 1, 백업 `data/gongmo.db.bak-20261015-bid-excl`). 재판별 없음 | 결정 | FS-SEL, FS-CLS, F-SEL-05 |\n| ADR-024 | 2026-10-16 | 수요자 목록 화면에 작은 서비스 4가지를 넣는다: 곧 마감 띠, NEW 배지, 분야 분포 막대, 관심 공고 저장. 관심 공고는 서버 저장 없이 브라우저에만 저장한다 | 사용자 결정(시안 확인 후 \"서비스 다 넣어주고\"). 모두 현재 DB 값으로 구현하며 계정·알림·개인정보가 필요한 기능(이메일 알림, 기기 간 공유)은 하지 않는다. NEW는 수집일이 아닌 게시일 기준 | 결정 | F-SVC-12~15, FS-SVC §4 |\n| ADR-025 | 2026-10-16 | 수요자 화면의 카드·상세에서 '사업명 · ○○' 줄을 모든 기관에서 숨긴다 | 사용자 결정(\"걍 다 숨겨줘\"). NIPA는 게시판의 사업구분, NIA는 제목 말머리(공모·위탁연구 등)가 들어가 'NIA는 사업명이 아닌 값'이 노출되는 문제가 있었다. 값은 계속 저장하고 검색 대상에 포함 | 결정 | FS-SVC §3 |\n| ADR-026 | 2026-10-16 | '많이 찾는 검색어'를 고정 단어가 아니라 이용자가 실제로 검색한 기록으로 보여 준다. 검색한 사람은 저장하지 않고, 결과가 있었던 검색어만 2회 이상일 때 표시 | 사용자 결정(\"실제 많이 검색한 내용을 보여주는 기능으로\"). 검색어를 개인정보 없이 저장하는 `search_logs` 테이블 추가, 이메일·전화번호·주소로 보이는 값은 기록하지 않음. 기록이 없으면 줄을 숨김 | 결정 | F-SVC-18, FS-SVC §4.7 |\n| ADR-027 | 2026-10-16 | '많이 찾는 검색어'에 금칙어 목록을 적용한다. 금칙어가 들어 있는 검색어는 기록하지 않고, 이미 기록되었거나 여러 번 반복된 것도 화면에서 뺀다. 검색 자체는 막지 않는다 | 사용자 결정(\"금칙어 목록 만들어주고… 반복 단어에서도 제외\"). 목록은 파일(`app/banned_terms.txt`)로 두어 담당자가 서버 재시작 없이 고칠 수 있게 함. 공백·기호를 지우고 비교하므로 우연히 겹치는 단어('성기', '애자', '일베' 등)는 목록에서 제외. 수집 공고 제목 933건이 걸리지 않는 것을 시험으로 확인 | 결정 | F-SVC-18, FS-SVC §4.7 |\n| ADR-028 | 2026-10-16 | 금칙어를 운영 화면(`/admin/banned`)에서 추가·삭제·점검할 수 있게 한다. 저장은 기존 금칙어 파일을 그대로 쓰고 별도 DB 테이블을 만들지 않는다 | 사용자 결정(\"관리자 화면에서 금칙어를 관리할 수 있는 기능도\"). 파일을 직접 고치던 방식과 같은 곳을 쓰므로 두 방법이 충돌하지 않음. 정상 단어를 가리는 금칙어를 막기 위해 공고 제목 포함 여부를 경고하고, 최근 검색어에서 바로 금칙어로 추가할 수 있게 함. 운영 화면에 로그인이 없어 인증은 배포 전 과제로 남김 | 결정 | F-SVC-19, FS-SVC §4.8 |\n| ADR-029 | 2026-10-16 | 운영 화면(`/admin`)과 운영용 API는 관리자 로그인이 필요하다. 관리자 1명, 비밀번호는 해시로만 `.env`에 저장하고 세션 쿠키로 로그인을 유지한다. 비밀번호가 설정되지 않으면 운영 화면을 열지 않는다 | 사용자 결정(\"관리자 페이지는 로그인이 필요해\"). 방식은 가장 단순한 비밀번호 로그인으로 시작하고(기관 계정 연동은 필요할 때 별도 결정), 운영 화면에 쓰기 기능(금칙어)이 생겨 먼저 필요했다. `/api/announcements` 등 제외·미판별 공고까지 담은 운영용 API도 함께 보호(공개 API만 예외). 로그인 5회 실패 시 10분 잠금 | 결정 | F-SVC-20, FS-SVC §4.9 |\n| ADR-030 | 2026-10-16 | 목록 카드에서 신청 기간 아래의 접수 진행 막대를 숨긴다(상세 화면은 유지) | 사용자 결정(\"신청기한 밑에 바 표시한 거는 필요 없을 것 같아\"). 신청 기간 문구와 D-day 배지가 같은 정보를 준다. 진행률(`pct`)·접수 기간 일수(`span`) 값은 서버가 계속 계산 | 결정 | FS-SVC §3 |\n| ADR-031 | 2026-10-19 | 접수 마감일이 없는 공고는 노출하지 않는다(노출 판정이 나와도 제외로 바꿈. 검토 판정은 그대로). 기관 구분 없이 모든 게시판에 적용 | 사용자 결정(\"기간 없는 공고들은 노출에서 무조건 제외해야될 것 같아\"). 마감일이 없으면 진행 중인지 알 수 없고 곧 마감 띠·마감 표시도 못 쓴다. '상시모집'으로만 적힌 공고도 마감일이 없으므로 제외된다(현재 NIPA 4건, 모두 2023년 공고). 마감일을 나중에 채우면 `reapply-exposure`로 다시 계산 | 결정 | FS-SEL 노출 결정표 |\n| ADR-032 | 2026-10-19 | 한국전파진흥협회(RAPA) 공지사항(`rapa_notice`)을 수집 대상에 추가한다. 2026-01-01 이후 공고만, 첨부는 이름만 저장. 목록에 접수기간 칸이 없어 본문에서 찾고, 없으면 첨부 공고문·수행지침을 읽어 채운다 | 사용자 요청. robots.txt 없음(404)이라 금지 규칙 없음. 목록은 `addList.do` POST, 상세는 GET으로 열림. 첨부 판독은 사용자 승인 후 임시 폴더에서만 했고(저장 안 함), 제목의 '~M/D'만 있는 7건은 시작일을 게시일로 둠 | 결정 | F-CRW-02 |\n| ADR-033 | 2026-10-19 | 운영 화면에서 담당자가 공고의 노출 여부를 버튼으로 직접 '노출'로 바꿀 수 있게 한다. 자동 판정은 보존하고 수동 값을 별도 표에 저장해 우선 적용한다 | 사용자 요청. 자동 판정(마감일 없음·확신도 낮음 등)이 틀릴 때 담당자가 바로잡아야 함. 자동 판정 열을 덮어쓰면 재계산 때 사라지므로 별도 저장 | 결정 | F-SVC-21, FS-SVC §4.10 |\n| ADR-034 | 2026-10-19 | 마감일이 없어도 사이트가 접수기간을 '상시모집'으로 표기한 공고는, 게시일이 1년 이내이면 노출한다(ADR-031의 예외). 그 밖의 마감일 없는 공고는 계속 제외 | 사용자 결정(\"A로 상시모집만 예외 처리\"). '상시모집'은 파싱 실패가 아니라 사이트가 적은 값(현재 NIPA 8건)이고 진짜 상시 모집이면 보여 줘야 한다. 오래된 공고가 계속 남지 않도록 게시 1년 기준을 둠(수요자 화면의 접수 마감 판정과 같은 기준). 노출 여부는 판정·재계산(`reapply-exposure`) 시점에 정해지므로 1년이 지난 공고는 다음 재계산 때 제외로 바뀜 | 결정 | FS-SEL 노출 결정표 |\n| ADR-035 | 2026-10-19 | 수요자 화면에서 차수 표시('2차', '3차 공고')를 목록·상세 모두 없애고, 상세 화면의 '공고 구분' 행과 구분 배지도 없앤다. 목록 카드의 공고 구분 배지(수정·연장 등)는 유지 | 사용자 결정(\"상세페이지에 공고구분은 없어도 될 거 같아. 목록 화면에서도 3차공고 2차 이런 표시는 굳이 없어도 될 거 같아\"). 제목에 이미 차수가 적혀 있어 중복. 값은 판별 결과에 계속 저장하고 검색(차수 단어)에도 쓰임 | 결정 | F-SVC-10 |\n| ADR-036 | 2026-10-19 | 서비스 이름을 'ICT기금 공모사업 AI RADAR'로 하고 로고(레이더 아이콘 + Orbitron ExtraBold 워드마크)를 수요자·운영·로그인 화면에 공통으로 쓴다. 수요자 목록 안내 문구는 '공고내용은 해당 기관에서 수정·변경될 수 있으니 원문공고를 꼭 확인하세요.'로 바꾼다 | 사용자 결정. Orbitron은 SIL OFL 1.1이라 상업적 사용 가능. 외부 서버에 의존하지 않도록 'AI RADAR' 글자만 담은 부분 집합 파일을 앱에 포함(1.7KB) | 결정 | F-SVC-22 |\n| ADR-037 | 2026-10-19 | 지원방식이 '컨설팅·진단·멘토링'뿐인 사업 모집은 노출하지 않는다(제외). 다른 지원방식이 함께 있으면 노출 | 사용자 결정(\"컨설팅과 같은 공고도 제외해야 돼\"). 범위는 사용자가 '지원방식이 컨설팅뿐인 공고'로 선택. 적용 시 노출 14건·검토 1건이 제외로 바뀜(SaaS 전환 컨설팅, 디지털인프라(SW) 진단 및 개선, 베트남 전문가 1:1 컨설팅 등). 컨설팅이 하나라도 포함되면 모두 빼는 안(29건)은 바우처·창업육성까지 빠져 채택하지 않음. 규칙은 `EXCLUDE_ONLY_METHODS`에 있고, 담당자가 '노출로 변경'하면 수동 값이 우선 | 결정 | FS-SEL 노출 결정표 |\n| ADR-038 | 2026-10-19 | 자동 실행(수집→규칙 선별→AI 판별→노출 재계산)을 구현하고 설정을 관리자 화면에서 한다. 기본값은 꺼짐·AI 끔. 서버 안 예약 실행기를 기본으로 하되 별도 데몬·단발 명령도 제공. AI 판별에는 1회/월 건수 상한을 둔다 | 사용자 요청(\"관리자 대시보드 화면에서 자동화를 설정하는 기능, 스케줄러 실행 시간 등\"). ADR-010·ADR-005의 '자동 실행 보류'를 해제. 배포 시 AI 비용이 무제한으로 늘지 않도록 상한과 키 없음 처리를 넣고, 옛 공고(2025년 NIA 9건 등)가 자동 판별 대상이 되지 않도록 판별 대상 게시일 기준(기본 2026-01-01)을 둠. SQLite 잠금으로 중복 실행 방지 | 결정 | F-CRW-13·14, F-SVC-23 |\n| ADR-039 | 2026-10-19 | 선별 규칙을 코드에서 DB로 옮기고 운영 화면에서 관리하게 한다. NIA 입찰공고 게시판은 제목 말머리(조달입찰·사전규격 등)로 AI 호출 전에 '입찰·용역'으로 제외한다(ADR-016의 'NIA 입찰도 AI가 요약·분류' 방침을 변경). 규칙은 제외 유형만 만들 수 있고 판별 전 공고에만 적용. 자동 실행은 켜지 않음 | 사용자 결정(\"자동실행은 켜지 말고 NIA 입찰을 규칙으로 제어해도 될 거 같아. 규칙을 관리할 수 있는 기능도\"). NIA 게시판은 월 약 70건이 대부분 입찰이라 배포 후 AI 비용의 대부분을 차지함 — 말머리 규칙으로 기존 판별 결과와 524건 모두 일치(어긋난 건 0)함을 확인. [공모]·[위탁연구] 말머리는 규칙에 걸리지 않아 AI가 판단. 노출 규칙(사업 모집만 노출)과는 별개로, 규칙이 잘못 넓으면 정상 공고가 사라지므로 저장 전 영향 건수 표시·입력 검증·제외 유형 제한을 둠 | 결정 | F-SEL-09, F-SVC-24 |\n| ADR-040 | 2026-10-19 | AI 판별 항목에 핵심 일정(key_dates)과 지원 규모 숫자(총액·건당 최대·선정 건수·자부담 조건)를 추가한다(분류 체계 v1.3, 프롬프트 classify_v5). 접수 기간이 비어 있는 공고는 본문의 '접수 마감' 일정으로 채운다. 수요자 화면에 주요 일정·지원금 표시와 지원금 필터·정렬을 넣는다. 이미 판별된 노출·검토 공고에는 보강 가져오기로 새 항목만 채운다 | 사용자 결정(추가 제안 중 1번 '핵심 일정·지원 규모 숫자화'). 같은 비용으로 달력·타임라인·필터·정렬을 가능하게 하고 접수 기간 누락을 줄인다. 숫자는 원문에 적힌 값만 쓰고 계산으로 만들지 않으며, 틀리면 곤란한 항목이라 화면에 원문 확인 안내를 유지. 보류: 첨부 판독(제목·본문으로 판단하기 어려운 건에 나중에 도입), 같은 사업 묶기, 운영자용 검토 보조·규칙 제안. 자연어 검색은 구현하지 않고 타당성만 검토 | 결정 | F-CLS-12·13, F-SVC-25 |\n| ADR-041 | 2026-11-20 | 정보 부족 공고는 첨부 공고문을 읽어 판별한다(2026-10-08 합의의 구현 보류를 해제). 대상은 본문 200자 미만 미판별 공고와 정보 부족으로 판별된 노출·검토 공고. 첨부에서 글자를 뽑아 DB에 저장하고 AI 입력에 본문과 같은 근거로 넣으며, 추출은 외부 서비스 없이 이 컴퓨터에서 한다. 미판별 공고는 제목 규칙으로 먼저 거른 뒤 남은 건만 읽는다 | 사용자 결정(\"정보 부족건은 첨부를 통해서 판별하는게 맞는 거 아냐?\"). 제목만으로 판별한 뒤 다시 판별하면 비용이 두 번 드므로 첨부를 먼저 읽는다. 한계: 스캔본·이미지 속 글자는 못 읽음, PDF는 앞 40쪽만 | 결정 | F-CLS-14 |\n| ADR-042 | 2026-11-20 | 운영 화면에 통계·검색어·로그를 둔다. 방문은 목록·상세 조회만 세고, 접속 주소·계정·브라우저 정보는 저장하지 않는다(순방문은 하루만 쓰는 열쇠로 만든 값의 개수, 60일 뒤 삭제). 관리자가 바꾼 것과 로그인 시도는 운영 이력으로 1년 보관하되 비밀번호와 아이디 칸 입력값은 남기지 않는다 | 사용자 요청(\"사용자 접속량, 검색어 등 필요한 관리자 화면 구성\"). 개인정보 최소화를 위해 사람을 알아볼 수 있는 값은 저장하지 않는 쪽을 택함. 기관의 개인정보 기준에 맞는지는 담당 부서 확인 필요 | 결정 | F-SVC-26~28 |\n| ADR-043 | 2026-11-20 | 운영 화면의 분류별 워드 클라우드(`/admin/workspaces`)와 분류별 작업 공간(`/admin/workspace`)을 삭제한다. 서비스 코드·화면·스타일·시험을 모두 제거하고, 지우기 전 파일을 `data/bak_wordcloud_1120/`에 백업한다 | 사용자 요청(\"워드 클라우드 관련 소스 다 날려줘\"). 통계·검색어·로그 화면이 운영 확인 용도를 대신한다. 다른 시험이 쓰던 공용 도구는 `tests/helpers.py`로 옮김 | 결정 | F-SVC-11 |\n| ADR-044 | 2026-11-20 | 공고 AI 판별 기능을 모두 삭제한다: 분류 체계·판별 지침(classify_v1~v5)·AI 호출 코드·선별 규칙·노출 규칙·수동 노출 변경·가져오기 명령·AI 비용 문서, DB의 판별 결과(3,192건)·선별 규칙·노출 변경 표, 수요자 화면의 유형·분야·대상 필터와 배지. 수요자 화면은 수집한 원본 공고를 그대로 보여 준다. ADR-002·005·015~041 중 판별·노출·선별에 관한 결정은 이 결정으로 모두 폐기한다 | 사용자 요청(\"판별에 대한 내용은 다 날려버려\", 범위: 데이터+코드·화면·문서 모두). 삭제 전 전체를 `data/bak_remove_cls_1120/`에 백업했다. 첨부 글자 추출(ADR-041의 추출 부분)은 판별과 무관해 남겼다 | 결정 · 일부 대체됨(ADR-045·047, 2026-11-24) | F-SVC-04·08·10·14·21·24·25 삭제 |\n| ADR-045 | 2026-11-24 | 공고 분류와 상세화면 표준 필드 추출에 Claude API를 다시 쓴다. 모델은 `claude-sonnet-5-5`. 분류는 3종(공모지원사업·입찰공고·기타)과 하위 유형 12종을 구조화 출력(JSON 스키마)으로 받고, effort low·50건 묶음·시스템 프롬프트 캐시로 호출한다. 표준 필드(공고명·공고 내용·지원자격·공모 지원분야·공모기간)는 규칙으로 먼저 찾고 못 찾은 칸만 API로 추출한다. 보내는 값은 제목·말머리·상태·기간·게시일·본문(연락처 가림)·첨부 이름과 첨부 글자이며 작성자는 보내지 않는다. 사람이 고친 값은 API가 덮어쓰지 않는다. 추출 프롬프트(extract_v1)와 분류 프롬프트 v2(ADR-048)는 적용 전에 기관별 표본으로 CLI 검증한다 | 사용자 결정(2026-11-24 Q&A: \"분류 + 표준 필드 추출\"). 분류 프롬프트 v1을 Claude Code CLI로 1,010건 검증: 형식 오류·누락 0, 앞선 분류(Orca 워커)와 일치 98.9%, 같은 설정 재실행 일치 99.8%, 비용 $0.74~2.39. ADR-044의 'AI 호출 코드 삭제'를 이 범위에서 대체한다 | 결정 · 구현(2026-11-25) | ADR-044, I-04·08·11, D-02 §9, D-20 §5, `plan/01`·`plan/02` |\n| ADR-046 | 2026-11-24 | 배포는 컨테이너 하나(Python 3.12 + Node 20)에 웹(gunicorn)과 워커(`automation-daemon`) 두 프로세스를 띄우고, SQLite·첨부는 영구 볼륨에 둔다. Vercel 서버리스에는 올리지 않는다. 인스턴스를 늘릴 때는 Postgres·객체 저장소로 옮긴다 | 사용자 결정. 수집·분류·kordoc은 오래 걸리고 상시 예약 실행기가 필요하다. 서버리스는 파일 시스템이 읽기 전용이고 Python 런타임에 Node가 없다(D-02 §8.1의 서버리스 주의와 같은 결론) | 결정 · 구현(2026-11-25) | I-07, D-02 §9, `plan/01` 4.5 |\n| ADR-047 | 2026-11-24 | 수요자 화면에 공고 유형 필터(공모지원사업·입찰공고·기타)와 유형 배지를 둔다. 처음에는 공모지원사업만 보이고, 필터로 입찰공고·기타도 볼 수 있다. 입찰공고는 계속 수집한다 | 사용자 결정. 2026-11-24 수집분 1,010건 중 입찰공고 675건(67%), 공모지원사업 216건(21%)이라 '공모사업 찾기' 목적에 맞게 기본 표시를 좁힌다. ADR-044의 '유형 필터·배지 삭제'를 이 범위에서 대체한다 | 결정 · 구현(2026-11-25) | F-SVC-29, I-03·10, ADR-044 |\n| ADR-048 | 2026-11-24 | 분류 기준을 v2로 확정한다. v1(`plan/prompts/classify_v1.system.md`)에서 세 가지를 바꾸고 나머지는 그대로 둔다: ① 위탁연구·연구과제 공모는 협약 단서가 있어도 입찰공고(협상공모) ② 공모사업 대상이어도 사전규격·사전공개 말머리 글은 입찰공고(사전규격) ③ 채용 합격자 발표는 기타(채용). `classify_v2`를 만들고 v1과 같은 방식으로 다시 검증한 뒤 쓴다 | 사용자 결정(2026-11-24 Q&A). v1 검증에서 판단이 갈린 유형(위탁연구 36건, 공모사업 사전공개 약 24건, 합격자 발표 약 20건)을 말머리와 성격이 분명한 쪽으로 고정한다 | 결정(v2 작성·검증 전) | ADR-045, `plan/prompts/`, `.team/classify-guide.md` |\n| ADR-049 | 2026-11-24 | 분류·추출의 동기 API 호출은 서버 측 대체 모델(`fallbacks: \"default\"`, beta `server-side-fallback-2026-07-01`)을 켠다. 안전 정책으로 거절되면 서버가 대체 모델로 다시 실행하고, 대체 여부와 실제 모델을 호출 기록에 남긴다. 일괄 처리(Message Batches)에는 쓸 수 없으므로 거기서 거절된 건은 '분류 보류'로 둔다 | 사용자 결정. 대체된 부분은 대체 모델 단가로 청구된다 | 결정 · 구현(2026-11-25) | ADR-045, D-20 §5(llm_calls), `plan/02` |\n| ADR-050 | 2026-11-24 | 첨부 글자 읽기에 kordoc(npm, MIT)을 도입한다. MCP 서버가 아니라 CLI를 하위 프로세스로 부르고, 버전을 고정하며(시험 버전 4.24.59), 파일당 시간 제한을 두고, 실패하면 기존 추출기(`app/services/extract.py`)로 넘어간다. OCR은 끈다. zip은 앱에서 먼저 풀고, 같은 이름의 hwp/hwpx가 있으면 pdf보다 먼저 읽는다 | 사용자 결정. 실측: HWP·HWPX 표를 칸 짝까지 보존(KCA 입찰개요·NIPA 지원대상 표), 파일당 약 0.6초. PDF 표는 칸이 어긋나고, 이미지 PDF는 OCR 없이 읽지 못하며, zip은 지원하지 않음(`plan/03`) | 결정 · 구현(2026-11-25) | F-CRW-11, I-04, ADR-046, `plan/03` |\n| ADR-051 | 2026-11-24 | 상세화면 표준 필드(공고명·공고 내용·지원자격·공모 지원분야·공모기간)는 원문 발췌로 채운다. 생성 요약은 쓰지 않는다. API도 원문을 인용만 하고, 앱이 인용이 원문에 있는지 검사한다. 규칙 추출은 모든 유형에 돌리고, 규칙으로 못 찾은 칸의 API 보완은 공모지원사업에만 쓴다. 수요자 상세 화면의 '첨부 구조화' 블록(생성 코드가 저장소에 없는 JSON 3개)을 표준 5칸으로 바꾸고, 유형상 없는 칸('해당 없음')은 흐리게 보인다 | 사용자 결정(2026-11-24 2차 Q&A). 원문에 없는 문장이 화면에 나오지 않게 하고, API 비용은 기본 화면에 보이는 유형에만 쓴다. 칸 배치는 늘 같게 둔다 | 결정 · 구현(2026-11-25) | F-SVC-30, ADR-045, D-20 §5 |\n| ADR-052 | 2026-11-24 | 분류 전이거나 분류에 실패한 공고는 수요자 기본 목록에 넣고 '미분류' 배지를 단다. 유형 필터의 기본 선택('공모지원사업')에 미분류가 함께 보이고, '미분류'만 따로 고를 수도 있다 | 사용자 결정(2026-11-24 2차 Q&A). 분류가 늦거나 API가 실패해도 새 공고가 화면에서 사라지지 않게 한다 | 결정 · 구현(2026-11-25) | F-SVC-29, ADR-047 |\n"}, {"file": "41_미결사항.md", "meta": {"doc_id": "D-41", "title": "미결 사항", "group": "관리", "version": "0.7", "status": "초안", "updated": "2026-11-25"}, "body": "\n> [!warning] 2026-11-20 판별 기능 삭제(ADR-044)\n> 공고 AI 판별·분류 체계·선별 규칙·노출 규칙·AI 호출 비용 관련 기능은 모두 삭제했다. 이 문서의 해당 내용은 **당시 설계의 이력**으로만 남기며 현재 구현과 다르다. 삭제 전 코드·DB·문서는 `data/bak_remove_cls_1120/`에 있다.\n\n# 미결 사항\n\n결정이 필요한 쟁점이다. 해결되면 행을 지우지 않고 상태를 '해결'로 바꾸고, 결정 내용은 D-40에 ADR로 남긴다.\n\n| 번호 | 쟁점 | 선택지 | 영향 | 결정 주체 | 상태 |\n|---|---|---|---|---|---|\n| I-01 | 내역사업 목록(기금 여부·R&D 구분 포함) 확보 | ① 내부 기금운용계획 자료 제공 ② 공개자료로 초안 작성 후 검토 | F-SEL-03·04 판정 방식 전체 | 기금사업성과팀 | 미결 |\n| I-02 | 분류 체계 확정 | ① FS-CLS 초안 v0 사용 ② PIMS·팀 기존 체계 적용 | F-CLS-01~03, 검증 데이터 | 기금사업성과팀 | 미결 |\n| I-03 | 노출 범위 | 입주 모집·행사 참가 모집·입찰 공고를 공모사업 화면에 넣을지 | F-SEL-05 결정표 | 기금사업성과팀 | 해결(ADR-047·048, 2026-11-24): 입찰공고는 수집하되 기본 표시에서 빼고 유형 필터로 보여 줌. 입주·행사 참가·교육생·공모전 모집은 공모지원사업(참가·교육)으로 기본 표시. 이전 상태: 잠정 결정(ADR-015·018·019, ADR-044로 폐기) |\n| I-04 | 내용이 첨부에만 있는 공고(27.5%) 처리 | ① 제목·본문만으로 판정하고 '정보 부족' 표시 ② 첨부 텍스트만 추출(파일 미저장) | F-CRW-11, F-CLS-07, 정확도 | 기금사업성과팀 | 해결(ADR-045·050, 2026-11-24): 첨부 글자를 kordoc으로 읽어 표준 필드 추출의 근거로 쓴다. 찾지 못한 칸은 '미확인(원문 확인 필요)'으로 표시 |\n| I-05 | 수집 주기 | 매일 1회 / 하루 2회 / 연초(2~3월) 집중 기간만 상향 | 성과지표 4(적시성) | 기금사업성과팀 | 미결 |\n| I-06 | PIMS 연계 방식 | 파일 제공 / 조회 API / DB 직접 적재 | F-SVC-08, D-20 이관 | PIMS 담당·기금사업성과팀 | 미결 |\n| I-07 | 형상 관리·운영 환경 | git 저장소 전환, 실행 서버(담당자 PC / 내부 서버) | D-02 §7 | 기금사업성과팀 | 일부 해결(ADR-046, 2026-11-24): git 저장소 사용 중, 운영 환경은 컨테이너 + 영구 볼륨. 호스팅 위치는 미정. 정하기 전까지 이식형(Dockerfile·docker-compose·배포 안내서)까지만 만든다(2026-11-24 2차 Q&A) |\n| I-08 | AI 공급자·비용 승인 | Claude API 유지 / AX계획상 다른 외부 LLM 비교 | ADR-004, 예산 | 기금사업성과팀 | 일부 해결(ADR-045, 2026-11-24): Claude API, 모델 `claude-sonnet-5-5`. 예산 상한은 I-11 |\n| I-09 | 성과지표 목표치 | 지표 1~8 목표값 | D-30, 기능별 품질 기준 | 기금사업성과팀 | 미결 |\n| I-10 | 입찰공고 수집 여부 | 수집해서 제외 판정 / 처음부터 수집하지 않음 | FS-CRW 대상 게시판 | 기금사업성과팀 | 해결(ADR-047, 2026-11-24): 수집하고, 수요자 화면은 유형 필터로 기본 표시에서 제외 |\n| I-11 | Claude API 월 예산 상한 | CLI로 먼저 분류·추출을 돌려 비용을 실측한 뒤 정한다. 분류는 1,010건에 $0.74(캐시 적중)~$2.39(첫 실행) 실측, 추출은
