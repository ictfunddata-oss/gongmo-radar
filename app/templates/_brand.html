{# 로고(레이더 아이콘 + 워드마크) — 수요자·운영 화면 공통. 스타일은 static/brand.css #}
{% macro brand(href, sub="") %}
<a class="logo brand" href="{{ href }}" style="text-decoration:none" aria-label="ICT기금 공모사업 AI RADAR{{ ' ' ~ sub if sub else '' }}">
    <svg class="radar" viewBox="0 0 40 40" width="34" height="34" aria-hidden="true">
      <defs><linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5fe0d0" stop-opacity="0"/><stop offset="1" stop-color="#5fe0d0" stop-opacity=".75"/></linearGradient></defs>
      <circle cx="20" cy="20" r="18" fill="rgba(255,255,255,.05)" stroke="#9fb4d8" stroke-width="1.4"/>
      <circle cx="20" cy="20" r="11.5" fill="none" stroke="#9fb4d8" stroke-width="1" opacity=".7"/>
      <circle cx="20" cy="20" r="5" fill="none" stroke="#9fb4d8" stroke-width="1" opacity=".5"/>
      <path d="M20 2v36M2 20h36" stroke="#9fb4d8" stroke-width=".7" opacity=".35"/>
      <g class="sweep"><path d="M20 20 L38 20 A18 18 0 0 0 31.4 6.1 Z" fill="url(#sweep)"/><path d="M20 20 L38 20" stroke="#5fe0d0" stroke-width="1.6" stroke-linecap="round"/></g>
      <circle class="blip" cx="27" cy="13.5" r="2.2" fill="#ffd166"/>
    </svg>
    <span class="bn">ICT기금 공모사업</span><span class="wm"><b>AI</b> RADAR</span>{% if sub %}<span class="sub">{{ sub }}</span>{% endif %}</a>
{% endmacro %}
